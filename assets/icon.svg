<!--
  The AuralFM globe. Drawn by Melton Bell III.

  Kept exactly as drawn. The disc is the ink and the continents are knocked out
  of it, which is why this needs no inverting: filling with currentColor gives
  the mark in whatever colour the surface wants, and the land stays open.

  This replaced two licensed Noun Project globes. It is the app's own mark now,
  at every size, in the Dock, the tray, the menus and the icon set.
-->
