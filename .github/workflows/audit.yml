# The gate that runs on every push.
#
# `npm run audit` is this project's test suite. There is no unit test runner and
# there is not going to be one for a while: what breaks here is not a function
# returning the wrong number, it is a preload method losing its IPC handler, a
# light-theme token drifting from its twin, or a corner radius invented outside
# the scale. Those are the checks, and every one of them was written after the
# bug it now catches got through.
#
# It runs on ubuntu rather than macos on purpose. The audit reads files and loads
# main-process modules; none of it needs a Mac, and a macOS runner costs ten
# times the minutes. The Mac is only needed to build a DMG, which is a separate
# job and not part of the gate.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts because postinstall vendors runtime libraries and
      # rebuilds native modules for Electron, neither of which the audit needs
      # and both of which are slow.
      - name: Install
        run: npm ci --ignore-scripts

      # The audit loads src/catalog.js, which needs the station bundle. That file
      # is generated by the crawl and gitignored, so on a fresh clone it is
      # absent and the search check has nothing to run against. Say so rather
      # than let it look like a pass.
      - name: Note what is not checkable here
        run: |
          if [ ! -f data/stations.min.json ]; then
            echo "::notice::data/stations.min.json is gitignored, so the search checks are skipped in CI. They run locally."
          fi

      - name: Audit
        run: npm run audit

      # Two steps, because one number cannot answer this honestly.
      #
      # The gate is what ships. Two runtime dependencies, and they must be clean.
      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

      # Electron is a devDependency by electron-builder convention but its
      # runtime is bundled into the app, so `--omit=dev` above does not cover it
      # and a green gate would be misleading. Printed on every run and never
      # allowed to block one: the fix is a major version bump, which is a tested
      # change and not something to be forced by a red build. Tracked as an
      # issue instead.
      - name: Advisories in build and runtime tooling (informational)
        continue-on-error: true
        run: |
          echo "::group::npm audit, all dependencies"
          npm audit --audit-level=high || true
          echo "::endgroup::"
          echo "::warning::Electron advisories are tracked in the Electron upgrade issue. This step never fails the build."

      # A generator that dirties the tree means something generated is tracked.
      # build/icon.icns was exactly that until it was gitignored, and a 1 MB
      # binary diff per build is easy to reintroduce by accident.
      #
      # Only `notices` is checked here. `icons` runs under Electron and needs a
      # display, so it cannot run on this runner — and a check that silently
      # passes because the thing it checks did not run is worse than no check.
      # The icons generator is covered by the local build instead.
      - name: Nothing generated is tracked
        run: |
          npm run notices --silent
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::npm run notices dirtied the tree, so a generated file is tracked:"
            git status --porcelain
            exit 1
          fi
