# Design review, on changes to the interface.
#
# Separate from audit.yml on purpose. That one is the gate: it runs on every
# push, it is free, and a red build there means something is broken. This is a
# second opinion on the interface, it costs a metered review per run, and it
# blocks only on `critical`.
#
# **It runs on pushes to main, and that has a budget.** The plan is 30 reviews per
# rolling 30 days, shared with the GitHub App. Work here goes straight to main
# rather than through pull requests, so a PR-only trigger would have meant this
# never ran at all — a check that cannot fire is worse than no check, because it
# looks like coverage.
#
# The arithmetic is real though: eight commits touched src/renderer on a single
# day recently, and at that rate the month is gone inside a week. Two things keep
# it honest. The paths filter below means only interface changes spend anything.
# And the everyday pass is not this file at all — it is a local `quick_review`
# while editing, at a fifth of a review, per CLAUDE.md.
#
# If the quota starts running out before the month does, the knob is here: drop
# `push` and keep `pull_request`, and it becomes a merge gate instead.
name: design

on:
  push:
    branches: [main]
    # A review of unchanged interface is a spent credit and a wasted minute.
    paths:
      - "src/renderer/**"
      - ".github/workflows/design.yml"
  pull_request:
    paths:
      - "src/renderer/**"
      - ".github/workflows/design.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because the action reviews what changed against the base,
      # and a shallow clone has no base to diff against.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: rams-design/rams-action@v1
        with:
          api-key: ${{ secrets.RAMS_API_KEY }}
          fail-on: critical
