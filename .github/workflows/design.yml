# Design review — parked on a manual trigger until the action is fixed.
#
# **The action cannot read its own api-key, and it is not our configuration.**
# Measured rather than assumed: a step in this workflow reported the secret
# arriving at the runner as 53 characters, beginning `rams_`, containing no
# whitespace — exactly the key. The runner echoes `api-key: ***` into the log, so
# a value was passed and masked, and the action still exits with "api-key is
# required".
#
# Four runs, three configurations, one error:
#   - rams-design/rams-action@v1                                    failed
#   - @v1 forcing node20 (the action declares node20 and the        failed
#     runner now defaults to Node 24 and warns about it)
#   - @master, in case the v1 tag lagged the branch                 failed
#
# So: `workflow_dispatch` only. Left in place rather than deleted, because the
# configuration is right and restoring it is one edit. A gate that fails on every
# push for a reason nobody here can fix is not a gate — it is noise that teaches
# people to ignore a red build, while looking like coverage.
#
# The path that works is unaffected, and it is the one that matters day to day: a
# local `quick_review` while editing, per CLAUDE.md. Same service, over MCP, and
# it found a real critical in the menu-bar panel.
#
# When the action is fixed, the triggers that belong here are:
#
#   on:
#     push:
#       branches: [main]
#       paths: ["src/renderer/**", ".github/workflows/design.yml"]
#     pull_request:
#       paths: ["src/renderer/**", ".github/workflows/design.yml"]
#     workflow_dispatch:
#
# Both filtered to interface paths, because the plan is 30 reviews per rolling 30
# days and eight commits touched src/renderer in a single day this week.
name: design

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because the action reviews what changed against the base,
      # and a shallow clone has no base to diff against.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: rams-design/rams-action@v1
        with:
          api-key: ${{ secrets.RAMS_API_KEY }}
          fail-on: critical
