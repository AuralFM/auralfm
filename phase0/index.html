<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlobeFM · phase 0</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel-2:#1b1f26; --line:#262b34;
    --text:#e8eaed; --dim:#8b93a1; --accent:#6ee7a0; --accent-dim:#2f6b4c;
    --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.45 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .app{width:100%; max-width:420px}

  header{display:flex; align-items:center; gap:8px; margin-bottom:18px; padding:0 2px}
  header img{opacity:.9}
  h1{font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0}
  header span{font-size:12px; color:var(--dim)}

  .stations{
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:hidden;
  }
  .st{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:12px 14px; background:none; border:0; border-top:1px solid var(--line);
    color:var(--text); font:inherit; text-align:left; cursor:pointer;
    transition:background .12s;
  }
  .st:first-child{border-top:0}
  .st:hover{background:var(--panel-2)}
  .st[aria-current="true"]{background:var(--panel-2)}
  .st[aria-current="true"] .nm{color:var(--accent)}

  .key{
    flex:none; width:20px; height:20px; border-radius:5px;
    background:#20252d; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums;
    display:grid; place-items:center;
  }
  .meta{min-width:0; flex:1}
  .nm{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sub{font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bars{flex:none; display:flex; gap:2px; align-items:flex-end; height:14px; opacity:0}
  .st[aria-current="true"] .bars{opacity:1}
  .bars i{width:2px; background:var(--accent); border-radius:1px; height:4px}
  body.playing .st[aria-current="true"] .bars i{animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s} .bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}

  .bar{
    margin-top:14px; padding:14px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px;
    display:flex; align-items:center; gap:12px;
  }
  #toggle{
    flex:none; width:40px; height:40px; border-radius:50%; border:0; cursor:pointer;
    background:var(--accent); color:#06120b; font-size:15px;
    display:grid; place-items:center; transition:transform .1s, opacity .15s;
  }
  #toggle:active{transform:scale(.93)}
  #toggle:disabled{opacity:.35; cursor:default}
  .now{flex:1; min-width:0}
  #nowName{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #status{font-size:12px; color:var(--dim)}
  #status.err{color:var(--err)}
  #status.live::before{
    content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-right:6px; vertical-align:1px;
  }
  #vol{width:74px; accent-color:var(--accent); flex:none}

  footer{margin-top:14px; font-size:12px; color:var(--dim); text-align:center; line-height:1.6}
  kbd{background:#20252d; border-radius:4px; padding:1px 5px; font:11px ui-monospace,monospace}
</style>
</head>
<body>
<div class="app">

  <header>
    <img src="../assets/icon.svg" alt="" width="18" height="18">
    <h1>GlobeFM</h1><span>phase 0</span>
  </header>

  <div class="stations" id="list"></div>

  <div class="bar">
    <button id="toggle" disabled aria-label="Play or pause">▶</button>
    <div class="now">
      <div id="nowName">Nothing playing</div>
      <div id="status">Pick a station</div>
    </div>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div>

  <footer>
    <kbd>space</kbd> play/pause · <kbd>1</kbd>–<kbd>7</kbd> tune · <kbd>esc</kbd> stop
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT HERE. Swap these for stations you actually listen to.
   Every URL below was verified returning live audio on 2026-08-01.
   ───────────────────────────────────────────────────────────── */
const STATIONS = [
  { name:"NTS 1",            where:"London · eclectic",        url:"https://streams.radiomast.io/nts1" },
  { name:"WFMU",             where:"Jersey City · freeform",   url:"https://stream0.wfmu.org/freeform-128k" },
  { name:"FIP",              where:"Paris · everything",       url:"https://icecast.radiofrance.fr/fip-midfi.mp3" },
  { name:"KCRW Eclectic24",  where:"Santa Monica · curated",   url:"https://streams.kcrw.com/e24_mp3" },
  { name:"WWOZ",             where:"New Orleans · jazz, roots",url:"https://wwoz-sc.streamguys1.com/wwoz-hi.mp3" },
  { name:"Radio Paradise",   where:"Paradise CA · rock mix",   url:"https://stream.radioparadise.com/aac-128" },
  { name:"KEXP",             where:"Seattle · eclectic",       url:"http://live-mp3-128.kexp.org/kexp128.mp3" },
];

const audio = new Audio();
audio.preload = "none";
audio.crossOrigin = "anonymous";

const list=document.getElementById("list"), toggle=document.getElementById("toggle"),
      nowName=document.getElementById("nowName"), status=document.getElementById("status"),
      vol=document.getElementById("vol");
let current=null, watchdog=null, gen=0;   // gen invalidates callbacks from abandoned loads

STATIONS.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="st"; b.type="button"; b.dataset.i=i;
  b.innerHTML=`<span class="key">${i+1}</span>
    <span class="meta"><span class="nm"></span><div class="sub"></div></span>
    <span class="bars"><i></i><i></i><i></i></span>`;
  b.querySelector(".nm").textContent=s.name;
  b.querySelector(".sub").textContent=s.where;
  b.onclick=()=>select(i);
  list.appendChild(b);
});

function setStatus(msg,cls=""){ status.textContent=msg; status.className=cls; }

function select(i){
  if(current===i){ audio.paused ? play() : stop(); return; }
  current=i;
  const s=STATIONS[i];
  [...list.children].forEach((el,n)=>el.setAttribute("aria-current", n===i));
  nowName.textContent=s.name;
  toggle.disabled=false;
  localStorage.setItem("gfm:last", i);
  play();
}

function play(){
  const s=STATIONS[current]; if(!s) return;
  const my = ++gen;                       // anything older than this is stale
  setStatus("Connecting…"); document.body.classList.remove("playing");
  // Fresh src every time — live streams go stale if you reuse a buffer.
  audio.src = s.url + (s.url.includes("?") ? "&" : "?") + "_=" + Date.now();
  audio.load();
  audio.play().catch(err => {
    if(my !== gen) return;                // a newer station took over; not an error
    if(err.name === "AbortError") return; // interrupted by our own reload
    fail(err.name === "NotAllowedError"
      ? "Browser blocked autoplay — press play"
      : "Could not connect");
  });
  clearTimeout(watchdog);
  // Some streams (WFMU, FIP) need 8-10s to hand over first audio. 15s is the real ceiling.
  watchdog = setTimeout(()=>{
    if(my === gen && (audio.paused || !audio.currentTime)) fail("Stream not responding");
  }, 15000);
}

function stop(){
  clearTimeout(watchdog); gen++;   // silence any in-flight callbacks
  audio.pause();
  audio.removeAttribute("src");   // actually drops the connection
  audio.load();
  toggle.textContent="▶";
  document.body.classList.remove("playing");
  setStatus("Stopped");
}

function fail(msg){
  clearTimeout(watchdog);
  document.body.classList.remove("playing");
  toggle.textContent="▶";
  const http = STATIONS[current]?.url.startsWith("http://");
  setStatus(http ? msg+" — HTTP-only stream, blocked here" : msg, "err");
}

audio.addEventListener("playing", ()=>{
  clearTimeout(watchdog);
  toggle.textContent="❚❚";
  document.body.classList.add("playing");
  setStatus("Live", "live");
});
audio.addEventListener("waiting", ()=>{ if(!audio.paused) setStatus("Buffering…"); });
audio.addEventListener("error", ()=>{
  // code 1 = MEDIA_ERR_ABORTED, which is just us swapping stations.
  if(current===null || !audio.error || audio.error.code===1) return;
  fail("Stream unavailable");
});

toggle.onclick = ()=> audio.paused ? play() : stop();

vol.oninput = ()=>{ audio.volume = vol.value; localStorage.setItem("gfm:vol", vol.value); };
vol.value = localStorage.getItem("gfm:vol") ?? 0.8;
audio.volume = vol.value;

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); current===null ? select(0) : (audio.paused?play():stop()); }
  else if(e.key==="Escape") stop();
  else if(/^[1-9]$/.test(e.key) && +e.key<=STATIONS.length) select(+e.key-1);
});

// Restore last station without auto-playing.
const last = localStorage.getItem("gfm:last");
if(last!==null && STATIONS[last]){
  current=+last;
  [...list.children].forEach((el,n)=>el.setAttribute("aria-current", n===+last));
  nowName.textContent=STATIONS[last].name;
  toggle.disabled=false;
  setStatus("Press play");
}
</script>
</body>
</html>
