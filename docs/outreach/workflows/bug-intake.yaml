# React 🐛 to a report in #build and the reporter gets asked for the four things
# that make it fixable — privately, so the channel is not filled with process.
#
# QSL does this conversationally when addressed. This is the version that works
# when nobody addressed anybody, which is most of the time.
name: Bug report intake
description: >
  React with 🐛 to a problem report and the reporter is asked for the four
  details that make it actionable.
trigger:
  on: reaction_added
  emoji: bug
enabled: true
steps:
  - id: dm-the-four-things
    action: send_dm
    to: "{{trigger.author}}"
    text: |
      Thanks for reporting that. Four things make it fixable, and the first two
      are almost always the answer:

      1. **macOS version**, and **Intel or Apple Silicon** — Apple menu → About This Mac
      2. **App version** — AuralFM → About AuralFM
      3. **What you did**, in the order you did it
      4. **What happened instead**, and a screenshot if there is anything to see

      Post them in **#build** and it can be looked at properly.

      Some things that look like bugs and are not:

      - A shortwave receiver that will not connect is usually **full**. Eight
        listener slots, shared with the whole internet. Try another.
      - Nothing audible on a scheduled frequency often means the **band is
        closed**, not that the app is broken. The line above the list says
        whether the higher bands are carrying.
      - **Captions are off and staying off.** They work and are too slow to be
        usable on current hardware. That was measured, not guessed.
