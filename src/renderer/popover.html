<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Tightened after live captions were removed. That feature downloaded a
           model from HuggingFace and ran it under WebAssembly, so this line
           carried 'wasm-unsafe-eval' and four hf.co origins in connect-src. The
           feature has been gone for a while; the permissions had not. This CSP
           line was the only remaining mention of huggingface, wasm or captions
           anywhere in src/, so the window could still reach a third-party CDN and
           execute WebAssembly for no reason at all.

           What is left is what this window actually does: no fetch() calls at
           all, WebSockets for KiwiSDR (which serves no wss, hence ws:), and
           audio from wherever a station streams from, which is what media-src *
           is for and why it cannot be narrowed. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; font-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'; media-src *; connect-src 'self' ws: wss:;">
<title>AuralFM</title>
<style>
  /* Inter, vendored. SIL Open Font License 1.1, which explicitly permits
     bundling and redistribution — see assets/fonts/Inter-LICENSE.txt.
     One variable file covers every weight the app uses.
     The point is not that Inter beats SF on a Mac; it is that the app looks
     like itself on Windows, Linux and Android too, where there is no SF. */
  @font-face{
    font-family:"Inter";
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
    src:url("../../assets/fonts/InterVariable.woff2") format("woff2");
  }
  /* Colors follow AppKit's label/fill hierarchy and system palette so the panel
     reads as part of macOS rather than a web page pretending to be one. */
  /* UA controls follow the app, not the OS. See explore.html for why. */
  :root{ color-scheme: light dark; }
  :root[data-theme="light"]{ color-scheme: light; }
  :root[data-theme="dark"]{ color-scheme: dark; }

  :root{
    /* Corner radii. Thirteen distinct values became five. Not one value for
       everything -- a 2px meter bar and a floating panel genuinely differ --
       but a scale, so nested corners stay concentric instead of arbitrary. */
    --r-sm:5px; --r-md:7px; --r-lg:10px; --r-xl:14px; --r-pill:999px;
    --label:rgba(247,244,238,.94); --label2:rgba(247,244,238,.56); --label3:rgba(247,244,238,.30);
    --fill:rgba(233,226,212,.08); --fill-hi:rgba(233,226,212,.13);
    --line:rgba(233,226,212,.11);
    --edge-hi:rgba(247,244,238,.13); --edge-lo:rgba(0,0,0,.55);
    --accent:#E9E2D4;          /* bone — the brand, and the default palette */
    --bg:#0C0B0B;              /* onyx, same stop the icon and splash use */
    --err:#E0574A;             /* warmed off systemRed */
    --star:#F5F0E4;
    --on-accent:#12100F;
    /* The raised surface the output menu sits on. It was used and never
       defined here, so the menu drew with no background at all, straight over
       the favourites. Same values as explore.html. */
    --pane:rgba(30,27,25,.62);
    /* Motion tokens, same set as explore.html. */
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --ease-drawer:cubic-bezier(.32,.72,0,1);
    --dur-press:90ms; --dur-hover:.12s; --dur-control:.15s;
    --dur-panel:.22s; --dur-reveal:.42s;
  }
  /* System appearance, unless Settings has forced the other one. Explicit wins
     in both directions, which is the whole point of an appearance override. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
    --edge-hi:rgba(255,255,255,.75); --edge-lo:rgba(23,21,20,.16);
    --label:rgba(23,21,20,.88); --label2:rgba(23,21,20,.52); --label3:rgba(23,21,20,.26);
    --fill:rgba(23,21,20,.05); --fill-hi:rgba(23,21,20,.09);
    --line:rgba(23,21,20,.10);
    --edge-hi:rgba(255,255,255,.75); --edge-lo:rgba(23,21,20,.16);
    --accent:#2A2622;        /* onyx: the brand's light-mode accent */
    --err:#C4362B;
    --star:#8A6D1F;
    --on-accent:#F7F4EE;
    --bg:#FFFFFF;
    --pane:rgba(255,255,255,.72);
    }
  }
  :root[data-theme="light"]{
    --edge-hi:rgba(255,255,255,.75); --edge-lo:rgba(23,21,20,.16);
    --label:rgba(23,21,20,.88); --label2:rgba(23,21,20,.52); --label3:rgba(23,21,20,.26);
    --fill:rgba(23,21,20,.05); --fill-hi:rgba(23,21,20,.09);
    --line:rgba(23,21,20,.10);
    --accent:#2A2622;        /* onyx: the brand's light-mode accent */
    --err:#C4362B;
    --star:#8A6D1F;
    --on-accent:#F7F4EE;
    --bg:#FFFFFF;
    --pane:rgba(255,255,255,.72);
  }
  /* A forced theme has to paint its own backdrop: the vibrancy material behind
     the window still follows the OS, so transparency would show the wrong one. */
  :root[data-theme="light"] body,
  :root[data-theme="dark"] body,
  :root[data-contrast="more"] body{background:var(--bg)}
  :root[data-theme="dark"]{
    --label:rgba(247,244,238,.94); --label2:rgba(247,244,238,.56); --label3:rgba(247,244,238,.30);
    --fill:rgba(233,226,212,.08); --fill-hi:rgba(233,226,212,.13);
    --line:rgba(233,226,212,.11);
    --accent:#E9E2D4; --err:#E0574A; --star:#F5F0E4; --on-accent:#12100F; --bg:#0C0B0B;
    --pane:rgba(30,27,25,.62);
  }
  /* Vibrancy is a real material here; if the user has asked for less of it,
     go frosty-solid rather than shipping unreadable text over a busy desktop. */
  @media (prefers-reduced-transparency: reduce){
    body{background:var(--bg)}
  }
  /* Increased contrast follows the system setting until Settings overrides it. */
  @media (prefers-contrast: more){
    :root:not([data-contrast="normal"]){--label2:var(--label); --label3:var(--label2)}
    :root:not([data-contrast="normal"]) .row[aria-current="true"]{outline:1px solid var(--accent)}
  }
  /* Increased contrast. Deliberately NOT the CanvasText system keyword: that
     keyword tracks the OS appearance, so on a light Mac with the theme forced to
     Dark it paints black text on a dark background. These track our own theme. */
  :root[data-contrast="more"]{
    --label:#fff; --label2:#fff; --label3:rgba(255,255,255,.78);
    --line:rgba(255,255,255,.55); --bg:#000;
  }
  :root[data-contrast="more"][data-theme="light"]{
    --label:#000; --label2:#000; --label3:rgba(0,0,0,.75);
    --line:rgba(0,0,0,.55); --bg:#fff;
  }
  @media (prefers-color-scheme: light){
    :root[data-contrast="more"]:not([data-theme="dark"]){
      --label:#000; --label2:#000; --label3:rgba(0,0,0,.75);
      --line:rgba(0,0,0,.55); --bg:#fff;
    }
  }
  :root[data-contrast="more"] .row[aria-current="true"]{outline:1px solid var(--accent)}
  /* An explicit `display` in any rule below beats the [hidden] attribute, so
     hidden elements render anyway. This has been the root cause of four
     separate "the close button does nothing" bugs in this app. One global rule
     ends the category. */
  [hidden]{display:none !important}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:transparent;color:var(--label);
    /* System font first — it already ships optical sizing and tracking tables. */
    font:13px/1.35 "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
    display:flex;flex-direction:column;
  }

  /* Materialize from the tray icon: anchored to the top edge where the icon is,
     so the panel reads as coming *from* the icon.
     
     No blur. It used to animate filter:blur(6px) to none, and that cost a single
     frame of 530 to 1020 milliseconds every time the popover opened, measured
     four times in a row. Chromium has to build a filter layer before the first
     frame, and blur forces a full repaint of that layer where opacity and
     transform are handled by the compositor alone. The p50 was 16.9ms either
     way, so the animation was never the problem -- the first frame was. This is
     the lag Melton felt when the menu bar panel opened. */
  @keyframes materialize{
    from{opacity:0;transform:scale(.965) translateY(-6px)}
    to  {opacity:1;transform:none}
  }
  body.entering{animation:materialize .26s var(--ease-drawer);transform-origin:top center}
  @media (prefers-reduced-motion: reduce){
    body.entering{animation:none}
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* One unmistakable control instead of a wordmark plus an unlabelled glyph.
     The icon carries the brand; the label says what pressing it does. */

  /* The 9px replaces what the header used to give this. Removing that button
     left the field flush against the top edge of the panel. */
  body>.searchwrap:first-of-type{padding-top:9px}
  /* Help tag. Sized and timed like the system's, drawn like the app's.
     `pointer-events:none` matters: a tag that can be hovered would sit under the
     pointer, fire its own pointerout on the control beneath, and flicker. */
  .helptag{
    position:fixed;z-index:9000;pointer-events:none;
    max-width:230px;padding:5px 9px;border-radius:var(--r-md);
    background:var(--pane,rgba(30,27,25,.96));
    color:var(--label);border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.34);
    font-size:11.5px;line-height:1.35;letter-spacing:.002em;
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    opacity:0;transform:translateY(-2px);
    transition:opacity var(--dur-hover,.12s) var(--ease-out),
               transform var(--dur-hover,.12s) var(--ease-out);
  }
  .helptag.on{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){ .helptag{transition:none} }
  .searchwrap{
    padding:2px 12px 5px;flex:none;-webkit-app-region:no-drag;
    display:flex;align-items:center;gap:6px;
  }
  /* Same weight as the mute button: present, not competing with the search. */
  #openglobe{
    flex:none;background:none;border:0;color:var(--label2);
    padding:3px 2px;border-radius:var(--r-sm);cursor:default;line-height:0;
    transition:color var(--dur-hover) var(--ease-out),transform var(--dur-press) var(--ease-out);
  }
  #openglobe:hover{color:var(--label)}
  #openglobe:active{transform:scale(.9)}
  #openglobe svg{width:14px;height:14px;display:block}
  #q{
    width:100%;height:24px;padding:0 9px;border:0;border-radius:var(--r-md);
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:box-shadow var(--dur-control) var(--ease-out),background var(--dur-control) var(--ease-out);
  }
  #q:focus{background:var(--fill-hi);box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  #q::placeholder{color:var(--label2)}
  #q::-webkit-search-cancel-button{display:none}

  /* 11px semibold secondary, sentence case — the macOS sidebar header idiom.
     Small text gets a touch of positive tracking for legibility. */
  .secthead{
    padding:1px 15px 2px;font-size:11px;font-weight:590;letter-spacing:.005em;
    color:var(--label2);flex:none;
  }

  .list{
    flex:1;overflow-y:auto;padding:0 7px 6px;
    /* Scroll edge effect instead of a hard rule: content fades where it meets
       the floating transport bar. */
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
  }
  /**
   * A scrollbar, but only when there is something to scroll to.
   *
   * This was `width:0` — the list was genuinely scrollable and looked like it
   * ended. With six favourites the panel sizes to fit and nothing is hidden; go
   * past what the screen allows and the window stops growing, at which point
   * there is content below the fold and no indication of it. The mask fade
   * hints, quietly, and a hint is not an affordance.
   *
   * Slim and translucent rather than a system bar: it appears against the
   * content when the list overflows and reads as part of the panel.
   */
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-thumb{
    background:color-mix(in srgb, var(--label3) 55%, transparent);
    border-radius:var(--r-sm);
  }
  .list::-webkit-scrollbar-track{background:transparent}

  .row{
    display:flex;align-items:center;gap:9px;padding:3px 8px;border-radius:var(--r-md);
    transition:background var(--dur-hover) var(--ease-out);
  }
  .row:hover{background:var(--fill)}
  /* Feedback on press, not release. */
  .row:active{background:var(--fill-hi);transform:scale(.97);transition:transform var(--dur-press) var(--ease-out)}
  /* Selection is accent-tinted, the way AppKit tints a selected row, rather than
     a neutral gray that reads as muddy over the material. */
  .row[aria-current="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent)}
  .row[aria-current="true"] .nm{color:var(--accent);font-weight:590}
  .key{
    flex:none;width:16px;height:16px;border-radius:var(--r-sm);background:var(--fill);
    color:var(--label3);font-size:10px;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;
  }
  .key.blank{background:none}
  /* Past nine there is no key to press, so there is no key drawn — the number
     stays as a position. */
  .key.plain{background:none;color:var(--label3);opacity:.65}
  .meta{flex:1;min-width:0}
  .nm{font-weight:400;line-height:1.25;letter-spacing:-.002em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;line-height:1.2;letter-spacing:.005em;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star{
    flex:none;background:none;border:0;color:var(--label3);font-size:12px;
    padding:2px 3px;border-radius:var(--r-sm);cursor:default;opacity:0;line-height:1;
    transition:opacity var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out),transform var(--dur-press) var(--ease-out);
  }
  .row:hover .star{opacity:1}
  /* Hover was the only way to see it; a keyboard user tabbing onto it could not. */
  .row:focus-within .star,.star:focus-visible{opacity:1}
  .star:focus-visible,.row .meta:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r-sm)}
  .star.on{opacity:1;color:var(--star)}
  .star:hover{color:var(--star)}
  .star:active{transform:scale(.85)}
  .bars{flex:none;display:flex;gap:2px;align-items:flex-end;height:11px;width:8px;opacity:0}
  .row[aria-current="true"] .bars{opacity:1}
  /* Scaled, not resized. The bars used to animate `height`, which is layout
     on every frame of an infinite animation for as long as audio plays.
     scaleY from the base is the same picture, on the compositor. */
  .bars i{width:2px;background:var(--accent);border-radius:1px;height:11px;transform-origin:bottom;transform:scaleY(.27)}
  body.playing .row[aria-current="true"] .bars i{animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{transform:scaleY(.27)}50%{transform:scaleY(1)}}

  .empty{padding:26px 20px;text-align:center;color:var(--label3);font-size:12px;line-height:1.65}

  button svg{display:block}
  .bar{
    flex:none;display:flex;align-items:center;gap:11px;padding:7px 13px 9px;
    box-shadow:inset 0 .5px 0 var(--line);
  }

  #toggle{
    flex:none;width:34px;height:34px;border-radius:50%;border:0;cursor:default;
    background:var(--accent);color:var(--on-accent);font-size:15px;
    display:grid;place-items:center;
    transition:transform var(--dur-press) var(--ease-out),opacity var(--dur-control) var(--ease-out);
  }
  #toggle:active{transform:scale(.93)}
  #toggle:disabled{opacity:.28}
  button svg{display:block}
  .now{flex:1;min-width:0}
  #nowName{font-weight:510;font-size:12px;letter-spacing:-.002em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{font-size:11px;letter-spacing:.005em;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status.err{color:var(--err)}
  #status.live::before{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);margin-right:5px;vertical-align:1px;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #mute{
    flex:none;background:none;border:0;color:var(--label2);font-size:15px;line-height:1;
    padding:3px 2px;border-radius:var(--r-sm);cursor:default;
    transition:color var(--dur-hover) var(--ease-out),transform var(--dur-press) var(--ease-out);
  }
  #mute:hover{color:var(--label)}
  #mute:active{transform:scale(.9)}
  .outwrap{flex:none;display:flex;align-items:center;color:var(--label2)}
  /* One button, same as Explore. The permanent picker beside it spent the panel's
     scarcest resource — width — on a label for something nobody is changing. */
  #outbtn{
    background:none;border:0;color:var(--label2);font-size:14px;line-height:0;
    padding:2px 4px;border-radius:var(--r-sm);cursor:default;flex:none;
    display:grid;place-items:center;
    transition:color var(--dur-hover) var(--ease-out),background var(--dur-hover) var(--ease-out);
  }
  #outbtn:hover{color:var(--label)}
  #outbtn[aria-expanded="true"]{color:var(--accent);background:var(--fill)}
  .outmenu{
    position:fixed;z-index:9400;min-width:170px;max-width:260px;padding:5px;
    border-radius:var(--r-lg);background:var(--pane);border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(20px);
  }
  .outmenu button{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    appearance:none;border:0;border-radius:var(--r-md);background:none;
    color:var(--label);font:inherit;font-size:11.5px;padding:6px 8px;cursor:default;
    transition:background var(--dur-hover) var(--ease-out);
  }
  .outmenu button:hover,.outmenu button:focus-visible{background:var(--fill);outline:none}
  .outmenu button[aria-selected="true"]{color:var(--accent)}
  .outmenu .tick{flex:none;width:12px;opacity:0}
  .outmenu button[aria-selected="true"] .tick{opacity:1}
  .outmenu .devname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #vol{width:78px;accent-color:var(--accent);flex:none}
  #toggle{font-size:11px}
</style>
</head>
<body>

<!-- The "Explore the world" button lived here. It made sense when the menu bar
     was the way in and the globe was somewhere you went next. The globe opens
     first now, so a button to open the thing already in front of you is a row of
     dead space at the top of a panel that sizes itself to its content. Explore
     is still reachable four other ways: Cmd+G, the app menu, the tray's own
     context menu, and clicking the dock icon. -->

<div class="searchwrap">
  <input id="q" type="search" placeholder="Search station, city, or country" data-i18n-ph="app.searchPlaceholderExplore"
         data-i18n-title="app.searchPlaceholderExplore" title="Search station, city, or country"
         autocomplete="off" spellcheck="false">
  <!--
    The way back to the globe.
    It already existed twice — ⌘G in the app menu, and a right-click on the tray
    icon — and both are places you have to already know about. A menu bar panel
    is where most people meet this app, so the door out of it belongs here, in
    the open, rather than behind a gesture nobody performs on a menu bar icon.
  -->
  <button id="openglobe" data-i18n-title="menu.openGlobe" title="Open the Globe"
          aria-label="Open the Globe"></button>
</div>

<div class="secthead" id="secthead" data-i18n="app.favorites">Favorites</div>
<div class="list" id="list"></div>

<div class="bar">
  <!-- Named here as well as in script: an icon-only button with no name is
       announced as "button", and this is the control the whole panel exists
       for. The name follows the state; see setToggleName. -->
  <button id="toggle" disabled data-i18n-title="ctl.play" title="Play"></button>
  <div class="now">
    <div id="nowName" data-i18n="app.nothingPlaying">Nothing playing</div>
    <!-- The player's own state, announced. Every transition a listener cares
         about passes through here: finding, connecting, buffering, failed. -->
    <div id="status" role="status" aria-live="polite" data-i18n="app.searchStation">Search for a station</div>
  </div>
  <button id="mute" data-i18n-title="ctl.mute" title="Mute"></button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"
         data-i18n-title="ctl.volume" title="Volume">
  <!-- After the volume, matching Explore: where the sound goes and how loud it
       is are the same question asked twice. Hidden on a Mac with only one
       output, because a control with one option is furniture. -->
  <span class="outwrap" id="outwrap" hidden>
    <button id="outbtn" aria-haspopup="listbox" aria-expanded="false"
            data-i18n-title="ctl.output" title="Where the sound comes out"></button>
  </span>
</div>

<div id="outmenu" class="outmenu" role="listbox" hidden
     aria-label="Where the sound comes out"></div>

<script src="errors.js"></script>
<script src="tips.js"></script>
<script src="icons.js"></script>
<script src="kiwi.js"></script>
<script src="activatable.js"></script>
<script src="levels.js"></script>
<script src="popover.js"></script>
</body>
</html>
