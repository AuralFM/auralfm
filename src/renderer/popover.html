<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src *;">
<title>GlobeFM</title>
<style>
  /* Colors follow AppKit's label/fill hierarchy and system palette so the panel
     reads as part of macOS rather than a web page pretending to be one. */
  :root{
    --label:rgba(255,255,255,.92); --label2:rgba(255,255,255,.55); --label3:rgba(255,255,255,.28);
    --fill:rgba(255,255,255,.09); --fill-hi:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.10);
    --accent:#30D158;          /* systemGreen, dark */
    --err:#FF453A;             /* systemRed, dark   */
    --star:#FFD60A;            /* systemYellow, dark*/
    --on-accent:#00210F;
  }
  @media (prefers-color-scheme: light){
    :root{
      --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.50); --label3:rgba(0,0,0,.25);
      --fill:rgba(0,0,0,.05); --fill-hi:rgba(0,0,0,.09);
      --line:rgba(0,0,0,.09);
      --accent:#248A3D;        /* systemGreen dark-variant: legible on light glass */
      --err:#D70015;
      --star:#A16207;
      --on-accent:#fff;
    }
  }
  /* Vibrancy is a real material here; if the user has asked for less of it,
     go frosty-solid rather than shipping unreadable text over a busy desktop. */
  @media (prefers-reduced-transparency: reduce){
    body{background:Canvas}
  }
  @media (prefers-contrast: more){
    :root{--label:CanvasText; --label2:CanvasText; --line:CanvasText}
    .row[aria-current="true"]{outline:1px solid var(--accent)}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:transparent;color:var(--label);
    /* System font first — it already ships optical sizing and tracking tables. */
    font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
    display:flex;flex-direction:column;
  }

  /* Materialize from the tray icon: scale + blur in, anchored to the top edge
     where the icon is, so the panel reads as coming *from* the icon. */
  @keyframes materialize{
    from{opacity:0;transform:scale(.965) translateY(-6px);filter:blur(6px)}
    to  {opacity:1;transform:none;filter:none}
  }
  body.entering{animation:materialize .26s cubic-bezier(.32,.72,0,1);transform-origin:top center}
  @media (prefers-reduced-motion: reduce){
    body.entering{animation:none}
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  header{display:flex;align-items:center;gap:7px;padding:11px 13px 5px;-webkit-app-region:drag;flex:none}
  header img{width:14px;height:14px;opacity:.9}
  /* Tighter tracking as type grows — never one letter-spacing for all sizes. */
  header h1{font-size:13px;font-weight:590;margin:0;letter-spacing:-.006em}
  header .sp{flex:1}
  header button{
    -webkit-app-region:no-drag;background:none;border:0;color:var(--label2);
    font-size:14px;cursor:default;padding:2px 6px;border-radius:5px;line-height:1;
    transition:background .12s ease-out,color .12s ease-out;
  }
  header button:hover{background:var(--fill);color:var(--label)}
  header button:active{background:var(--fill-hi);transform:scale(.92)}

  .searchwrap{padding:3px 12px 7px;flex:none;-webkit-app-region:no-drag}
  #q{
    width:100%;height:24px;padding:0 9px;border:0;border-radius:6px;
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:box-shadow .15s ease-out,background .15s ease-out;
  }
  #q:focus{background:var(--fill-hi);box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  #q::placeholder{color:var(--label2)}
  #q::-webkit-search-cancel-button{display:none}

  /* 11px semibold secondary, sentence case — the macOS sidebar header idiom.
     Small text gets a touch of positive tracking for legibility. */
  .secthead{
    padding:3px 15px 3px;font-size:11px;font-weight:590;letter-spacing:.005em;
    color:var(--label2);flex:none;
  }

  .list{
    flex:1;overflow-y:auto;padding:0 7px 6px;
    /* Scroll edge effect instead of a hard rule: content fades where it meets
       the floating transport bar. */
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
  }
  .list::-webkit-scrollbar{width:0}

  .row{
    display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;
    transition:background .12s ease-out;
  }
  .row:hover{background:var(--fill)}
  /* Feedback on press, not release. */
  .row:active{background:var(--fill-hi);transform:scale(.988);transition:transform 90ms ease-out}
  /* Selection is accent-tinted, the way AppKit tints a selected row, rather than
     a neutral gray that reads as muddy over the material. */
  .row[aria-current="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent)}
  .row[aria-current="true"] .nm{color:var(--accent);font-weight:590}
  .key{
    flex:none;width:16px;height:16px;border-radius:4px;background:var(--fill);
    color:var(--label3);font-size:10px;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;
  }
  .key.blank{background:none}
  .meta{flex:1;min-width:0}
  .nm{font-weight:400;letter-spacing:-.002em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;letter-spacing:.005em;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star{
    flex:none;background:none;border:0;color:var(--label3);font-size:12px;
    padding:2px 3px;border-radius:4px;cursor:default;opacity:0;line-height:1;
    transition:opacity .12s ease-out,color .12s ease-out,transform 90ms ease-out;
  }
  .row:hover .star{opacity:1}
  .star.on{opacity:1;color:var(--star)}
  .star:hover{color:var(--star)}
  .star:active{transform:scale(.85)}
  .bars{flex:none;display:flex;gap:2px;align-items:flex-end;height:11px;width:8px;opacity:0}
  .row[aria-current="true"] .bars{opacity:1}
  .bars i{width:2px;background:var(--accent);border-radius:1px;height:3px}
  body.playing .row[aria-current="true"] .bars i{animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:3px}50%{height:11px}}

  .empty{padding:26px 20px;text-align:center;color:var(--label3);font-size:12px;line-height:1.65}

  .bar{
    flex:none;display:flex;align-items:center;gap:11px;padding:9px 13px 11px;
    box-shadow:inset 0 .5px 0 var(--line);
  }
  #toggle{
    flex:none;width:30px;height:30px;border-radius:50%;border:0;cursor:default;
    background:var(--accent);color:var(--on-accent);font-size:10px;
    display:grid;place-items:center;
    transition:transform 90ms ease-out,opacity .15s ease-out;
  }
  #toggle:active{transform:scale(.93)}
  #toggle:disabled{opacity:.28}
  .now{flex:1;min-width:0}
  #nowName{font-weight:510;font-size:12px;letter-spacing:-.002em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{font-size:11px;letter-spacing:.005em;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status.err{color:var(--err)}
  #status.live::before{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);margin-right:5px;vertical-align:1px;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #vol{width:56px;accent-color:var(--accent);flex:none}
</style>
</head>
<body>

<header>
  <img src="../../assets/icon.svg" alt="">
  <h1>GlobeFM</h1>
  <span class="sp"></span>
</header>

<div class="searchwrap">
  <input id="q" type="search" placeholder="Search station, city, or country" autocomplete="off" spellcheck="false">
</div>

<div class="secthead" id="secthead">Favorites</div>
<div class="list" id="list"></div>

<div class="bar">
  <button id="toggle" disabled>▶</button>
  <div class="now">
    <div id="nowName">Nothing playing</div>
    <div id="status">Search for a station</div>
  </div>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
</div>

<script>
const $ = (id) => document.getElementById(id);
const listEl=$("list"), qEl=$("q"), headEl=$("secthead"), toggle=$("toggle"),
      nowName=$("nowName"), statusEl=$("status"), vol=$("vol");

const audio = new Audio();
audio.preload = "none";

let state = { favorites: [], vol: 0.8 };
let rows = [];          // what's currently rendered
let current = null;     // the channel object playing
let gen = 0, watchdog = null, searchSeq = 0, debounce = null;

const setStatus=(m,c="")=>{ statusEl.textContent=m; statusEl.className=c; };
const persist=()=> window.globefm.setState(state);
const isFav=(id)=> state.favorites.some(f=>f.id===id);

// ── rendering ────────────────────────────────────────────────────────────────
function render(items, {numbered=false, empty="", showTags=false}={}) {
  rows = items;
  listEl.innerHTML = "";
  if (!items.length) {
    listEl.innerHTML = `<div class="empty">${empty}</div>`;
    fitHeight();
    return;
  }
  items.forEach((ch, i) => {
    const el = document.createElement("div");
    el.className = "row";
    el.setAttribute("aria-current", current?.id === ch.id);
    el.innerHTML =
      // Empty chips read as broken placeholders; reserve the width without the fill.
      (numbered && i < 9 ? `<span class="key">${i+1}</span>` : `<span class="key blank"></span>`) +
      `<span class="meta"><span class="nm"></span><div class="sub"></div></span>` +
      `<button class="star${isFav(ch.id)?" on":""}" title="Favorite">${isFav(ch.id)?"★":"☆"}</button>` +
      `<span class="bars"><i></i><i></i><i></i></span>`;
    el.querySelector(".nm").textContent = ch.title;
    const tags = showTags && ch.tags?.length ? ch.tags.slice(0, 2).join(", ") : null;
    el.querySelector(".sub").textContent =
      [ch.place, tags || ch.country].filter(Boolean).join(" · ");
    el.onclick = (e) => {
      if (e.target.closest(".star")) return;
      if (current?.id === ch.id && !audio.paused) stop(); else tune(ch);
    };
    el.querySelector(".star").onclick = (e) => { e.stopPropagation(); toggleFav(ch); };
    listEl.appendChild(el);
  });
  fitHeight();
}

/** Ask main to size the window to the content, the way an AppKit popover does. */
function fitHeight() {
  const chrome = document.querySelector("header").offsetHeight
    + document.querySelector(".searchwrap").offsetHeight
    + headEl.offsetHeight
    + document.querySelector(".bar").offsetHeight;
  // Sum the rows rather than reading listEl.scrollHeight: the list is flex-grown,
  // and scrollHeight never reports less than the box itself, so it would just
  // echo the current window height back and the panel would never shrink.
  let content = 0;
  for (const el of listEl.children) content += el.offsetHeight;
  window.globefm.setHeight(chrome + content + 12);
}

function showFavorites() {
  headEl.textContent = "Favorites";
  render(state.favorites, {
    numbered: true,
    empty: "No favorites yet.<br>Search for a station and tap ☆ to save it.",
  });
}

function toggleFav(ch) {
  const i = state.favorites.findIndex(f => f.id === ch.id);
  if (i >= 0) state.favorites.splice(i, 1);
  else state.favorites.push({ id:ch.id, title:ch.title, place:ch.place, country:ch.country, secure:ch.secure });
  persist();
  qEl.value.trim() ? render(rows, {numbered:false}) : showFavorites();
}

// ── search ───────────────────────────────────────────────────────────────────
qEl.addEventListener("input", () => {
  clearTimeout(debounce);
  const q = qEl.value.trim();
  if (!q) { showFavorites(); return; }
  debounce = setTimeout(async () => {
    const seq = ++searchSeq;
    const results = await window.globefm.search(q, 60);
    if (seq !== searchSeq) return;              // a newer keystroke already won
    headEl.textContent = `${results.length} result${results.length===1?"":"s"}`;
    render(results, { showTags: true, empty: "Nothing found.<br>Try a city, country, or genre." });
  }, 120);
});

// ── playback ─────────────────────────────────────────────────────────────────
/** Always resolves and plays `ch`. Toggle logic lives at the call sites. */
async function tune(ch) {
  current = ch;
  nowName.textContent = ch.title;
  toggle.disabled = false;
  state.lastChannel = ch; persist();
  [...listEl.children].forEach((el,i)=> el.setAttribute?.("aria-current", rows[i]?.id === ch.id));

  const my = ++gen;
  setStatus("Finding stream…");
  document.body.classList.remove("playing");

  const res = await window.globefm.resolve(ch);
  if (my !== gen) return;
  if (!res) { fail("No stream available"); return; }
  start(res.url, my);
}

function start(url, my) {
  audio.src = url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
  audio.load();
  setStatus("Connecting…");
  audio.play().catch(err => {
    if (my !== gen || err.name === "AbortError") return;
    fail("Could not connect");
  });
  clearTimeout(watchdog);
  // Streams routinely take 8-11s to hand over first audio; 15s is the real ceiling.
  watchdog = setTimeout(() => {
    if (my === gen && (audio.paused || !audio.currentTime)) fail("Stream not responding");
  }, 15000);
}

function stop(){
  clearTimeout(watchdog); gen++;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  toggle.textContent = "▶";
  document.body.classList.remove("playing");
  setStatus("Stopped");
  window.globefm.setTrayTitle("");
}

function fail(msg){
  clearTimeout(watchdog);
  document.body.classList.remove("playing");
  toggle.textContent = "▶";
  setStatus(msg, "err");
  window.globefm.setTrayTitle("");
}

audio.addEventListener("playing", () => {
  clearTimeout(watchdog);
  toggle.textContent = "❚❚";
  document.body.classList.add("playing");
  setStatus([current?.place, current?.country].filter(Boolean).join(" · ") || "Live", "live");
  window.globefm.setTrayTitle(current?.title || "");
});
audio.addEventListener("waiting", () => { if (!audio.paused) setStatus("Buffering…"); });
audio.addEventListener("error", () => {
  if (!current || !audio.error || audio.error.code === 1) return;
  fail("Stream unavailable");
});

toggle.onclick = () => {
  if (!current) return;
  audio.paused ? tune(current) : stop();
};
vol.oninput = () => { audio.volume = vol.value; state.vol = +vol.value; persist(); };

// ── keys ─────────────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  const typing = e.target === qEl;
  if (e.key === "Escape") {
    if (typing && qEl.value) { qEl.value=""; showFavorites(); qEl.blur(); }
    else window.globefm.hide();
    return;
  }
  if (e.key === "Enter" && typing && rows.length) { tune(rows[0]); return; }
  if (typing) return;                       // don't steal keys while searching
  if (e.code === "Space") { e.preventDefault(); if (current) audio.paused ? tune(current) : stop(); }
  else if (/^[1-9]$/.test(e.key)) {
    const f = state.favorites[+e.key - 1];
    if (f) tune(f);
  }
});

// Replay the entrance each time the popover is shown (the window is reused).
window.globefm.onShown(() => {
  document.body.classList.remove("entering");
  void document.body.offsetWidth;          // force reflow so the animation restarts
  document.body.classList.add("entering");
  qEl.focus({ preventScroll: true });
});

// ── boot ─────────────────────────────────────────────────────────────────────
(async () => {
  const saved = await window.globefm.getState();
  state = { favorites: [], vol: 0.8, ...(saved || {}) };
  if (!Array.isArray(state.favorites)) state.favorites = [];
  vol.value = state.vol ?? 0.8;
  audio.volume = vol.value;

  if (state.lastChannel) {
    current = state.lastChannel;
    nowName.textContent = current.title;
    toggle.disabled = false;
    setStatus("Press play");
  }
  showFavorites();

  const s = await window.globefm.stats();
  if (!s.channels) {
    headEl.textContent = "No catalog";
    render([], { empty: "No station data yet.<br>Run <b>npm run crawl</b> to build it." });
  } else {
    qEl.placeholder = `Search ${s.channels.toLocaleString()} stations`;
  }
})();
</script>
</body>
</html>
