<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src *;">
<title>GlobeFM</title>
<style>
  :root{
    --text:#f2f3f5; --dim:#9aa3b2; --line:rgba(255,255,255,.09);
    --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
    --accent:#6ee7a0; --err:#ff7a7a;
  }
  @media (prefers-color-scheme: light){
    :root{
      --text:#16181d; --dim:#666e7d; --line:rgba(0,0,0,.09);
      --hover:rgba(0,0,0,.04); --sel:rgba(0,0,0,.07);
      --accent:#12855a; --err:#c0392b;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:transparent; color:var(--text);
    font:13px/1.4 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none; cursor:default;
    display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:center; gap:7px;
    padding:11px 13px 9px; -webkit-app-region:drag; flex:none;
  }
  header img{width:15px;height:15px;opacity:.85}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sp{flex:1}
  header button{
    -webkit-app-region:no-drag; background:none;border:0;color:var(--dim);
    font-size:15px;cursor:default;padding:2px 5px;border-radius:5px;line-height:1;
  }
  header button:hover{background:var(--hover);color:var(--text)}

  .list{flex:1; overflow-y:auto; padding:0 7px}
  .list::-webkit-scrollbar{width:0}

  .st{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:8px 9px;background:none;border:0;border-radius:7px;
    color:var(--text);font:inherit;text-align:left;cursor:default;
  }
  .st:hover{background:var(--hover)}
  .st[aria-current="true"]{background:var(--sel)}
  .st[aria-current="true"] .nm{color:var(--accent);font-weight:600}
  .key{
    flex:none;width:17px;height:17px;border-radius:4px;background:var(--hover);
    color:var(--dim);font-size:10px;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;
  }
  .meta{flex:1;min-width:0}
  .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bars{flex:none;display:flex;gap:2px;align-items:flex-end;height:12px;opacity:0}
  .st[aria-current="true"] .bars{opacity:1}
  .bars i{width:2px;background:var(--accent);border-radius:1px;height:3px}
  body.playing .st[aria-current="true"] .bars i{animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}

  .bar{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:10px 13px;border-top:1px solid var(--line);
  }
  #toggle{
    flex:none;width:32px;height:32px;border-radius:50%;border:0;cursor:default;
    background:var(--accent);color:#04140c;font-size:12px;display:grid;place-items:center;
  }
  #toggle:disabled{opacity:.3}
  .now{flex:1;min-width:0}
  #nowName{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{font-size:11px;color:var(--dim)}
  #status.err{color:var(--err)}
  #status.live::before{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);margin-right:5px;vertical-align:1px;
  }
  #vol{width:62px;accent-color:var(--accent);flex:none}
</style>
</head>
<body>

<header>
  <img src="../../assets/icon.svg" alt="">
  <h1>GlobeFM</h1>
  <span class="sp"></span>
  <button id="close" title="Close">×</button>
</header>

<div class="list" id="list"></div>

<div class="bar">
  <button id="toggle" disabled>▶</button>
  <div class="now">
    <div id="nowName">Nothing playing</div>
    <div id="status">Pick a station</div>
  </div>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
</div>

<script>
/* Phase 1 still ships a hardcoded list. Phase 2 replaces this with the
   crawled catalog + search + favorites. */
const STATIONS = [
  { name:"NTS 1",           where:"London · eclectic",      url:"https://streams.radiomast.io/nts1" },
  { name:"WFMU",            where:"Jersey City · freeform", url:"https://stream0.wfmu.org/freeform-128k" },
  { name:"FIP",             where:"Paris · everything",     url:"https://icecast.radiofrance.fr/fip-midfi.mp3" },
  { name:"KCRW Eclectic24", where:"Santa Monica · curated", url:"https://streams.kcrw.com/e24_mp3" },
  { name:"WWOZ",            where:"New Orleans · jazz",     url:"https://wwoz-sc.streamguys1.com/wwoz-hi.mp3" },
  { name:"Radio Paradise",  where:"Paradise CA · rock",     url:"https://stream.radioparadise.com/aac-128" },
  { name:"KEXP",            where:"Seattle · eclectic",     url:"http://live-mp3-128.kexp.org/kexp128.mp3" },
];

const audio = new Audio();
audio.preload = "none";

const list=document.getElementById("list"), toggle=document.getElementById("toggle"),
      nowName=document.getElementById("nowName"), status=document.getElementById("status"),
      vol=document.getElementById("vol");
let current=null, watchdog=null, gen=0, state={};

STATIONS.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="st"; b.type="button";
  b.innerHTML=`<span class="key">${i+1}</span>
    <span class="meta"><span class="nm"></span><div class="sub"></div></span>
    <span class="bars"><i></i><i></i><i></i></span>`;
  b.querySelector(".nm").textContent=s.name;
  b.querySelector(".sub").textContent=s.where;
  b.onclick=()=>select(i);
  list.appendChild(b);
});

const setStatus=(m,c="")=>{status.textContent=m;status.className=c;};
const persist=()=>window.globefm.setState(state);

function select(i){
  if(current===i){ audio.paused ? play() : stop(); return; }
  current=i;
  [...list.children].forEach((el,n)=>el.setAttribute("aria-current", n===i));
  nowName.textContent=STATIONS[i].name;
  toggle.disabled=false;
  state.last=i; persist();
  play();
}

function play(){
  const s=STATIONS[current]; if(!s) return;
  const my=++gen;
  setStatus("Connecting…"); document.body.classList.remove("playing");
  audio.src = s.url + (s.url.includes("?")?"&":"?") + "_=" + Date.now();
  audio.load();
  audio.play().catch(err=>{
    if(my!==gen || err.name==="AbortError") return;
    fail("Could not connect");
  });
  clearTimeout(watchdog);
  watchdog=setTimeout(()=>{
    if(my===gen && (audio.paused || !audio.currentTime)) fail("Stream not responding");
  },15000);
}

function stop(){
  clearTimeout(watchdog); gen++;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  toggle.textContent="▶";
  document.body.classList.remove("playing");
  setStatus("Stopped");
  window.globefm.setTrayTitle("");
}

function fail(msg){
  clearTimeout(watchdog);
  document.body.classList.remove("playing");
  toggle.textContent="▶";
  setStatus(msg,"err");
  window.globefm.setTrayTitle("");
}

audio.addEventListener("playing",()=>{
  clearTimeout(watchdog);
  toggle.textContent="❚❚";
  document.body.classList.add("playing");
  setStatus("Live","live");
  window.globefm.setTrayTitle(STATIONS[current].name);
});
audio.addEventListener("waiting",()=>{ if(!audio.paused) setStatus("Buffering…"); });
audio.addEventListener("error",()=>{
  if(current===null || !audio.error || audio.error.code===1) return;
  fail("Stream unavailable");
});

toggle.onclick=()=> audio.paused ? play() : stop();
document.getElementById("close").onclick=()=> window.globefm.hide();

vol.oninput=()=>{ audio.volume=vol.value; state.vol=vol.value; persist(); };

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); current===null?select(0):(audio.paused?play():stop()); }
  else if(e.key==="Escape") window.globefm.hide();
  else if(/^[1-9]$/.test(e.key) && +e.key<=STATIONS.length) select(+e.key-1);
});

// Restore prior session without auto-playing.
(async ()=>{
  state = (await window.globefm.getState()) ?? {};
  vol.value = state.vol ?? 0.8;
  audio.volume = vol.value;
  const i = state.last;
  if(Number.isInteger(i) && STATIONS[i]){
    current=i;
    [...list.children].forEach((el,n)=>el.setAttribute("aria-current", n===i));
    nowName.textContent=STATIONS[i].name;
    toggle.disabled=false;
    setStatus("Press play");
  }
})();
</script>
</body>
</html>
