<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<title>Explore</title>
<style>
  :root{
    --label:rgba(255,255,255,.92); --label2:rgba(255,255,255,.55); --label3:rgba(255,255,255,.28);
    --fill:rgba(255,255,255,.08); --fill-hi:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.10); --pane:rgba(30,30,32,.55);
    --accent:#30D158; --star:#FFD60A;
  }
  @media (prefers-color-scheme: light){
    :root{
      --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.50); --label3:rgba(0,0,0,.25);
      --fill:rgba(0,0,0,.05); --fill-hi:rgba(0,0,0,.09);
      --line:rgba(0,0,0,.09); --pane:rgba(255,255,255,.55);
      --accent:#248A3D; --star:#A16207;
    }
  }
  @media (prefers-reduced-transparency: reduce){ body{background:Canvas} .content{background:Canvas} }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;animation-duration:.01ms !important} }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:transparent;color:var(--label);
    font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
    display:flex;flex-direction:column;
  }

  /* Toolbar sits under the traffic lights (titleBarStyle: hiddenInset). */
  .toolbar{
    flex:none;height:52px;display:flex;align-items:center;gap:10px;
    padding:0 14px 0 84px;-webkit-app-region:drag;
  }
  .toolbar .seg, .toolbar input{-webkit-app-region:no-drag}
  h1{font-size:13px;font-weight:590;letter-spacing:-.006em;margin:0}
  .toolbar .sp{flex:1}

  /* Segmented control — the switch between List and Globe. */
  .seg{display:flex;background:var(--fill);border-radius:7px;padding:2px;gap:2px}
  .seg button{
    border:0;background:none;color:var(--label2);font:inherit;font-size:12px;
    padding:3px 11px;border-radius:5px;cursor:default;
    transition:background .14s ease-out,color .14s ease-out;
  }
  .seg button[aria-selected="true"]{background:var(--pane);color:var(--label);box-shadow:0 .5px 1.5px rgba(0,0,0,.18)}
  .seg button:disabled{opacity:.4}

  .cols{flex:1;display:flex;min-height:0}

  /* Left: places. Darker material — AppKit uses heavier surfaces for structure. */
  .places{
    width:266px;flex:none;display:flex;flex-direction:column;min-height:0;
    border-right:.5px solid var(--line);
  }
  .searchwrap{padding:0 12px 9px}
  #q{
    width:100%;height:24px;padding:0 9px;border:0;border-radius:6px;
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:box-shadow .15s ease-out,background .15s ease-out;
  }
  #q:focus{background:var(--fill-hi);box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  #q::placeholder{color:var(--label2)}
  #q::-webkit-search-cancel-button{display:none}

  .secthead{
    padding:2px 15px 5px;font-size:11px;font-weight:590;letter-spacing:.005em;color:var(--label2);flex:none;
  }

  .scroll{flex:1;overflow-y:auto;padding:0 7px 10px}
  .scroll::-webkit-scrollbar{width:0}

  .place{
    display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:6px;
    transition:background .12s ease-out;
  }
  .place:hover{background:var(--fill)}
  .place:active{background:var(--fill-hi);transform:scale(.99);transition:transform 90ms ease-out}
  .place[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .place[aria-selected="true"] .pn{color:var(--accent);font-weight:590}
  .pmeta{flex:1;min-width:0}
  .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.002em}
  .pc{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cnt{
    flex:none;font-size:10px;color:var(--label3);font-variant-numeric:tabular-nums;
    min-width:22px;text-align:right;
  }

  /* Globe pane. Swaps in for the places list; the stations pane never moves,
     which is what makes the shared selection obvious. */
  .globewrap{flex:1;position:relative;min-width:0;border-right:.5px solid var(--line)}
  #globe{position:absolute;inset:0}
  #globe canvas{display:block}
  .globehint{
    position:absolute;left:0;right:0;bottom:12px;text-align:center;
    font-size:11px;color:var(--label3);pointer-events:none;
  }
  /* In globe mode the globe takes the room and the station list narrows. */
  body.view-globe .places{display:none}
  body.view-globe .stations{width:330px;flex:none}

  /* Right: stations in the selected place. */
  .stations{flex:1;display:flex;flex-direction:column;min-height:0}
  .placehead{flex:none;padding:0 18px 10px}
  .placehead h2{margin:0;font-size:19px;font-weight:640;letter-spacing:-.018em;line-height:1.15}
  .placehead p{margin:2px 0 0;font-size:12px;color:var(--label2)}

  .st{
    display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;
    transition:background .12s ease-out;
  }
  .st:hover{background:var(--fill)}
  .st:active{background:var(--fill-hi);transform:scale(.994);transition:transform 90ms ease-out}
  .st[aria-current="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent)}
  .st[aria-current="true"] .sn{color:var(--accent);font-weight:590}
  .smeta{flex:1;min-width:0}
  .sn{letter-spacing:-.002em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stags{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star{
    flex:none;background:none;border:0;color:var(--label3);font-size:13px;
    padding:2px 4px;border-radius:4px;cursor:default;opacity:0;line-height:1;
    transition:opacity .12s ease-out,color .12s ease-out,transform 90ms ease-out;
  }
  .st:hover .star{opacity:1}
  .star.on{opacity:1;color:var(--star)}
  .star:active{transform:scale(.85)}
  .bars{flex:none;display:flex;gap:2px;align-items:flex-end;height:12px;width:8px;opacity:0}
  .st[aria-current="true"] .bars{opacity:1}
  .bars i{width:2px;background:var(--accent);border-radius:1px;height:3px}
  body.playing .st[aria-current="true"] .bars i{animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}

  .empty{padding:56px 28px;text-align:center;color:var(--label3);font-size:13px;line-height:1.7}

  /* Now-playing strip, mirroring the popover's transport bar. */
  .now{
    flex:none;display:flex;align-items:center;gap:9px;padding:9px 16px;
    box-shadow:inset 0 .5px 0 var(--line);font-size:12px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .now b{font-weight:590}
  .now span{color:var(--label2)}
</style>
</head>
<body>

<div class="toolbar">
  <h1>Explore</h1>
  <span class="sp"></span>
  <div class="seg" role="tablist">
    <button id="tabList" role="tab" aria-selected="true">List</button>
    <button id="tabGlobe" role="tab" aria-selected="false">Globe</button>
  </div>
</div>

<div class="cols">
  <div class="places">
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Search city or country" autocomplete="off" spellcheck="false">
    </div>
    <div class="secthead" id="placehead">Places</div>
    <div class="scroll" id="placelist"></div>
  </div>

  <div class="globewrap" id="globewrap" hidden>
    <div id="globe"></div>
    <div class="globehint" id="globehint">Loading globe…</div>
  </div>

  <div class="stations">
    <div class="placehead" id="head" hidden><h2></h2><p></p></div>
    <div class="scroll" id="stationlist">
      <div class="empty">Pick a place to hear what's on air there.</div>
    </div>
  </div>
</div>

<div class="now" id="now" hidden>
  <span class="dot" id="dot"></span>
  <b id="nowName"></b>
  <span id="nowStatus"></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const placeListEl=$("placelist"), stationListEl=$("stationlist"), qEl=$("q"),
      placeHeadEl=$("placehead"), headEl=$("head");

/**
 * Selection lives here, above the view, not inside it. The Globe view in the
 * next phase renders the same `selection` and calls the same selectPlace() —
 * switching views must never lose your place.
 */
const selection = { placeIndex: null, place: null, channels: [] };
let favorites = [];
let playing = null;          // channel currently playing, per the popover
let debounce = null, seq = 0;

const isFav = (id) => favorites.some((f) => f.id === id);

// ── places ───────────────────────────────────────────────────────────────────
async function loadPlaces(query = "") {
  const my = ++seq;
  const { total, places } = await window.globefm.places(query, 400);
  if (my !== seq) return;
  placeHeadEl.textContent = query.trim()
    ? `${total.toLocaleString()} place${total === 1 ? "" : "s"}`
    : `${total.toLocaleString()} places · most stations first`;

  placeListEl.innerHTML = "";
  if (!places.length) {
    placeListEl.innerHTML = `<div class="empty" style="padding:32px 16px">No place matches that.</div>`;
    return;
  }
  for (const p of places) {
    const el = document.createElement("div");
    el.className = "place";
    el.dataset.i = p.i;
    el.setAttribute("aria-selected", p.i === selection.placeIndex);
    el.innerHTML = `<span class="pmeta"><div class="pn"></div><div class="pc"></div></span>
                    <span class="cnt"></span>`;
    el.querySelector(".pn").textContent = p.title;
    el.querySelector(".pc").textContent = p.country;
    el.querySelector(".cnt").textContent = p.count;
    el.onclick = () => selectPlace(p.i);
    placeListEl.appendChild(el);
  }
  markPlaceSelection();
}

/**
 * Mark the selected place by index, not by comparing display text — the globe
 * can select a place that the list is currently filtered away from, and text
 * matching silently failed in exactly that case.
 */
function markPlaceSelection({ scroll = false } = {}) {
  let hit = null;
  for (const el of placeListEl.children) {
    if (!el.dataset?.i) continue;
    const on = Number(el.dataset.i) === selection.placeIndex;
    el.setAttribute("aria-selected", on);
    if (on) hit = el;
  }
  if (hit && scroll) hit.scrollIntoView({ block: "nearest" });
  return hit;
}

async function selectPlace(i) {
  const { place, channels } = await window.globefm.placeChannels(i);
  if (!place) return;
  selection.placeIndex = i;
  selection.place = place;
  selection.channels = channels;
  markPlaceSelection({ scroll: true });
  renderStations();
  refreshGlobeSelection();
}

// ── stations ─────────────────────────────────────────────────────────────────
function renderStations() {
  const { place, channels } = selection;
  headEl.hidden = false;
  headEl.querySelector("h2").textContent = place.title;
  headEl.querySelector("p").textContent =
    `${place.country} · ${channels.length} station${channels.length === 1 ? "" : "s"}`;

  stationListEl.innerHTML = "";
  if (!channels.length) {
    stationListEl.innerHTML = `<div class="empty">Nothing on air here.</div>`;
    return;
  }
  for (const ch of channels) {
    const el = document.createElement("div");
    el.className = "st";
    el.dataset.id = ch.id;
    el.setAttribute("aria-current", playing?.id === ch.id);
    el.innerHTML = `<span class="smeta"><div class="sn"></div><div class="stags"></div></span>
                    <button class="star${isFav(ch.id) ? " on" : ""}">${isFav(ch.id) ? "★" : "☆"}</button>
                    <span class="bars"><i></i><i></i><i></i></span>`;
    el.querySelector(".sn").textContent = ch.title;
    el.querySelector(".stags").textContent = ch.tags.length ? ch.tags.slice(0, 4).join(" · ") : "";
    el.onclick = (e) => { if (!e.target.closest(".star")) window.globefm.tune(ch); };
    el.querySelector(".star").onclick = (e) => { e.stopPropagation(); toggleFav(ch); };
    stationListEl.appendChild(el);
  }
}

async function toggleFav(ch) {
  const state = (await window.globefm.getState()) || {};
  favorites = Array.isArray(state.favorites) ? state.favorites : [];
  const i = favorites.findIndex((f) => f.id === ch.id);
  if (i >= 0) favorites.splice(i, 1);
  else favorites.push({ id:ch.id, title:ch.title, place:ch.place, country:ch.country, secure:ch.secure });
  state.favorites = favorites;
  await window.globefm.setState(state);
  renderStations();
}

// ── playback (observed, never performed here) ────────────────────────────────
window.globefm.onPlayerState((s) => {
  playing = s.playing ? s.channel : null;
  document.body.classList.toggle("playing", !!s.playing);
  const bar = $("now");
  if (!s.channel) { bar.hidden = true; }
  else {
    bar.hidden = false;
    $("nowName").textContent = s.channel.title;
    $("nowStatus").textContent = s.status || "";
    $("dot").style.display = s.playing ? "" : "none";
  }
  for (const el of stationListEl.children) {
    if (!el.dataset?.id) continue;
    el.setAttribute("aria-current", playing?.id === el.dataset.id);
  }
});

// ── globe view ───────────────────────────────────────────────────────────────
let globe = null, globeLoading = null, globePts = null, sunTimer = null;

/** Load the 1.7 MB globe bundle only when someone actually asks for the globe. */
function loadGlobeLib() {
  if (window.Globe) return Promise.resolve();
  if (globeLoading) return globeLoading;
  globeLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "vendor/globe.gl.min.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("globe.gl failed to load — run `npm run vendor`"));
    document.head.appendChild(s);
  });
  return globeLoading;
}

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/**
 * Sub-solar point: the lat/lng where the sun is directly overhead right now.
 * NOAA-style approximation — declination plus the equation of time, which is the
 * bit that stops the terminator drifting up to ~16 minutes off across the year.
 * Accurate to well under a degree, which is far finer than a globe this size can
 * show.
 */
function subsolarPoint(date = new Date()) {
  const rad = Math.PI / 180;
  const dayOfYear = (date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 86400000;
  const decl = -23.44 * Math.cos(rad * (360 / 365) * (dayOfYear + 10));
  const B = rad * (360 / 365) * (dayOfYear - 81);
  const eqTime = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // minutes
  const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
  let lng = -15 * (utcHours - 12 + eqTime / 60);
  lng = ((lng + 180) % 360 + 360) % 360 - 180;
  return { lat: decl, lng };
}

/** Unit vector toward the sun, in the globe's own coordinate frame. */
function sunVector() {
  const { lat, lng } = subsolarPoint();
  const c = globe.getCoords(lat, lng, 0);
  const len = Math.hypot(c.x, c.y, c.z) || 1;
  return { x: c.x / len, y: c.y / len, z: c.z / len };
}

/** globe.gl doesn't re-export THREE, so clone the texture class off an existing one. */
function loadTexture(url, TexClass, like) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const t = new TexClass(img);
      if (like) {
        t.wrapS = like.wrapS; t.wrapT = like.wrapT;
        t.colorSpace = like.colorSpace; t.flipY = like.flipY;
        t.minFilter = like.minFilter; t.magFilter = like.magFilter;
      }
      t.needsUpdate = true;
      resolve(t);
    };
    img.onerror = () => reject(new Error(`texture failed: ${url}`));
    img.src = url;
  });
}

const waitFor = (fn, ms = 8000) => new Promise((res, rej) => {
  const t0 = Date.now();
  (function poll() {
    const v = fn();
    if (v) return res(v);
    if (Date.now() - t0 > ms) return rej(new Error("timed out waiting for texture"));
    setTimeout(poll, 60);
  })();
});

/**
 * Blend the daytime and night-lights textures across the real terminator.
 *
 * Injected into the existing MeshPhongMaterial rather than built as a fresh
 * ShaderMaterial, because globe.gl bundles three privately and never exposes the
 * constructors. UVs are derived from the object-space normal instead of a
 * varying, so this doesn't break when three renames vUv to vMapUv.
 *
 * Injected at <opaque_fragment>, not at the end of the shader: everything after
 * it (tone mapping, colour-space encoding) still has to run on our blended
 * colour. Writing gl_FragColor last skips sRGB encoding and the daylit half
 * comes out several stops too dark.
 */
async function applyDayNight() {
  const mat = globe.globeMaterial();
  const dayTex = await waitFor(() => mat.map);
  const TexClass = dayTex.constructor;

  const [nightTex, bumpTex] = await Promise.all([
    loadTexture("vendor/earth-night.jpg", TexClass, dayTex),
    loadTexture("vendor/earth-topology.png", TexClass, dayTex),
  ]);

  mat.bumpMap = bumpTex;
  mat.bumpScale = 4;            // globe radius is 100, so this is subtle relief
  mat.shininess = 6;
  // three-globe nulls material.color once a globe texture is applied, so this
  // has to be guarded — assigning through it threw and silently skipped the
  // shader hook below.
  mat.color?.setHex?.(0xffffff);

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.nightMap = { value: nightTex };
    shader.uniforms.sunDirection = { value: sunVector() };

    shader.vertexShader = "varying vec3 vObjNormal;\n" + shader.vertexShader
      .replace("void main() {", "void main() {\n  vObjNormal = normalize(position);");

    shader.fragmentShader =
      "uniform sampler2D nightMap;\nuniform vec3 sunDirection;\nvarying vec3 vObjNormal;\n" +
      shader.fragmentShader.replace("#include <opaque_fragment>", `#include <opaque_fragment>
        vec3 n = normalize(vObjNormal);
        float uu = atan(n.x, n.z) / 6.2831853 + 0.5;
        float vv = asin(clamp(n.y, -1.0, 1.0)) / 3.14159265 + 0.5;
        vec2 eq = vec2(uu, vv);
        vec3 dayC   = texture2D(map, eq).rgb;
        vec3 nightC = texture2D(nightMap, eq).rgb;
        float cosSun = dot(n, normalize(sunDirection));
        // ~10 degrees of softness: civil twilight, not a hard line
        float t = smoothstep(-0.09, 0.09, cosSun);
        vec3 col = mix(nightC * 1.6, dayC, t);
        // A restrained warm band either side of the terminator — sunrise, not sunset filter.
        col += vec3(0.075, 0.032, 0.0) * max(0.0, 1.0 - abs(cosSun) * 22.0);
        gl_FragColor = vec4(col, gl_FragColor.a);`);

    mat.userData.shader = shader;   // handle for the per-minute sun update
  };
  // three's default program cache key already stringifies onBeforeCompile, so
  // replacing the hook is enough to force a recompile.
  mat.needsUpdate = true;
}

function updateSun() {
  if (!globe) return;
  // The readout must not depend on the shader: the program compiles on the first
  // render after needsUpdate, which is after initGlobe returns.
  const sh = globe.globeMaterial()?.userData?.shader;
  if (sh) sh.uniforms.sunDirection.value = sunVector();
  const { lat, lng } = subsolarPoint();
  const el = $("sunreadout");
  if (el) {
    el.textContent = `sun overhead ${Math.abs(lat).toFixed(1)}°${lat >= 0 ? "N" : "S"} `
      + `${Math.abs(lng).toFixed(1)}°${lng >= 0 ? "E" : "W"}`;
  }
}

async function initGlobe() {
  await loadGlobeLib();
  const raw = await window.globefm.globePoints();      // [i, lon, lat, count]
  globePts = raw.map(([i, lng, lat, count]) => ({ i, lng, lat, count }));

  const accent = css("--accent") || "#30D158";
  const el = $("globe");

  globe = Globe()(el)
    // Textures are vendored from three-globe, so the real Earth costs no network.
    .globeImageUrl("vendor/earth-blue-marble.jpg")
    .backgroundColor("rgba(0,0,0,0)")
    .showGlobe(true)
    .showAtmosphere(true)
    .atmosphereColor("#8ab4f8")
    .atmosphereAltitude(0.17)
    .pointsData(globePts)
    .pointLat("lat").pointLng("lng")
    .pointColor((d) => (d.i === selection.placeIndex ? "#ffffff" : "#5ef08a"))
    // Near-flat discs, not columns. Extruded points turn the limb into fuzz and
    // read as noise rather than geography.
    .pointAltitude(0.002)
    // sqrt, not linear: Paris has 710 stations and a village has 1, and a linear
    // scale would make Paris a blob that swallows northern France.
    .pointRadius((d) => (d.i === selection.placeIndex ? 0.7 : 0.13 + Math.sqrt(d.count) * 0.022))
    // Merged into one geometry: unmerged, 12,296 points cost 12,298 draw calls
    // per frame. Merged it is ~3. The tradeoff is that changing a point's colour
    // means rebuilding the layer, which only happens on selection.
    .pointsMerge(true)
    .pointLabel((d) => `${d.count} station${d.count === 1 ? "" : "s"}`)
    .onPointClick((d) => { selectPlace(d.i); flyTo(d.lat, d.lng); });

  await applyDayNight();
  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.35;
  globe.controls().enableDamping = true;

  // Stop the idle spin as soon as the user grabs it — autorotate fighting a drag
  // is the fastest way to make a globe feel broken.
  el.addEventListener("pointerdown", () => { globe.controls().autoRotate = false; }, { once: false });

  sizeGlobe();
  updateSun();
  // The terminator moves ~0.25° a minute; once a minute is imperceptibly smooth
  // and costs nothing.
  clearInterval(sunTimer);
  sunTimer = setInterval(updateSun, 60000);
  $("globehint").innerHTML =
    `${globePts.length.toLocaleString()} places · drag to spin, click a point`
    + ` &nbsp;·&nbsp; <span id="sunreadout"></span>`;
  updateSun();
}

function sizeGlobe() {
  if (!globe) return;
  const w = $("globewrap");
  globe.width(w.clientWidth).height(w.clientHeight);
}

function flyTo(lat, lng) {
  globe?.pointOfView({ lat, lng, altitude: 1.6 }, 700);
}

/** Merged geometry means selection changes need the layer rebuilt, not just recoloured. */
function refreshGlobeSelection() {
  if (globe && globePts) globe.pointsData(globePts);
}

async function setView(view) {
  const isGlobe = view === "globe";
  document.body.classList.toggle("view-globe", isGlobe);
  $("tabList").setAttribute("aria-selected", !isGlobe);
  $("tabGlobe").setAttribute("aria-selected", isGlobe);
  $("globewrap").hidden = !isGlobe;

  const state = (await window.globefm.getState()) || {};
  state.exploreView = view;
  await window.globefm.setState(state);

  if (!isGlobe) return;
  try {
    if (!globe) await initGlobe();
    sizeGlobe();
    if (selection.place) flyTo(selection.place.lat, selection.place.lon);
  } catch (err) {
    $("globehint").textContent = err.message;
  }
}

$("tabList").onclick = () => setView("list");
$("tabGlobe").onclick = () => setView("globe");
window.addEventListener("resize", sizeGlobe);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (globe) refreshGlobeSelection();
});

// ── input ────────────────────────────────────────────────────────────────────
qEl.addEventListener("input", () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => loadPlaces(qEl.value), 120);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.activeElement === qEl && qEl.value) {
    qEl.value = ""; loadPlaces("");
  }
});

// ── boot ─────────────────────────────────────────────────────────────────────
(async () => {
  const state = (await window.globefm.getState()) || {};
  favorites = Array.isArray(state.favorites) ? state.favorites : [];
  await loadPlaces("");
  if (state.exploreView === "globe") await setView("globe");
})();
</script>
</body>
</html>
