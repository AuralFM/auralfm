<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src ws: wss:;">
<title>Explore</title>
<style>
  :root{
    --label:rgba(255,255,255,.92); --label2:rgba(255,255,255,.55); --label3:rgba(255,255,255,.28);
    --fill:rgba(255,255,255,.08); --fill-hi:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.10); --pane:rgba(30,30,32,.55); --bg:#1c1c1e;
    --accent:#30D158; --star:#FFD60A; --on-accent:#04140c;
  }
  /* System appearance, unless Settings has forced the other one. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
    --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.50); --label3:rgba(0,0,0,.25);
    --fill:rgba(0,0,0,.05); --fill-hi:rgba(0,0,0,.09);
    --line:rgba(0,0,0,.09); --pane:rgba(255,255,255,.55); --bg:#f2f2f7;
    --accent:#248A3D; --star:#A16207; --on-accent:#ffffff;
    }
  }
  :root[data-theme="light"]{
    --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.50); --label3:rgba(0,0,0,.25);
    --fill:rgba(0,0,0,.05); --fill-hi:rgba(0,0,0,.09);
    --line:rgba(0,0,0,.09); --pane:rgba(255,255,255,.55); --bg:#f2f2f7;
    --accent:#248A3D; --star:#A16207; --on-accent:#ffffff;
  }
  :root[data-theme="dark"]{
    --label:rgba(255,255,255,.92); --label2:rgba(255,255,255,.55); --label3:rgba(255,255,255,.28);
    --fill:rgba(255,255,255,.08); --fill-hi:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.10); --pane:rgba(30,30,32,.55); --bg:#1c1c1e;
    --accent:#30D158; --star:#FFD60A; --on-accent:#04140c;
  }
  /* Increased contrast follows the system setting until Settings overrides it. */
  @media (prefers-contrast: more){
    :root:not([data-contrast="normal"]){--label2:var(--label); --label3:var(--label2)}
  }
  /* Increased contrast. Deliberately NOT the CanvasText system keyword: that
     keyword tracks the OS appearance, so on a light Mac with the theme forced to
     Dark it paints black text on a dark background. These track our own theme. */
  :root[data-contrast="more"]{
    --label:#fff; --label2:#fff; --label3:rgba(255,255,255,.78);
    --line:rgba(255,255,255,.55);
    --pane:rgba(12,12,14,.92); --bg:#000;
  }
  :root[data-contrast="more"][data-theme="light"]{
    --label:#000; --label2:#000; --label3:rgba(0,0,0,.75);
    --line:rgba(0,0,0,.55);
    --pane:rgba(255,255,255,.94); --bg:#fff;
  }
  @media (prefers-color-scheme: light){
    :root[data-contrast="more"]:not([data-theme="dark"]){
      --label:#000; --label2:#000; --label3:rgba(0,0,0,.75);
      --line:rgba(0,0,0,.55);
      --pane:rgba(255,255,255,.94); --bg:#fff;
    }
  }
  :root[data-contrast="more"] .row[aria-current="true"]{outline:1px solid var(--accent)}
  @media (prefers-reduced-transparency: reduce){ body{background:var(--bg)} .content{background:var(--bg)} }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;animation-duration:.01ms !important} }

  /**
   * `hidden` wins, always.
   *
   * Four times now an element has been given an explicit `display` in CSS and
   * the `hidden` attribute in HTML, and the attribute lost — most recently the
   * shortwave dial, which sat over station lists showing an empty waterfall.
   * Each time it was patched for that one element, which is exactly why it kept
   * happening.
   *
   * `!important` is load-bearing rather than lazy: a plain `[hidden]` rule is
   * specificity (0,1,0) and loses to `#tuner{display:flex}` at (1,0,0).
   */
  [hidden]{display:none !important}

  /* Stations vs shortwave. Same segmented shape as Settings, so the two places
     in the app where you pick between modes look like the same idea.
     Always occupies its space, even when there are no receivers nearby to
     offer — appearing and disappearing moved everything under it by 32px. That
     uses a class rather than the `hidden` attribute, because `hidden` means
     "not here" and this element is here, just not showing anything. */
  .railtabs{
    display:flex;gap:2px;padding:2px;margin:0 13px 6px;
    background:var(--fill);border-radius:7px;min-height:30px;
  }
  .railtabs.ghost{visibility:hidden}
  .railtabs button{
    flex:1;appearance:none;border:0;background:transparent;color:var(--label2);
    font:inherit;font-size:11px;font-weight:530;letter-spacing:-.002em;
    padding:4px 8px;border-radius:5px;cursor:default;white-space:nowrap;
    transition:background .12s ease-out,color .12s ease-out;
  }
  .railtabs button:hover{background:var(--fill-hi);color:var(--label)}
  .railtabs button[aria-checked="true"]{background:var(--label);color:var(--bg);font-weight:590}
  .railtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* A one-shot tint when a price moves, so the ticker reads as alive without
     demanding attention. Fades over most of a second. */
  @keyframes tickUp{from{color:#30D158}to{color:inherit}}
  @keyframes tickDn{from{color:#FF453A}to{color:inherit}}
  .m .px.tick-up{animation:tickUp .9s ease-out}
  .m .px.tick-dn{animation:tickDn .9s ease-out}
  @media (prefers-reduced-motion: reduce){ .m .px.tick-up,.m .px.tick-dn{animation:none} }

  /* Add-a-station lives at the foot of the list, quiet until wanted. */
  .addst{padding:8px 15px 18px}
  .addst > button{
    appearance:none;background:none;border:0;color:var(--label2);font:inherit;font-size:12px;
    padding:6px 0;cursor:default;text-align:left;width:100%;
  }
  .addst > button:hover{color:var(--accent)}
  .addst form{display:flex;flex-direction:column;gap:6px}
  .addst input{
    appearance:none;background:var(--fill);border:0;border-radius:7px;color:var(--label);
    font:inherit;font-size:12px;padding:7px 9px;box-shadow:inset 0 0 0 .5px var(--line);
  }
  .addst input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .addst .acts{display:flex;gap:6px;margin-top:2px}
  .addst .acts button{
    appearance:none;border:0;border-radius:7px;font:inherit;font-size:12px;font-weight:530;
    padding:6px 11px;cursor:default;
  }
  .addst .acts button[type=submit]{background:var(--accent);color:var(--on-accent)}
  .addst .acts .cancel{background:var(--fill);color:var(--label2)}
  .addst .err{font-size:11px;color:#FF453A;padding:1px 2px}
  .st .rm{
    appearance:none;background:none;border:0;color:var(--label3);font:inherit;font-size:15px;
    line-height:1;padding:2px 6px;cursor:default;border-radius:5px;
  }
  .st .rm:hover{color:#FF453A;background:var(--fill)}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    /* The window is opaque now (see the note in main.js), so the page owns its
       own background instead of relying on a vibrancy layer behind it. */
    background:var(--bg);color:var(--label);
    font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
    display:flex;flex-direction:column;
  }

  /* Toolbar sits under the traffic lights (titleBarStyle: hiddenInset). */
  .toolbar{
    flex:none;height:52px;display:flex;align-items:center;gap:10px;
    padding:0 14px 0 84px;-webkit-app-region:drag;
  }
  .toolbar input{-webkit-app-region:no-drag}
  .toolbar .sp{flex:1}
  .toolbar #newsBtn{
    -webkit-app-region:no-drag;background:none;border:0;color:var(--label2);
    font-size:16px;line-height:1;padding:3px 6px;border-radius:6px;cursor:default;
    transition:background .12s ease-out,color .12s ease-out;
  }
  .toolbar #newsBtn:hover{background:var(--fill);color:var(--label)}
  .toolbar #newsBtn[aria-pressed="true"]{color:var(--accent);background:var(--fill)}
  .toolbar #favBtn{
    -webkit-app-region:no-drag;background:none;border:0;color:var(--label2);
    font-size:16px;line-height:1;padding:3px 6px;border-radius:6px;cursor:default;
    transition:background .12s ease-out,color .12s ease-out;
  }
  .toolbar #favBtn:hover{background:var(--fill);color:var(--label)}
  .toolbar #favBtn[aria-pressed="true"]{color:var(--star);background:var(--fill)}
  .toolbar #q{
    width:clamp(240px, 22vw, 520px);height:24px;padding:0 9px;border:0;border-radius:6px;
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:box-shadow .15s ease-out,background .15s ease-out,width .18s ease-out;
  }
  .toolbar #q:focus{
    width:clamp(300px, 26vw, 600px);background:var(--fill-hi);
    box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);
  }
  .toolbar #q::placeholder{color:var(--label2)}
  .toolbar #q::-webkit-search-cancel-button{display:none}

  /* Segmented control — the switch between List and Globe. */
  .seg{display:flex;background:var(--fill);border-radius:7px;padding:2px;gap:2px}
  .seg button{
    border:0;background:none;color:var(--label2);font:inherit;font-size:12px;
    padding:3px 11px;border-radius:5px;cursor:default;
    transition:background .14s ease-out,color .14s ease-out;
  }
  .seg button[aria-selected="true"]{background:var(--pane);color:var(--label);box-shadow:0 .5px 1.5px rgba(0,0,0,.18)}
  .seg button:disabled{opacity:.4}

  .cols{flex:1;display:flex;min-height:0}

  /* Left: places. Darker material — AppKit uses heavier surfaces for structure. */
  .places{
    width:266px;flex:none;display:flex;flex-direction:column;min-height:0;
    border-right:.5px solid var(--line);
  }
  .searchwrap{padding:0 12px 9px}
  #q{
    width:100%;height:24px;padding:0 9px;border:0;border-radius:6px;
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:box-shadow .15s ease-out,background .15s ease-out;
  }
  #q:focus{background:var(--fill-hi);box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  #q::placeholder{color:var(--label2)}
  #q::-webkit-search-cancel-button{display:none}

  .secthead{
    padding:2px 15px 5px;font-size:11px;font-weight:590;letter-spacing:.005em;color:var(--label2);flex:none;
  }
  .sublabel{
    padding:10px 8px 4px;font-size:11px;font-weight:590;color:var(--label3);letter-spacing:.005em;
  }

  .scroll{flex:1;overflow-y:auto;padding:0 7px 10px}
  /* Wide rails get columns rather than one lonely strip of text. */
  @media (min-width: 1250px){
    #stationlist, #placelist{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
      grid-auto-rows:max-content; gap:0 6px; align-content:start;
    }
    /* display:grid beats the [hidden] attribute, so both lists were rendering
       at once on wide windows — places and stations stacked in the same rail. */
    #stationlist[hidden], #placelist[hidden]{display:none}
    #stationlist .empty, #placelist .empty{grid-column:1/-1}
    .sublabel{grid-column:1/-1}
  }
  .scroll::-webkit-scrollbar{width:0}

  .place{
    display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:6px;
    transition:background .12s ease-out;
  }
  .place:hover{background:var(--fill)}
  .place:active{background:var(--fill-hi);transform:scale(.99);transition:transform 90ms ease-out}
  .place[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .place[aria-selected="true"] .pn{color:var(--accent);font-weight:590}
  .pmeta{flex:1;min-width:0}
  .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.002em}
  .pc{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cnt{
    flex:none;font-size:10px;color:var(--label3);font-variant-numeric:tabular-nums;
    min-width:22px;text-align:right;
  }

  /* The globe is the product, so it is always on screen — never a mode you
     switch into. The right rail is what changes: results while searching,
     stations once a place is chosen. */
  .globecol{flex:1;min-width:0;display:flex;flex-direction:column;border-right:.5px solid var(--line)}
  .globewrap{flex:1;position:relative;min-width:0}
  /* Read-outs sit on chrome above the globe, not over it. White text on bright
     cloud was illegible — which is what the screenshot showed. */
  .globebar[hidden]{display:none}   /* display:flex below would otherwise win */
  /**
   * Lives inside .globecol, not beside it. As a sibling of .cols it spanned the
   * whole window and ran underneath the station rail, which is what the
   * overflow looked like — the text was not too long, the box was too wide.
   *
   * min-width:0 is the part that actually makes the ellipsis work: a flex child
   * defaults to min-width:auto, which refuses to shrink below its content, so
   * `overflow:hidden` had nothing to clip against.
   */
  /**
   * The read-outs, floated over the globe.
   *
   * They used to be a strip above it, which gave a row of numbers the same
   * prominence as the thing they annotate — and most people opening this app
   * have no idea what a subsolar point or a K-index is. Over the planet, small
   * and tinted, they read as ambient rather than as a status bar demanding to be
   * understood.
   *
   * `pointer-events:none` matters: this sits on the globe, and the globe is the
   * control. A caption must never eat a drag.
   */
  .globebar{
    position:absolute;left:0;right:0;bottom:10px;z-index:3;pointer-events:none;
    display:flex;align-items:center;justify-content:center;gap:0;
    padding:0 18px;font-size:10.5px;color:var(--label3);
    letter-spacing:.006em;white-space:nowrap;overflow:hidden;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  /**
   * A scrim under the line.
   *
   * A text shadow alone is enough over ocean and useless over a sunlit desert,
   * which is most of the globe half the time. This is the same thing subtitles
   * have always done: darken a band, not the picture. It fades to nothing well
   * before the middle, so the planet is untouched where anyone is looking.
   *
   * It will earn its keep twice — live captions belong on this line too.
   */
  /**
   * The layer inspector.
   *
   * Ten toggles had accumulated in a menu, one at a time, and a menu is where
   * controls go to be forgotten — you cannot see the state of anything without
   * opening it, and you cannot compare two without opening it twice.
   *
   * Over the globe instead, because that is what they change. Closed by default,
   * because most people set these once.
   */
  #layers{
    position:absolute;top:14px;right:14px;z-index:5;width:206px;
    padding:9px 8px 10px;border-radius:12px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:blur(22px) saturate(1.6);
            backdrop-filter:blur(22px) saturate(1.6);
    box-shadow:0 12px 40px rgba(0,0,0,.30), 0 0 0 .5px var(--line);
  }
  .layhead{
    padding:2px 8px 7px;font-size:11px;font-weight:590;color:var(--label2);
    letter-spacing:.02em;text-transform:uppercase;
  }
  .layrow{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:6px 8px;border:0;border-radius:7px;background:none;
    font:inherit;font-size:12.5px;cursor:default;text-align:left;
    transition:background .12s ease-out,color .12s ease-out;
  }
  .layrow:hover{background:var(--fill)}
  /* A dot rather than a checkbox: ten checkboxes read as a form, and this is a
     set of things that are on or off in a picture. */
  .laydot{
    flex:none;width:9px;height:9px;border-radius:50%;
    box-shadow:inset 0 0 0 1.5px var(--label3);
    transition:background .15s ease-out,box-shadow .15s ease-out;
  }
  .layrow[aria-pressed="true"]{color:var(--label)}
  .layrow[aria-pressed="true"] .laydot{
    background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);
  }
  .layrow[aria-pressed="false"]{color:var(--label3)}
  @media (prefers-reduced-motion: reduce){ .layrow,.laydot{transition:none} }

  /**
   * Captions.
   *
   * Subtitles, on the world. Centred, in the lower third, one or two lines —
   * everything film has settled on over a century, because it is where the eye
   * can take words without leaving the picture.
   *
   * `pointer-events:none` for the same reason as the read-outs: the globe is the
   * control, and a caption must never eat a drag.
   */
  #caption{
    position:absolute;left:0;right:0;bottom:34px;z-index:4;pointer-events:none;
    padding:0 14%;text-align:center;
    font-size:16px;font-weight:530;line-height:1.4;letter-spacing:-.006em;
    color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.6);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
    transition:opacity .18s ease-out;
  }
  #caption[hidden]{display:none}
  #caption.fading{opacity:0}
  @media (prefers-reduced-motion: reduce){ #caption{transition:none} }

  .globebar::after{
    content:"";position:absolute;left:0;right:0;bottom:-10px;height:52px;
    background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0));
    z-index:-1;pointer-events:none;
  }
  /* Each read-out shrinks in turn and the last one to fit is the one that gets
     truncated, rather than the whole line vanishing at once. */
  .globebar > span{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
  /* The accent, not --label: it ties the numbers to the palette, and it is the
     one thing on this line the eye should be able to find. */
  .globebar b{font-weight:590;color:var(--accent)}
  .globebar > span:not(:empty) ~ span:not(:empty)::before{
    content:"·"; margin:0 10px; color:var(--label3);
  }
  .globebar > span:empty{display:none}
  #globe{position:absolute;inset:0}
  #globe canvas{display:block}
  /* Slides over the globe rather than taking a column from it — the globe is the
     product, and news should not permanently shrink it. */
  /* Always hovers over the map, never a column. A panel that takes layout width
     squeezes the globe — which is the one thing this app is for. */
  .newspanel{
    position:absolute;left:0;top:0;bottom:0;z-index:5;
    width:clamp(300px, 34%, 460px);
    display:flex;flex-direction:column;overflow:hidden;
    background:color-mix(in srgb, var(--bg) 96%, transparent);
    backdrop-filter:blur(30px) saturate(150%);
    border-right:.5px solid var(--line);
    box-shadow:2px 0 22px rgba(0,0,0,.20);
    animation:newsin .22s cubic-bezier(.32,.72,0,1);
  }
  /* display:flex above beats the [hidden] attribute, so the panel stayed on
     screen no matter what — which is exactly why the close button looked dead.
     Same trap as the place/station lists. */
  .newspanel[hidden]{display:none}
  @keyframes newsin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .newspanel{animation:none} }
  .newshead{
    flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 8px;
    font-size:12px;letter-spacing:-.002em;
  }
  .newshead b{flex:1;font-weight:590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .newshead button{
    flex:none;width:26px;height:26px;display:grid;place-items:center;
    background:none;border:0;color:var(--label2);line-height:1;
    border-radius:6px;cursor:default;
    transition:background .12s ease-out,color .12s ease-out,transform 90ms ease-out;
  }
  .newshead button:hover{background:var(--fill-hi);color:var(--label)}
  .newshead button:active{transform:scale(.9)}
  #newsSrc{font-size:14px}
  #newsSrc[aria-pressed="true"]{color:var(--accent)}
  #newsClose{font-size:16px}
  .newslist{flex:1;overflow-y:auto;padding:0 8px 12px}
  .newslist::-webkit-scrollbar{width:0}
  /* The reader. Measured for prose rather than for a list: longer line height,
     a real paragraph gap, and a maximum width the eye can track. */
  .readback{
    appearance:none;border:0;background:none;color:var(--label2);font:inherit;
    font-size:12px;padding:4px 0 10px;cursor:default;
  }
  .readback:hover{color:var(--label)}
  .readtitle{font-size:16px;font-weight:640;line-height:1.28;letter-spacing:-.012em}
  .readmeta{font-size:11px;color:var(--label2);margin:5px 0 12px}
  .readp{margin:0 0 11px;font-size:13px;line-height:1.62;color:var(--label)}
  .readnote{font-size:12.5px;line-height:1.5;color:var(--label2);margin-bottom:12px}
  .readopen{
    appearance:none;border:0;border-radius:7px;background:var(--fill);
    color:var(--label);font:inherit;font-size:12px;padding:7px 12px;cursor:default;
  }
  .readopen:hover{background:var(--fill-hi)}

  .story{padding:8px 8px;border-radius:7px;transition:background .12s ease-out}
  .story:hover{background:var(--fill)}
  .story:active{background:var(--fill-hi)}
  .story .h{font-size:12.5px;line-height:1.35;letter-spacing:-.002em}
  .story .m{font-size:11px;color:var(--label2);margin-top:3px}



  /* Right: stations in the selected place. */
  /* Rail scales with the window but stays a rail — flex:1 here previously
     overrode the width below it and gave the list half the screen. */
  .stations{
    flex:none;width:clamp(340px, 26vw, 900px);
    display:flex;flex-direction:column;min-height:0;
  }
  .placehead{flex:none;padding:0 18px 10px}
  /* One line. A long place name used to wrap and take the list with it, which
     is the same flinch as the tags. */
  .placehead h2{
    margin:0;font-size:19px;font-weight:640;letter-spacing:-.018em;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .placehead p{margin:2px 0 0;font-size:12px;color:var(--label2)}
  .wx{
    margin:7px 0 0;font-size:12px;color:var(--label2);
    display:flex;align-items:center;gap:7px;min-height:16px;
    opacity:0;transition:opacity .25s ease-out;
  }
  .wx.on{opacity:1}
  .wx .sym{font-size:13px;color:var(--label)}
  .wx .t{color:var(--label);font-weight:510;font-variant-numeric:tabular-nums}

  /**
   * One row, scrolled sideways — never wrapped.
   *
   * Wrapping was the main cause of the rail jumping as the globe turned. Every
   * place carries a different number of genre tags, so the header was two rows
   * tall over Lagos and one over Lusaka, and the whole list under it shifted by
   * twenty-odd pixels each time the selection changed. On a spinning globe that
   * is constant, and it reads as the interface flinching.
   *
   * A fixed-height row cannot do that. The tags that do not fit are still there,
   * one flick to the right.
   */
  .chips{
    display:flex;flex-wrap:nowrap;gap:5px;margin:9px 0 0;
    height:23px;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none}
  .chips button{
    border:0;background:var(--fill);color:var(--label2);font:inherit;font-size:11px;
    padding:2.5px 8px;border-radius:999px;cursor:default;line-height:1.35;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:background .12s ease-out,color .12s ease-out,transform 90ms ease-out;
  }
  .chips button:hover{background:var(--fill-hi);color:var(--label)}
  .chips button:active{transform:scale(.94)}
  .chips button[aria-pressed="true"]{
    background:color-mix(in srgb,var(--accent) 22%,transparent);
    color:var(--label);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--accent) 45%,transparent);
  }

  .st{
    display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;
    transition:background .12s ease-out;
  }
  .st:hover{background:var(--fill)}
  .st:active{background:var(--fill-hi);transform:scale(.994);transition:transform 90ms ease-out}
  .st[aria-current="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent)}
  .st[aria-current="true"] .sn{color:var(--accent);font-weight:590}
  .smeta{flex:1;min-width:0}
  .sn{letter-spacing:-.002em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stags{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star{
    flex:none;background:none;border:0;color:var(--label3);font-size:14px;
    padding:2px 4px;border-radius:4px;cursor:default;opacity:0;line-height:1;
    transition:opacity .12s ease-out,color .12s ease-out,transform 90ms ease-out;
  }
  .st:hover .star{opacity:1}
  .star.on{opacity:1;color:var(--star)}
  .star:active{transform:scale(.85)}
  .bars{flex:none;display:flex;gap:2px;align-items:flex-end;height:12px;width:8px;opacity:0}
  .st[aria-current="true"] .bars{opacity:1}
  .bars i{width:2px;background:var(--accent);border-radius:1px;height:3px}
  body.playing .st[aria-current="true"] .bars i{animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}

  .empty{padding:56px 28px;text-align:center;color:var(--label3);font-size:13px;line-height:1.7}

  /* Now-playing strip, mirroring the popover's transport bar. */
  button svg{display:block}
  .now{
    /* Never wraps. It did while the headline ticker needed a row of its own;
       with the ticker gone a second line is just the prices falling off the
       bar, which reads as a layout failure rather than a feature. They clip
       instead — SOL goes first, then ETH, and BTC is the last to leave. */
    flex:none;display:flex;flex-wrap:nowrap;align-items:center;gap:9px;
    padding:9px 15px 9px 16px;
    box-shadow:inset 0 .5px 0 var(--line);font-size:12px;overflow:hidden;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #play{
    flex:none;width:26px;height:26px;border-radius:50%;border:0;cursor:default;
    /* --on-accent, not a hardcoded dark: the popover's transport already used
       the token, so in the light theme its glyph was white and this one was
       nearly black. Two play buttons, same app, different colours. */
    background:var(--accent);color:var(--on-accent);font-size:12px;
    display:grid;place-items:center;
    transition:transform 90ms ease-out,opacity .15s ease-out;
  }
  #play:active{transform:scale(.92)}
  .volwrap{flex:none;display:flex;align-items:center;gap:5px;margin-left:10px}
  #mute{
    background:none;border:0;color:var(--label2);font-size:15px;line-height:1;
    padding:2px;border-radius:4px;cursor:default;transition:color .12s ease-out;
  }
  #mute:hover{color:var(--label)}
  #vol{width:84px;accent-color:var(--accent)}
  #lock{
    flex:none;background:none;border:0;font-size:15px;line-height:1;cursor:default;
    padding:3px 5px;border-radius:5px;opacity:.55;
    transition:background .12s ease-out,opacity .12s ease-out,transform 90ms ease-out;
  }
  #lock:hover{background:var(--fill);opacity:1}
  #lock:active{transform:scale(.9)}
  #lock[aria-pressed="true"]{opacity:1;background:color-mix(in srgb,var(--accent) 24%,transparent)}
  .now b{font-weight:590}
  .now span{color:var(--label2)}

  /* Large-display breathing room. Must be last in the sheet: an earlier media
     block loses to the equally-specific base rules that follow it. */
  @media (min-width: 2200px){
    .toolbar{height:60px}
    .placehead{padding:0 26px 16px}
    .placehead h2{font-size:23px}
    .scroll{padding:0 15px 16px}
    .secthead{padding:2px 23px 6px}
    .now{padding:13px 27px 13px 26px;font-size:13px}   /* 15px scroll + 12px row */
    #play{width:30px;height:30px}
    #vol{width:110px}
    .st{padding:9px 12px}
    .place{padding:7px 10px}
  }
  /* Headlines cross-fade one at a time rather than scrolling. A marquee fights
     prefers-reduced-motion and moving text is simply harder to read. */
  /**
   * A crawl, not a slideshow.
   *
   * This used to swap one headline for another every nine seconds and clip
   * whatever did not fit — so on a narrow window you could never read a whole
   * headline, and on any window you could not read the ones already gone. Now
   * every headline sits in one strip that moves continuously, at a duration
   * derived from its length so the pace is the same with three items or thirty.
   *
   * It moves leftward, which is what makes it readable: the words arrive in
   * reading order. A right-to-left interface needs the opposite, and that
   * belongs with real RTL support rather than as a lone switch.
   */
  /* Chat, under the station list. It shares the rail rather than taking a
     window: this is ambient, and it should never be the thing you are looking
     at when you came here to listen. */
  #chat{
    flex:none;display:flex;flex-direction:column;max-height:246px;
    box-shadow:inset 0 .5px 0 var(--line);
  }
  .chathead{
    flex:none;display:flex;align-items:baseline;gap:8px;padding:9px 15px 5px;
    font-size:11px;color:var(--label2);letter-spacing:.005em;
  }
  #chatpeers{margin-left:auto;color:var(--label3);font-variant-numeric:tabular-nums}
  #chatlog{flex:1;min-height:0;padding:0 15px 6px;overflow-y:auto}
  .msg{padding:3px 0;font-size:12px;line-height:1.42;word-wrap:break-word}
  .msg .who{color:var(--label2);font-weight:590}
  /* Your own line is tinted rather than aligned right: a twenty-kilometre
     public square is not a DM thread, and it should not look like one. */
  .msg.mine .who{color:var(--accent)}
  #chatform{flex:none;padding:0 13px 11px}
  #chatinput{
    width:100%;appearance:none;border:0;border-radius:7px;background:var(--fill);
    color:var(--label);font:inherit;font-size:12px;padding:8px 10px;
  }
  #chatinput::placeholder{color:var(--label3)}
  #chatinput:disabled{opacity:.5}

  /**
   * The dial.
   *
   * This was deleted once, by a de-duplication that removed both copies instead
   * of one, and the symptom was seven raw browser buttons sitting in a themed
   * app. Worth a note because the failure is silent: unstyled controls still
   * work perfectly.
   */
  #tuner{
    flex:none;padding:9px 15px 6px;display:flex;flex-direction:column;gap:6px;
    box-shadow:inset 0 -.5px 0 var(--line);
  }
  /* Time downward, frequency across, tuned frequency dead centre — the
     convention every radio has used since the first panadapter. */
  #wf{
    width:100%;height:88px;display:block;border-radius:7px;background:#05070c;
    image-rendering:pixelated;   /* one bin is one pixel; do not invent detail */
  }
  .trow{display:flex;align-items:center;gap:5px}
  .trow > button{
    appearance:none;border:0;border-radius:7px;cursor:default;
    background:var(--fill);color:var(--label2);
    font:inherit;font-size:11.5px;font-weight:510;padding:6px 0;flex:1;
    transition:background .12s ease-out,color .12s ease-out,transform 80ms ease-out;
  }
  .trow > button:hover{background:var(--fill-hi);color:var(--label)}
  .trow > button:active{transform:scale(.95)}
  .tb{font-size:13px;line-height:1;max-width:38px}
  #tfreq{
    flex:1;text-align:center;font-size:13px;font-weight:590;
    font-variant-numeric:tabular-nums;letter-spacing:-.012em;
    white-space:nowrap;color:var(--label);
  }
  #bw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  #bw button[aria-pressed="true"]:hover{background:var(--accent);color:var(--on-accent)}
  @media (prefers-reduced-motion: reduce){ .trow > button{transition:none} }

  /* The cold open — what fills the rail before anything is selected. */
  #coldopen{padding:0;text-align:left}
  .colead{padding:10px 15px 2px;font-size:12px;line-height:1.5;color:var(--label2)}
  .colead b{color:var(--label);font-weight:590}
  .cohead{
    padding:14px 15px 4px;font-size:11px;font-weight:590;color:var(--label2);
    letter-spacing:.005em;
  }
  .conote{padding:2px 15px 8px;font-size:11px;color:var(--label3);line-height:1.45}

  #nowStar{
    background:none;border:0;color:var(--label3);font-size:15px;line-height:1;
    padding:2px 4px;cursor:default;flex:none;
    transition:color .12s ease-out,transform 90ms ease-out;
  }
  #nowStar:hover{color:var(--star)}
  #nowStar:active{transform:scale(.9)}
  #nowStar.on{color:var(--star)}
  /* First run. */
  #intro{
    position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    background:rgba(6,8,12,.62);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  #intro[hidden]{display:none}
  .introcard{
    width:min(430px,calc(100vw - 56px));
    /* --bg, not --pane: the pane token is deliberately translucent for panels
       that sit over the globe, and a *modal* card that lets the planet through
       is unreadable. The first version used a --panel token that has never
       existed, so the card had no background at all and the body text sat
       directly on a blurred Earth. */
    background:var(--bg);border-radius:15px;padding:26px 26px 20px;
    box-shadow:0 22px 70px rgba(0,0,0,.42),0 0 0 .5px var(--line);
  }
  .introstep{
    font-size:11px;font-weight:590;letter-spacing:.04em;text-transform:uppercase;
    color:var(--accent);margin-bottom:9px;
  }
  .introcard h2{
    margin:0 0 9px;font-size:19px;font-weight:640;letter-spacing:-.014em;
    color:var(--label);line-height:1.25;
  }
  /* Deliberately short: a wall of text on first run gets skipped, and a skipped
     tour is worse than no tour, because it also spent the goodwill. */
  .introcard p{margin:0;font-size:13px;line-height:1.55;color:var(--label2)}
  .introdots{display:flex;gap:6px;margin:20px 0 16px}
  /* --fill-hi, not --fill: at 5% the unvisited dots were invisible, so the
     card looked like it had one step rather than four. */
  .introdots span{width:6px;height:6px;border-radius:50%;background:var(--fill-hi);transition:background .2s ease-out}
  .introdots span.on{background:var(--accent)}
  .introacts{display:flex;align-items:center;gap:10px}
  .introacts button{
    appearance:none;border:0;border-radius:8px;font:inherit;font-size:13px;
    padding:9px 16px;cursor:default;transition:transform 80ms ease-out;
  }
  .introacts button:active{transform:scale(.97)}
  .introacts .ghost{background:none;color:var(--label3);padding-left:0}
  .introacts .ghost:hover{color:var(--label2)}
  /* The accent is a mid-tone in both themes, so white reads on it either way —
     and --on-accent, like --panel, was never defined. */
  .introacts .primary{margin-left:auto;background:var(--accent);color:#fff;font-weight:590}
  @media (prefers-reduced-motion: reduce){ .introacts button,.introdots span{transition:none} }

  /**
   * The prices.
   *
   * They went to a rail strip when the headline ticker needed room, and came
   * back once the ticker was removed — the pop-out headlines card had been doing
   * that job better all along, so running a scroller underneath it was two
   * solutions to one problem. Back at the right of the transport, which is where
   * a glanceable number belongs.
   */
  .markets{
    /* `min-width:0` so it may shrink, `overflow:hidden` so it clips rather than
       pushes, and the symbols are ordered so the least-followed leaves first. */
    flex:0 1 auto;min-width:0;margin-left:auto;display:flex;align-items:center;
    gap:14px;padding-left:16px;overflow:hidden;
    font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .markets .m{flex:none}
  .markets .m{display:flex;align-items:baseline;gap:5px}
  .markets .sym{color:var(--label2);font-weight:590;letter-spacing:.01em}
  .markets .px{color:var(--label)}
  .markets .ch{font-size:11px}
  .markets .up{color:var(--accent)}
  .markets .dn{color:var(--err)}
</style>
</head>
<body>

<div class="toolbar">
  <span class="sp"></span>
  <button id="newsBtn" title="Local headlines" data-i18n-title="ctl.localHeadlines"></button>
  <button id="layersBtn" title="Layers" data-i18n-title="ctl.layers" aria-pressed="false"></button>
      <button id="favBtn" title="Favorites" data-i18n-title="app.favorites"></button>
  <input id="q" type="search" placeholder="Search a city, country, or station" data-i18n-ph="app.searchPlaceholder"
         autocomplete="off" spellcheck="false">
</div>

<div class="cols">

  <div class="globecol">
    <div class="globewrap" id="globewrap">
      <div id="globe"></div>
      <!-- The read-outs, over the planet they describe rather than in a strip
           above it. Small, tinted, and out of the way — they are ambient facts,
           not a status bar, and most people will never need to read them. -->
      <div class="globebar" id="globehint" hidden><span id="globestatus" data-i18n="app.loadingGlobe">Loading globe…</span></div>
      <!-- Layers. One button, closed by default, over the globe it controls —
           rather than ten items in a menu nobody opens. -->
      <div id="layers" hidden>
        <div class="layhead" data-i18n="ctl.layers">Layers</div>
        <div id="laylist"></div>
      </div>

      <!-- Captions. Over the planet, above the read-outs, sharing their scrim. -->
      <div id="caption" hidden aria-live="polite"></div>
      <aside class="newspanel" id="newspanel" hidden>
        <div class="newshead">
          <b id="newsplace">Headlines</b>
          <button id="newsSrc" title="Change source" data-i18n-title="ctl.changeSource"></button>
          <button id="newsClose" title="Close" data-i18n-title="ctl.close">×</button>
        </div>
        <div class="newslist" id="newslist"></div>
      </aside>
    </div>
  </div>

  <!-- First run. Radio, shortwave and ham are genuinely unfamiliar to most
       people now, and an interface that assumes otherwise is a large part of
       why this technology reads as inaccessible rather than merely old. -->
  <div id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="introcard">
      <div class="introstep" id="introStep"></div>
      <h2 id="introTitle"></h2>
      <p id="introBody"></p>
      <div class="introdots" id="introDots"></div>
      <div class="introacts">
        <button class="ghost" id="introSkip"></button>
        <button class="primary" id="introNext"></button>
      </div>
    </div>
  </div>

  <div class="stations">
    <div class="placehead" id="head" hidden><h2></h2><p></p><div class="wx" id="wx"></div>
      <div class="chips" id="chips"></div>
    </div>
    <!-- The dial. Only while a receiver is playing; a stream has nothing to tune.
         It lives here rather than in the menu-bar popover because a spectrum
         display and seven controls do not belong in a window that exists to
         show what is playing. -->
    <div id="tuner" hidden>
      <canvas id="wf" width="512" height="88"></canvas>
      <div class="trow">
        <button class="tb" data-hz="-coarse">&laquo;</button>
        <button class="tb" data-hz="-fine">&lsaquo;</button>
        <b id="tfreq">—</b>
        <button class="tb" data-hz="+fine">&rsaquo;</button>
        <button class="tb" data-hz="+coarse">&raquo;</button>
      </div>
      <div class="trow" id="bw">
        <button data-w="narrow" data-i18n="sdr.narrow">Narrow</button>
        <button data-w="normal" data-i18n="sdr.normal">Normal</button>
        <button data-w="wide" data-i18n="sdr.wide">Wide</button>
      </div>
    </div>
    <div class="railtabs" id="railtabs" role="radiogroup" hidden></div>
    <div class="secthead" id="placehead"></div>
    <div class="scroll" id="placelist" hidden></div>
    <div class="scroll" id="stationlist">
      <div class="empty">Spin the globe, or search for a city.</div>
    </div>

    <!-- Only ever visible when presence is on and something is playing. -->
    <div id="chat" hidden>
      <div class="chathead">
        <span id="chatwhere"></span>
        <span id="chatpeers"></span>
      </div>
      <div class="scroll" id="chatlog"></div>
      <form id="chatform" autocomplete="off">
        <input id="chatinput" type="text" maxlength="400"
               placeholder="Say something to this place"
               data-i18n-ph="chat.placeholder">
      </form>
    </div>
  </div>
</div>

<div class="now" id="now" hidden>
  <button id="play" title="Play / pause" data-i18n-title="ctl.playPause"></button>
  <button id="lock" title="Lock this station while you browse" data-i18n-title="ctl.lockStation"></button>
  <span class="dot" id="dot"></span>
  <button id="nowStar" title="Favorite" data-i18n-title="ctl.favorite" hidden></button>
  <b id="nowName"></b>
  <span id="nowStatus"></span>
  <span class="volwrap">
    <button id="mute" title="Mute" data-i18n-title="ctl.mute"></button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" title="Volume" data-i18n-title="ctl.volume">
  </span>
  <span class="markets" id="markets"></span>
</div>

<script src="astro.js"></script>
<script src="icons.js"></script>
<script src="kiwi.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const placeListEl=$("placelist"), stationListEl=$("stationlist"), qEl=$("q"),
      placeHeadEl=$("placehead"), headEl=$("head");

/**
 * Selection lives here, above the view, not inside it. The Globe view in the
 * next phase renders the same `selection` and calls the same selectPlace() —
 * switching views must never lose your place.
 */
const selection = { placeIndex: null, place: null, channels: [] };
let favorites = [];
let playing = null;          // channel currently playing, per the popover
let debounce = null, seq = 0;

const isFav = (id) => favorites.some((f) => f.id === id);

// ── places ───────────────────────────────────────────────────────────────────
async function loadPlaces(query = "") {
  const my = ++seq;
  const { total, places } = await window.auralfm.places(query, 400);
  if (my !== seq) return;
  placeHeadEl.textContent = `${total.toLocaleString()} places · most stations first`;
  placeListEl.hidden = false;
  stationListEl.hidden = true;
  placeListEl.innerHTML = "";
  if (!places.length) {
    placeListEl.innerHTML = `<div class="empty" style="padding:32px 16px">${t("empty.noPlace", "No place matches that.")}</div>`;
    return;
  }
  for (const p of places) {
    const el = document.createElement("div");
    el.className = "place";
    el.dataset.i = p.i;
    el.setAttribute("aria-selected", p.i === selection.placeIndex);
    el.innerHTML = `<span class="pmeta"><div class="pn"></div><div class="pc"></div></span>
                    <span class="cnt"></span>`;
    el.querySelector(".pn").textContent = p.title;
    el.querySelector(".pc").textContent = p.country;
    el.querySelector(".cnt").textContent = p.count;
    el.onclick = () => goToPlace(p.i);
    placeListEl.appendChild(el);
  }
  markPlaceSelection();
}

/**
 * Mark the selected place by index, not by comparing display text — the globe
 * can select a place that the list is currently filtered away from, and text
 * matching silently failed in exactly that case.
 */
function markPlaceSelection({ scroll = false } = {}) {
  let hit = null;
  for (const el of placeListEl.children) {
    if (!el.dataset?.i) continue;
    const on = Number(el.dataset.i) === selection.placeIndex;
    el.setAttribute("aria-selected", on);
    if (on) hit = el;
  }
  if (hit && scroll) hit.scrollIntoView({ block: "nearest" });
  return hit;
}

async function selectPlace(i, { keepFilter = false } = {}) {
  if (!keepFilter) filter = { band: null, tag: null };   // a new place starts unfiltered
  const { place, channels, total } = await window.auralfm.placeChannels(i, filter);
  if (!place) return;
  selection.placeIndex = i;
  selection.place = place;
  selection.channels = channels;
  selection.total = total;
  markPlaceSelection({ scroll: true });
  renderStations();
  renderChips();
  loadWeather(place);
  if (newsOpen) renderNewsPanel();
  refreshGlobeSelection();
}

// ── filters ──────────────────────────────────────────────────────────────────
// Band comes from the station name, the only signal available, so ~46% of
// channels have no band at all. Those are excluded from AM/FM rather than
// guessed at — which is why the counts never add up to the total, by design.
let filter = { band: null, tag: null };

async function renderChips() {
  const el = $("chips");
  el.innerHTML = "";
  if (selection.placeIndex == null) return;
  const facets = await window.auralfm.placeFacets(selection.placeIndex);

  const chip = (label, active, onClick) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", active);
    b.onclick = onClick;
    el.appendChild(b);
  };

  const anyFilter = filter.band || filter.tag;
  chip("All", !anyFilter, () => setFilter({ band: null, tag: null }));
  if (facets.bands.fm) chip(`FM ${facets.bands.fm}`, filter.band === "fm",
    () => setFilter({ band: filter.band === "fm" ? null : "fm", tag: filter.tag }));
  if (facets.bands.am) chip(`AM ${facets.bands.am}`, filter.band === "am",
    () => setFilter({ band: filter.band === "am" ? null : "am", tag: filter.tag }));
  for (const { tag, n } of facets.tags) {
    chip(`${tag} ${n}`, filter.tag === tag,
      () => setFilter({ band: filter.band, tag: filter.tag === tag ? null : tag }));
  }
}

async function setFilter(next) {
  filter = next;
  await selectPlace(selection.placeIndex, { keepFilter: true });
}

// ── stations ─────────────────────────────────────────────────────────────────
/**
 * A place offers two different things to listen to, and they are not
 * interchangeable: the stations broadcasting *from* there, and the shortwave
 * receivers near there that let you hear what the sky sounds like *over* there.
 *
 * Before this, the receivers existed only as dots on the globe, so the only way
 * to reach one was to hit a 4-pixel target — and in somewhere like Los Angeles
 * they are buried under a hundred station dots. A place with receivers nearby
 * now says so, and you can switch.
 */
let railMode = "stations";        // stations | shortwave

function renderRailTabs(nearby) {
  const tabs = $("railtabs");
  tabs.innerHTML = "";
  // Two different kinds of absent, and they need different mechanisms.
  //
  // Before anything is selected the tabs are genuinely not there, which is the
  // `hidden` attribute's job. Once a place is selected they are always there —
  // just blank when it has no receivers nearby — because appearing and
  // disappearing moved everything under them by 32px. That is the `ghost` class.
  //
  // Collapsing the two broke it: dropping `hidden` in favour of the class alone
  // left the attribute set from the markup with nothing to clear it, so the tabs
  // never appeared at all.
  tabs.hidden = false;
  tabs.classList.toggle("ghost", !nearby.length);
  if (!nearby.length) return;
  const mk = (mode, label) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-checked", String(railMode === mode));
    b.setAttribute("role", "radio");
    b.onclick = () => { railMode = mode; renderStations(); syncTunerVisibility(); };
    tabs.append(b);
  };
  mk("stations", `${t("app.stations", "Stations")} ${selection.total ?? selection.channels.length}`);
  mk("shortwave", `${t("rail.shortwave", "Shortwave")} ${nearby.length}`);
}

/** "#RRGGBB" plus an alpha, as an rgba() string. */
function hexA(hex, a) {
  const n = parseInt(String(hex).replace("#", ""), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/** Great-circle distance in kilometres, rounded. */
function greatCircleKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.min(1, Math.sqrt(a))));
}

/** Receivers within a day's drive of the selected place, nearest first. */
function nearbyReceivers() {
  if (!selection.place || !sdrPts) return [];
  const { lat, lon } = selection.place;
  return sdrPts
    .map((r) => ({ ...r, km: greatCircleKm(lat, lon, r.lat, r.lng) }))
    .filter((r) => r.km <= 1500)
    .sort((a, b) => a.km - b.km)
    .slice(0, 12);
}

function renderStations() {
  const { place, channels } = selection;
  syncTunerVisibility();
  // The globe read-out now opens with the selected place; without this it only
  // caught up on the next minute tick, so it showed the previous place for up to
  // sixty seconds after you moved.
  updateSun();
  headEl.hidden = false;
  headEl.querySelector("h2").textContent = place.title;
  const shown = channels.length, total = selection.total ?? shown;
  headEl.querySelector("p").textContent =
    `${place.country} · ` + (shown === total
      ? `${total} station${total === 1 ? "" : "s"}`
      : `${shown} of ${total} stations`);

  // Where this place actually is, and how far it is from what you are hearing.
  // Formatted like the sun read-out so the two agree on what a coordinate looks
  // like in this app.
  const coord = (v, pos, neg) => `${Math.abs(v).toFixed(1)}°${v >= 0 ? pos : neg}`;
  let sub = headEl.querySelector("p").textContent;
  sub += ` · ${coord(place.lat, "N", "S")} ${coord(place.lon, "E", "W")}`;
  if (playing && playing.lat != null && playing.lon != null) {
    const km = greatCircleKm(place.lat, place.lon, playing.lat, playing.lon);
    // Under 20km is the same town by another name; saying "3 km from what's
    // playing" is noise, not information.
    if (km > 20) sub += ` · ${km.toLocaleString()} km from ${playing.title}`;
  }
  headEl.querySelector("p").textContent = sub;

  const nearby = nearbyReceivers();
  if (!nearby.length) railMode = "stations";
  renderRailTabs(nearby);

  if (railMode === "shortwave") return renderNearbyReceivers(nearby);

  stationListEl.innerHTML = "";
  if (!channels.length) {
    stationListEl.innerHTML = (filter.band || filter.tag)
      ? `<div class="empty">${t("empty.noStationsFilter", "No stations match that filter here.")}</div>`
      : `<div class="empty">${t("empty.nothingOnAir", "Nothing on air here.")}</div>`;
    return;
  }
  for (const ch of channels) {
    const el = document.createElement("div");
    el.className = "st";
    el.dataset.id = ch.id;
    el.setAttribute("aria-current", playing?.id === ch.id);
    el.innerHTML = `<span class="smeta"><div class="sn"></div><div class="stags"></div></span>
                    <button class="star${isFav(ch.id) ? " on" : ""}">${Icons.svg(isFav(ch.id) ? "starFill" : "star")}</button>
                    <span class="bars"><i></i><i></i><i></i></span>`;
    el.querySelector(".sn").textContent = ch.title;
    el.querySelector(".stags").textContent = ch.tags.length ? ch.tags.slice(0, 4).join(" · ") : "";
    el.onclick = (e) => {
      if (e.target.closest(".star")) return;
      window.auralfm.tune(ch);           // an explicit pick always plays
      if (locked) setLocked(true);       // and becomes the new locked station
    };
    el.querySelector(".star").onclick = (e) => { e.stopPropagation(); toggleFav(ch); };
    // A station you added can be removed again; one you did not, cannot.
    if (ch.mine) {
      const rm = document.createElement("button");
      rm.className = "rm";
      rm.textContent = "−";
      rm.title = t("mine.remove", "Remove this station");
      rm.onclick = async (e) => {
        e.stopPropagation();
        await window.auralfm.mineRemove(ch.id);
        await selectPlace(selection.placeIndex, { keepFilter: true });
      };
      el.append(rm);
      el.querySelector(".sn").textContent = ch.title;
      el.querySelector(".stags").textContent =
        [t("mine.yours", "added by you"), ...(ch.tags || []).slice(0, 3)].join(" · ");
    }
    stationListEl.appendChild(el);
  }
  stationListEl.appendChild(addStationRow());
  paintNearby();
}

/**
 * What else is within reach, when a place has almost nothing.
 *
 * Most of the 12,296 places carry a handful of stations, so selecting one leaves
 * a couple of rows above a tall blank panel — which reads as something failing
 * to load rather than as a small town honestly having one transmitter.
 *
 * Filling it with neighbours turns a dead end into a direction. It also happens
 * to be the truest thing to put there: radio *is* regional, and the next place
 * over is exactly where a listener in a one-station town would already be
 * pointing their aerial.
 *
 * Only when the list is genuinely short. A city with four hundred stations has
 * no gap to fill and does not need advice.
 */
/**
 * One clickable place row, in the *station* list's idiom.
 *
 * Named `placeSuggestion` rather than the obvious `placeRow`, because that name
 * was already taken by the row the search results use — and a second function
 * declaration silently wins or loses depending on source order. It lost, so
 * these rows rendered in the search list's style with the wrong text, which
 * looked like a CSS problem and was a naming one.
 *
 * The cold open and the nearby list both build this. Writing it twice is how
 * the two quietly drift apart — different padding, different keyboard handling,
 * one of them forgetting `role="button"`. The audit caught the copy.
 */
function placeSuggestion(p, subtitle) {
  const row = document.createElement("div");
  row.className = "st";
  row.setAttribute("role", "button");
  row.tabIndex = 0;
  row.innerHTML = `<span class="smeta"><div class="sn"></div><div class="stags"></div></span>`;
  row.querySelector(".sn").textContent = p.title;
  row.querySelector(".stags").textContent = subtitle;
  const go = () => goToPlace(p.i, { play: false });
  row.addEventListener("click", go);
  row.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
  });
  return row;
}

const NEARBY_WHEN_UNDER = 8;
let placeCache = null;

async function paintNearby() {
  const here = selection.place;
  if (!here || selection.channels.length >= NEARBY_WHEN_UNDER) return;
  const mine = selection.placeIndex;

  if (!placeCache) {
    try { placeCache = (await window.auralfm.places("", 900)).places || []; }
    catch { placeCache = []; }
  }
  if (selection.placeIndex !== mine) return;      // selection moved while waiting

  const R = 6371, rad = Math.PI / 180;
  const km = (a, b) => {
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const h = Math.sin(dLat / 2) ** 2 +
              Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  };

  const near = placeCache
    .filter((p) => p.i !== here.i && p.count > 0)
    .map((p) => ({ ...p, km: km(here, p) }))
    // 1,200 km is a morning's drive at the top end and still the same weather,
    // the same news and usually the same language. Past that it is not "nearby",
    // it is somewhere else.
    .filter((p) => p.km <= 1200)
    .sort((a, b) => b.count - a.count || a.km - b.km)
    .slice(0, 8);
  if (!near.length) return;

  const head = document.createElement("div");
  head.className = "cohead";
  head.textContent = t("near.head", "More within reach");
  stationListEl.append(head);

  for (const p of near) {
    stationListEl.append(placeSuggestion(p, `${Math.round(p.km)} km · ${p.count} ` +
      (p.count === 1 ? t("cold.station", "station") : t("cold.stationsShort", "stations"))));
  }
}

/**
 * "Add a station" at the foot of the list for wherever you are.
 *
 * Deliberately here rather than in a menu: the moment you notice a station is
 * missing is the moment you are looking at the place it should be in, and the
 * place is the one piece of information the form would otherwise have to ask
 * for.
 */
function addStationRow() {
  const row = document.createElement("div");
  row.className = "addst";
  const btn = document.createElement("button");
  btn.textContent = `+ ${t("mine.add", "Add a station here")}`;
  btn.onclick = () => openAddForm(row);
  row.append(btn);
  return row;
}

function openAddForm(row) {
  if (row.querySelector("form")) return;
  row.innerHTML = "";
  const place = selection.place;
  const f = document.createElement("form");
  f.innerHTML =
    `<input name="title" type="text" autocomplete="off" spellcheck="false">
     <input name="url" type="url" autocomplete="off" spellcheck="false">
     <div class="err" hidden></div>
     <div class="acts"><button type="submit"></button><button type="button" class="cancel"></button></div>`;
  const $$ = (n) => f.querySelector(n);
  $$('[name="title"]').placeholder = t("mine.name", "Station name");
  $$('[name="url"]').placeholder = t("mine.url", "Stream URL (http:// or https://)");
  $$("button[type=submit]").textContent = `${t("mine.save", "Add to")} ${place.title}`;
  $$(".cancel").textContent = t("mine.cancel", "Cancel");
  $$(".cancel").onclick = () => { row.replaceWith(addStationRow()); };

  f.onsubmit = async (e) => {
    e.preventDefault();
    const err = $$(".err");
    err.hidden = true;
    const res = await window.auralfm.mineAdd({
      title: $$('[name="title"]').value,
      url: $$('[name="url"]').value,
      placeIndex: selection.placeIndex,
    });
    if (!res.ok) { err.textContent = res.error; err.hidden = false; return; }
    await selectPlace(selection.placeIndex, { keepFilter: true });
    // It exists now, so the globe should know: a place with no stations before
    // has a dot it did not have.
    globePts = (await window.auralfm.globePoints())
      .map(([i, lng, lat, count]) => ({ i, lng, lat, count }));
    applyLod(true);
    window.auralfm.tune(res.station);      // adding one is asking to hear it
  };
  row.append(f);
  $$('[name="title"]').focus();
}

async function toggleFav(ch) {
  const state = (await window.auralfm.getState()) || {};
  favorites = Array.isArray(state.favorites) ? state.favorites : [];
  const i = favorites.findIndex((f) => f.id === ch.id);
  if (i >= 0) favorites.splice(i, 1);
  else favorites.push({ id:ch.id, title:ch.title, place:ch.place, country:ch.country, secure:ch.secure });
  state.favorites = favorites;
  await window.auralfm.setState(state);
  renderStations();
}

// ── playback (observed, never performed here) ────────────────────────────────
window.auralfm.onPlayerState((s) => {
  /**
   * When the dial goes away.
   *
   * Not simply "whenever the state is not a receiver" — that was the first
   * version and it hid the dial instantly, because the popover publishes a
   * cleared state while it is still connecting. The dial appeared and vanished
   * before the first audio frame.
   *
   * The second attempt keyed on `playing`, which is worse in a quieter way: a
   * weak receiver reports not-playing while the session is perfectly alive, so
   * the dial vanished exactly when someone would reach for it.
   *
   * The signal that actually means "this session is over" is the channel no
   * longer being a receiver — after one has been seen.
   */
  if (tuneState) {
    if (s.channel?.sdr) tuneState.wasLive = true;
    else if (tuneState.wasLive) tunerStop();
  }
  playing = s.playing ? s.channel : null;
  document.body.classList.toggle("playing", !!s.playing);
  const bar = $("now");
  if (!s.channel) {
    bar.hidden = true;
    loadNews(null);
  } else {
    bar.hidden = false;
    $("nowName").textContent = s.channel.title;
    $("nowStatus").textContent = s.status || "";
    $("dot").style.display = s.playing ? "" : "none";
    Icons.set($("play"), s.playing ? "pause" : "play");
    if (typeof s.volume === "number") paintVolume(s.volume);
    // Headlines from wherever the station is broadcasting from.
    loadNews(s.playing ? s.channel.country : null);
    if (newsOpen && newsSource === "playing") renderNewsPanel();
  }
  for (const el of stationListEl.children) {
    if (!el.dataset?.id) continue;
    el.setAttribute("aria-current", playing?.id === el.dataset.id);
  }
  paintNowStar();
  syncChat(prefs);          // presence follows what is playing
  // Tuning across the world moves us to a different cell; re-read it rather than
  // keep counting against the last one.
  window.auralfm.presenceStats()
    .then((st) => { myCell = st?.cell || null; paintChatHead(); })
    .catch(() => paintChatHead());
});

/**
 * The star beside the transport.
 *
 * Favouriting already existed in every list, but not where you are most likely
 * to want it: you hear something good, and the thing you are looking at is the
 * player, not the row you clicked three minutes ago.
 *
 * Hidden for shortwave, because a favourite is a station you can return to and a
 * band on one receiver is a place plus a frequency plus whether the ionosphere
 * is cooperating. Pretending otherwise would save something that does not come
 * back.
 */
function paintNowStar() {
  const b = $("nowStar");
  if (!b) return;
  const ch = playing;
  const canFav = !!(ch && ch.id && !ch.sdr);
  b.hidden = !canFav;
  if (!canFav) return;
  const on = isFav(ch.id);
  Icons.set(b, on ? "starFill" : "star");
  b.classList.toggle("on", on);
  b.setAttribute("aria-pressed", String(on));
}

$("nowStar").onclick = async () => {
  if (!playing || !playing.id || playing.sdr) return;
  await toggleFav(playing);          // it reloads `favorites` from disk; paint after
  paintNowStar();
};

// ── transport ────────────────────────────────────────────────────────────────
// Explore has no audio element — these drive the one player in the popover, so
// there is still exactly one stream no matter which window you touch.
$("play").onclick = () => window.auralfm.transport({ action: "toggle" });

let preMute = 0.8;
function paintVolume(v) {
  $("vol").value = v;
  Icons.set($("mute"), v === 0 ? "volumeOff" : v < 0.5 ? "volumeLow" : "volumeHigh");
}
$("vol").oninput = () => {
  const v = +$("vol").value;
  paintVolume(v);
  window.auralfm.transport({ action: "volume", value: v });
};
$("mute").onclick = () => {
  const cur = +$("vol").value;
  const next = cur > 0 ? 0 : (preMute || 0.8);
  if (cur > 0) preMute = cur;
  paintVolume(next);
  window.auralfm.transport({ action: "volume", value: next });
};

// ── station lock ─────────────────────────────────────────────────────────────
/**
 * Lock keeps what you're hearing fixed while you wander the globe.
 *
 * It blocks *incidental* changes only — clicking a dot, or the list following
 * the map. Explicitly clicking a station name still plays it, because that is an
 * unambiguous "play this", and it re-locks onto the new station rather than
 * silently unlocking.
 */
let locked = false;

function setLocked(on) {
  locked = on;
  const b = $("lock");
  b.setAttribute("aria-pressed", on);
  Icons.set(b, on ? "lock" : "unlock");
  b.title = on
    ? "Locked — browsing won't change the station. Click a station to switch."
    : "Lock this station while you browse";
  window.auralfm.getState().then((st) => window.auralfm.setState({ ...(st || {}), locked: on }));
}
$("lock").onclick = () => setLocked(!locked);

// ── favourites ───────────────────────────────────────────────────────────────
let showingFavorites = false;

async function showFavorites() {
  const state = (await window.auralfm.getState()) || {};
  favorites = Array.isArray(state.favorites) ? state.favorites : [];
  showingFavorites = true;
  $("favBtn").setAttribute("aria-pressed", "true");
  qEl.value = "";
  headEl.hidden = true;
  stationListEl.hidden = true;
  placeListEl.hidden = false;
  placeHeadEl.textContent = favorites.length
    ? `${favorites.length} favorite${favorites.length === 1 ? "" : "s"}`
    : "Favorites";
  placeListEl.innerHTML = "";
  if (!favorites.length) {
    placeListEl.innerHTML =
      `<div class="empty" style="padding:30px 16px">${t("empty.favorites", "No favorites yet.")}<br>${t("empty.favoritesHint", "Tap the star beside a station to save it.")}</div>`;
    return;
  }
  for (const f of favorites) placeListEl.appendChild(stationResultRow(f));
}

$("favBtn").onclick = () => {
  if (showingFavorites) { showingFavorites = false; $("favBtn").setAttribute("aria-pressed","false"); loadPlaces(""); }
  else showFavorites();
};

// ── markets ──────────────────────────────────────────────────────────────────
/**
 * Live prices in the transport bar.
 *
 * Crypto is keyless via CoinGecko. Equities are not: Yahoo's public endpoint
 * 429s and Stooq's CSV is gone, so every remaining provider wants an API key.
 * Rather than fake an index, the strip shows what it can actually verify and
 * says so on hover.
 */
let marketTimer = null;

/**
 * Crypto now arrives over a live Coinbase socket rather than a 90-second poll,
 * so the ticker refreshes once a second and prices visibly move. Rows are
 * updated in place rather than rebuilt — replacing the DOM every second
 * restarts the flash animation on every symbol at once, which turns a quiet
 * ticker into a strobe.
 */
let lastPrices = new Map();

async function renderMarkets() {
  const el = $("markets");
  if (!el) return;
  const { items, hasStocks } = (await window.auralfm.markets()) || { items: [] };
  if (!items?.length) { el.textContent = ""; return; }

  // Same symbols in the same order: update the numbers and leave the DOM alone.
  const existing = [...el.children];
  const sameShape = existing.length === items.length &&
    items.every((it, i) => existing[i].dataset.sym === it.symbol);
  if (sameShape) {
    items.forEach((it, i) => {
      const wrap = existing[i];
      const up = (it.changePct ?? 0) >= 0;
      const px = wrap.querySelector(".px");
      const text = it.price >= 1000 ? Math.round(it.price).toLocaleString()
                 : it.price >= 1   ? it.price.toFixed(2)
                 : it.price.toFixed(4);
      if (px.textContent !== text) {
        const prev = lastPrices.get(it.symbol);
        px.textContent = text;
        // A one-shot tint in the direction it moved, so you can see it tick.
        if (prev != null && it.price !== prev) {
          px.classList.remove("tick-up", "tick-dn");
          void px.offsetWidth;                       // restart the animation
          px.classList.add(it.price > prev ? "tick-up" : "tick-dn");
        }
      }
      lastPrices.set(it.symbol, it.price);
      const ch = wrap.querySelector(".ch");
      ch.className = `ch ${up ? "up" : "dn"}`;
      ch.textContent = it.changePct == null ? "" : `${up ? "▲" : "▼"}${Math.abs(it.changePct).toFixed(2)}%`;
    });
    el.title = hasStocks ? "" : el.title;
    return;
  }

  el.innerHTML = "";
  for (const it of items) {
    lastPrices.set(it.symbol, it.price);
    const up = (it.changePct ?? 0) >= 0;
    const wrap = document.createElement("span");
    wrap.className = "m";
    wrap.dataset.sym = it.symbol;
    wrap.innerHTML = `<span class="sym"></span><span class="px"></span><span class="ch"></span>`;
    wrap.querySelector(".sym").textContent = it.symbol;
    wrap.querySelector(".px").textContent =
      it.price >= 1000 ? Math.round(it.price).toLocaleString()
      : it.price >= 1   ? it.price.toFixed(2)
      : it.price.toFixed(4);
    const ch = wrap.querySelector(".ch");
    ch.className = `ch ${up ? "up" : "dn"}`;
    ch.textContent = it.changePct == null ? "" : `${up ? "▲" : "▼"}${Math.abs(it.changePct).toFixed(2)}%`;
    el.appendChild(wrap);
  }
  el.title = hasStocks
    ? "Crypto and equities · 24h change"
    : "Crypto · 24h change. Equities need an API key (set AURALFM_STOCK_KEY).";
}

// ── headline panel ───────────────────────────────────────────────────────────
/**
 * A reading list, not a reader. RSS carries headline, publisher and time but not
 * article text; rendering the article would mean scraping publisher sites, which
 * is fragile and a licensing problem. Clicking hands off to the browser.
 */
let newsOpen = false;
/**
 * Headline source, cycled from the panel header.
 *   world   international edition — the default, because this app is about the
 *           whole globe rather than one country
 *   place   wherever you're looking on the map
 *   playing the country of the station currently on air
 */
const NEWS_SOURCES = ["world", "place", "playing"];
let newsSource = "world";

function relTime(ms) {
  if (!ms) return "";
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "now";
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
}

async function renderNewsPanel() {
  const panel = $("newspanel");
  panel.hidden = !newsOpen;
  document.body.classList.toggle("news-open", newsOpen);
  $("newsBtn").setAttribute("aria-pressed", newsOpen);
  if (!newsOpen) return;

  const country =
    newsSource === "world"   ? null
    : newsSource === "playing" ? (tickCountry || null)
    : (selection.place?.country || null);

  const labels = { world: "World", place: "This place", playing: "Now playing" };
  $("newsSrc").setAttribute("aria-pressed", newsSource !== "world");
  $("newsSrc").title = `Source: ${labels[newsSource]} — click to change`;
  $("newsplace").textContent =
    newsSource === "world" ? "World headlines"
    : country ? country
    : `${labels[newsSource]} · nothing selected`;
  const list = $("newslist");
  list.innerHTML = `<div class="empty" style="padding:22px 12px">Loading…</div>`;

  const items = await window.auralfm.news(country);
  if (!newsOpen) return;
  if (!items?.length) {
    list.innerHTML = `<div class="empty" style="padding:22px 12px">`
      + (country ? "No headlines for here." : "Headlines unavailable right now.")
      + `</div>`;
    return;
  }
  if (reading) return renderReader(list);
  list.innerHTML = "";
  for (const it of items) {
    const el = document.createElement("div");
    el.className = "story";
    el.innerHTML = `<div class="h"></div><div class="m"></div>`;
    el.querySelector(".h").textContent = it.title;
    el.querySelector(".m").textContent = [it.source, relTime(it.at)].filter(Boolean).join(" · ");
    if (it.link) el.onclick = () => openReader(it);
    list.appendChild(el);
  }
}

/**
 * The reader.
 *
 * A headline is a promise, and a link out to a page of consent banners and
 * newsletter interstitials is how that promise gets broken. The article is
 * fetched and stripped in the main process — no CORS there — and read in the
 * panel it was found in.
 *
 * It fails openly. Roughly a third of stories will not extract: paywalls,
 * publishers that block anything without a session, pages that are mostly
 * JavaScript. When that happens the button to open it properly is right there,
 * which is a better answer than a spinner that never resolves.
 */
let reading = null;

async function openReader(item) {
  reading = { item, doc: null, state: "loading" };
  renderNewsPanel();
  const doc = await window.auralfm.readArticle(item.link).catch(() => null);
  // The panel may have moved on while a slow publisher was thinking.
  if (!reading || reading.item !== item) return;
  reading = { item, doc, state: doc ? "ready" : "failed" };
  renderNewsPanel();
}

function closeReader() { reading = null; renderNewsPanel(); }

function renderReader(list) {
  const { item, doc, state } = reading;
  list.innerHTML = "";

  const back = document.createElement("button");
  back.className = "readback";
  back.textContent = t("news.back", "‹ Headlines");
  back.onclick = closeReader;
  list.append(back);

  const h = document.createElement("div");
  h.className = "readtitle";
  h.textContent = (doc && doc.title) || item.title;
  const meta = document.createElement("div");
  meta.className = "readmeta";
  meta.textContent = [item.source, relTime(item.at),
    doc ? `${doc.words.toLocaleString()} ${t("news.words", "words")}` : null]
    .filter(Boolean).join(" · ");
  list.append(h, meta);

  if (state === "loading") {
    const p = document.createElement("div");
    p.className = "readnote";
    p.textContent = t("news.loading", "Fetching the article…");
    list.append(p);
    return;
  }

  if (state === "failed") {
    const p = document.createElement("div");
    p.className = "readnote";
    p.textContent = t("news.failed",
      "This one will not open here — it is paywalled or needs a browser.");
    const b = document.createElement("button");
    b.className = "readopen";
    b.textContent = t("news.open", "Open in browser");
    b.onclick = () => window.auralfm.openLink(item.link);
    list.append(p, b);
    return;
  }

  for (const para of doc.paragraphs) {
    const p = document.createElement("p");
    p.className = "readp";
    p.textContent = para;
    list.append(p);
  }
  const b = document.createElement("button");
  b.className = "readopen";
  b.textContent = t("news.open", "Open in browser");
  b.onclick = () => window.auralfm.openLink(doc.url || item.link);
  list.append(b);
}

$("newsBtn").onclick = () => { newsOpen = !newsOpen; reading = null; renderNewsPanel(); };
$("newsClose").onclick = () => { newsOpen = false; reading = null; renderNewsPanel(); };
$("newsSrc").onclick = () => {

 * playing" source knows what to ask for. Fetching moved into the card, which

let tickCountry = null;

// ── weather ──────────────────────────────────────────────────────────────────
// Imperial for US locales, metric everywhere else — the app is used by whoever
// clones it, and 87°F/30°C is the kind of detail that reads as wrong instantly.
const US = /^en-US|^en$/.test(navigator.language || "");
const temp = (c) => (US ? `${Math.round(c * 9 / 5 + 32)}°F` : `${Math.round(c)}°C`);

async function loadWeather(place) {

    : null;

// ── globe view ───────────────────────────────────────────────────────────────
let globe = null, globeLoading = null, globePts = null, sunTimer = null;

/**
 * Shortwave receivers, merged into the same point layer as the stations rather
 * than given a layer of their own. globe.gl merges points into one geometry, so
 * a second layer would mean a second full rebuild on every selection change for
 * the sake of 838 dots. Per-point colour is a function, so one layer can carry
 * both — the only cost is that everything downstream has to check `kind`.
 */
let sdrPts = null;
let sdrSel = null;      // the receiver whose bands are in the rail
let liveTexReady = false;

/** Load the 1.7 MB globe bundle only when someone actually asks for the globe. */
function loadGlobeLib() {
  if (window.Globe) return Promise.resolve();
  if (globeLoading) return globeLoading;
  globeLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "vendor/globe.gl.min.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("globe.gl failed to load — run `npm run vendor`"));
    document.head.appendChild(s);
  });
  return globeLoading;
}

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/**
 * Sub-solar point: the lat/lng where the sun is directly overhead right now.
 * NOAA-style approximation — declination plus the equation of time, which is the
 * bit that stops the terminator drifting up to ~16 minutes off across the year.
 * Accurate to well under a degree, which is far finer than a globe this size can
 * show.
 */
function subsolarPoint(date = new Date()) {
  const rad = Math.PI / 180;
  const dayOfYear = (date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 86400000;
  const decl = -23.44 * Math.cos(rad * (360 / 365) * (dayOfYear + 10));
  const B = rad * (360 / 365) * (dayOfYear - 81);
  const eqTime = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // minutes
  const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
  let lng = -15 * (utcHours - 12 + eqTime / 60);
  lng = ((lng + 180) % 360 + 360) % 360 - 180;
  return { lat: decl, lng };
}

/**
 * Sub-lunar point and illuminated fraction.
 *
 * Low-precision lunar position (Meeus, chapter 47, principal terms only) —
 * roughly a degree, which is finer than a dot on this globe can express. A full
 * ephemeris would be many times the code for no visible gain.
 *
 * Deliberately *not* used to light the Earth: real moonlight is ~400,000x
 * dimmer than sunlight and would be invisible next to the night-lights texture.
 * It marks where the moon is, and how full it is.
 */
function moonPoint(date = new Date()) {
  const rad = Math.PI / 180;
  const JD = date.getTime() / 86400000 + 2440587.5;
  const T = (JD - 2451545) / 36525;

  const L = 218.316 + 13.176396 * (JD - 2451545);        // mean longitude
  const M = 134.963 + 13.064993 * (JD - 2451545);        // mean anomaly
  const F = 93.272 + 13.229350 * (JD - 2451545);         // argument of latitude

  const lambda = (L + 6.289 * Math.sin(M * rad)) * rad;  // ecliptic longitude
  const beta = 5.128 * Math.sin(F * rad) * rad;          // ecliptic latitude
  const eps = (23.439 - 0.0000004 * (JD - 2451545)) * rad;

  // ecliptic -> equatorial
  const ra = Math.atan2(
    Math.sin(lambda) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps),
    Math.cos(lambda));
  const dec = Math.asin(
    Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lambda));

  // Greenwich mean sidereal time -> sub-lunar longitude
  const gmst = (280.46061837 + 360.98564736629 * (JD - 2451545)) % 360;
  let lng = (ra / rad - gmst) % 360;
  lng = ((lng + 180) % 360 + 360) % 360 - 180;

  // Illuminated fraction from the sun-moon elongation.
  const sunM = (357.529 + 0.98560028 * (JD - 2451545)) * rad;
  const sunLambda = (280.459 + 0.98564736 * (JD - 2451545) + 1.915 * Math.sin(sunM)) * rad;
  const elong = Math.acos(Math.cos(beta) * Math.cos(lambda - sunLambda));
  const illum = (1 - Math.cos(elong)) / 2;
  // Waxing when the moon leads the sun in ecliptic longitude.
  const waxing = Math.sin(lambda - sunLambda) > 0;

  return { lat: dec / rad, lng, illum, waxing };
}

const MOON_PHASES = [
  [0.02, "new moon", "●"], [0.24, "waxing crescent", "☽"], [0.30, "first quarter", "☽"],
  [0.72, "waxing gibbous", "☽"], [0.98, "full moon", "○"], [1.01, "waning gibbous", "☾"],
];
function moonPhaseName({ illum, waxing }) {
  if (illum < 0.02) return ["new moon", "●"];
  if (illum > 0.98) return ["full moon", "○"];
  const band = illum < 0.28 ? "crescent" : illum < 0.72 ? "quarter" : "gibbous";
  const dir = waxing ? "waxing" : "waning";
  const name = band === "quarter" ? (waxing ? "first quarter" : "last quarter") : `${dir} ${band}`;
  return [name, waxing ? "☽" : "☾"];
}

/** Unit vector toward the sun, in the globe's own coordinate frame. */
function sunVector() {
  const { lat, lng } = subsolarPoint();
  const c = globe.getCoords(lat, lng, 0);
  const len = Math.hypot(c.x, c.y, c.z) || 1;
  return { x: c.x / len, y: c.y / len, z: c.z / len };
}

/** globe.gl doesn't re-export THREE, so clone the texture class off an existing one. */
function loadTexture(url, TexClass, like) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const t = new TexClass(img);
      if (like) {
        t.wrapS = like.wrapS; t.wrapT = like.wrapT;
        t.colorSpace = like.colorSpace; t.flipY = like.flipY;
        t.minFilter = like.minFilter; t.magFilter = like.magFilter;
      }
      t.needsUpdate = true;
      resolve(t);
    };
    img.onerror = () => reject(new Error(`texture failed: ${url}`));
    img.src = url;
  });
}

/**
 * Poll until fn() returns something truthy.
 *
 * The budget counts only time the window is actually visible. three-globe hands
 * its texture over on a render tick, and a hidden or occluded window has its
 * animation frames throttled to nothing — so wall-clock time spent in the
 * background is time in which nothing could possibly have progressed. Charging
 * it against the timeout is how a backgrounded launch used to fail.
 */
const waitFor = (fn, ms = 30000) => new Promise((res, rej) => {
  let spent = 0, last = Date.now();
  (function poll() {
    const v = fn();
    if (v) return res(v);
    const now = Date.now();
    if (!document.hidden) spent += now - last;
    last = now;
    if (spent > ms) return rej(new Error("timed out waiting for texture"));
    setTimeout(poll, 60);
  })();
});

/**
 * Blend the daytime and night-lights textures across the real terminator.
 *
 * Injected into the existing MeshPhongMaterial rather than built as a fresh
