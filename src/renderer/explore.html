<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; font-src 'self'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'self'; connect-src ws: wss:;">
<title>Explore</title>
<style>
  /* Inter, vendored. SIL Open Font License 1.1, which explicitly permits
     bundling and redistribution — see assets/fonts/Inter-LICENSE.txt.
     One variable file covers every weight the app uses.
     The point is not that Inter beats SF on a Mac; it is that the app looks
     like itself on Windows, Linux and Android too, where there is no SF. */
  @font-face{
    font-family:"Inter";
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
    src:url("../../assets/fonts/InterVariable.woff2") format("woff2");
  }
  /**
   * Tell the browser which appearance its own controls are in.
   *
   * `prefers-color-scheme` reads the OS. `color-scheme` tells the renderer what
   * to draw, and nothing here ever set it — so every user-agent control kept
   * following the system while the rest of the app followed the setting. That
   * is not a cosmetic gap: it is why the lock button measured 1.04:1 on the dark
   * bar. A button with no `color` takes the UA default, and the UA default is
   * black until this line says otherwise.
   *
   * It also governs the volume slider's track, the scrollbars, and the default
   * text colour of any control that does not set one. `light dark` means follow
   * the OS, which is right when the theme is "system"; the two overrides below
   * pin it when the theme is not.
   */
  :root{ color-scheme: light dark; }
  :root[data-theme="light"]{ color-scheme: light; }
  :root[data-theme="dark"]{ color-scheme: dark; }

  :root{
    /* Corner radii. Thirteen distinct values became five. Not one value for
       everything -- a 2px meter bar and a floating panel genuinely differ --
       but a scale, so nested corners stay concentric instead of arbitrary. */
    --r-sm:5px; --r-md:7px; --r-lg:10px; --r-xl:14px; --r-pill:999px;
    --label:rgba(247,244,238,.94); --label2:rgba(247,244,238,.56); --label3:rgba(247,244,238,.30);
    --fill:rgba(233,226,212,.07); --fill-hi:rgba(233,226,212,.13);
    --line:rgba(233,226,212,.11); --pane:rgba(30,27,25,.62); --bg:#0C0B0B;
    --accent:#E9E2D4; --star:#F5F0E4; --on-accent:#12100F;
    /* Motion. Named rather than retyped: the drawer curve below was already
       hand-written at three call sites across three files. Values are not
       retuned here -- ease-drawer is exactly what this app already used. */
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --ease-drawer:cubic-bezier(.32,.72,0,1);
    --dur-press:90ms; --dur-hover:.12s; --dur-control:.15s;
    --dur-panel:.22s; --dur-reveal:.42s;
    /* Semantic, and separate from --accent on purpose: a rising market and a
       failed stream mean the same thing whatever palette is chosen, so these
       must not follow the accent. They were systemGreen and systemRed. */
    --up:#35C46A; --down:#E0574A; --err:#E0574A;
    /* Depth comes from these two, not from more blur. A machined edge catches
       light along its top and goes dark where it meets what is behind it —
       which is also the cheapest way to sit a panel over a live globe on an
       integrated GPU. */
    --edge-hi:rgba(247,244,238,.13); --edge-lo:rgba(0,0,0,.55);
  }
  /* System appearance, unless Settings has forced the other one. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
    --up:#1F7A4C; --down:#C4362B; --err:#C4362B;
      --edge-hi:rgba(255,255,255,.75); --edge-lo:rgba(23,21,20,.16);
      --label:rgba(23,21,20,.88); --label2:rgba(23,21,20,.52); --label3:rgba(23,21,20,.26);
    --fill:rgba(23,21,20,.05); --fill-hi:rgba(23,21,20,.09);
    --line:rgba(23,21,20,.10); --pane:rgba(250,248,244,.60); --bg:#F2EFE9;
    --accent:#2A2622; --star:#8A6D1F; --on-accent:#F7F4EE;
    }
  }
  :root[data-theme="light"]{
    --up:#1F7A4C; --down:#C4362B; --err:#C4362B;
    --edge-hi:rgba(255,255,255,.75); --edge-lo:rgba(23,21,20,.16);
    --label:rgba(23,21,20,.88); --label2:rgba(23,21,20,.52); --label3:rgba(23,21,20,.26);
    --fill:rgba(23,21,20,.05); --fill-hi:rgba(23,21,20,.09);
    --line:rgba(23,21,20,.10); --pane:rgba(250,248,244,.60); --bg:#F2EFE9;
    --accent:#2A2622; --star:#8A6D1F; --on-accent:#F7F4EE;
  }
  :root[data-theme="dark"]{
    --label:rgba(247,244,238,.94); --label2:rgba(247,244,238,.56); --label3:rgba(247,244,238,.30);
    --fill:rgba(233,226,212,.07); --fill-hi:rgba(233,226,212,.13);
    --line:rgba(233,226,212,.11); --pane:rgba(30,27,25,.62); --bg:#0C0B0B;
    --accent:#E9E2D4; --star:#F5F0E4; --on-accent:#12100F;
  }
  /* Increased contrast follows the system setting until Settings overrides it. */
  @media (prefers-contrast: more){
    :root:not([data-contrast="normal"]){--label2:var(--label); --label3:var(--label2)}
  }
  /* Increased contrast. Deliberately NOT the CanvasText system keyword: that
     keyword tracks the OS appearance, so on a light Mac with the theme forced to
     Dark it paints black text on a dark background. These track our own theme. */
  :root[data-contrast="more"]{
    --label:#fff; --label2:#fff; --label3:rgba(255,255,255,.78);
    --line:rgba(255,255,255,.55);
    --pane:rgba(12,12,14,.92); --bg:#000;
  }
  :root[data-contrast="more"][data-theme="light"]{
    --label:#000; --label2:#000; --label3:rgba(0,0,0,.75);
    --line:rgba(0,0,0,.55);
    --pane:rgba(255,255,255,.94); --bg:#fff;
  }
  @media (prefers-color-scheme: light){
    :root[data-contrast="more"]:not([data-theme="dark"]){
      --label:#000; --label2:#000; --label3:rgba(0,0,0,.75);
      --line:rgba(0,0,0,.55);
      --pane:rgba(255,255,255,.94); --bg:#fff;
    }
  }
  :root[data-contrast="more"] .row[aria-current="true"]{outline:1px solid var(--accent)}
  @media (prefers-reduced-transparency: reduce){ body{background:var(--bg)} .content{background:var(--bg)} }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;animation-duration:.01ms !important} }

  /**
   * `hidden` wins, always.
   *
   * Four times now an element has been given an explicit `display` in CSS and
   * the `hidden` attribute in HTML, and the attribute lost — most recently the
   * shortwave dial, which sat over station lists showing an empty waterfall.
   * Each time it was patched for that one element, which is exactly why it kept
   * happening.
   *
   * `!important` is load-bearing rather than lazy: a plain `[hidden]` rule is
   * specificity (0,1,0) and loses to `#tuner{display:flex}` at (1,0,0).
   */
  [hidden]{display:none !important}
  :root{--rail:clamp(340px, 26vw, 900px)}

  /* The first reveal.
     The window is created hidden and shown only once the globe has painted, so
     without this the launch ends in a hard cut: a 260px splash card is replaced
     in one frame by a full window with a finished Earth in it. Fading the page
     up from the window's own onyx makes the two surfaces read as one object
     continuing rather than two objects swapping.
     The window itself is never animated. Native opacity animation is expensive
     on the Intel integrated GPU this app targets, and #35 was already a motion
     regression on exactly that hardware. */
  body{
    opacity:0;transform:scale(.994);
    transition:opacity var(--dur-reveal) var(--ease-drawer),transform var(--dur-reveal) var(--ease-drawer);
  }
  body.revealed{opacity:1;transform:none}
  /* Gentler, not gone: the fade still explains that the window arrived, but
     nothing moves. */
  @media (prefers-reduced-motion: reduce){
    body{transform:none;transition:opacity var(--dur-panel) var(--ease-out)}
  }

  /* Stations vs shortwave. Same segmented shape as Settings, so the two places
     in the app where you pick between modes look like the same idea.
     Always occupies its space, even when there are no receivers nearby to
     offer — appearing and disappearing moved everything under it by 32px. That
     uses a class rather than the `hidden` attribute, because `hidden` means
     "not here" and this element is here, just not showing anything. */
  .railtabs{
    display:flex;gap:2px;padding:2px;margin:0 13px 6px;
    background:var(--fill);border-radius:var(--r-md);min-height:30px;
    position:relative;isolation:isolate;
  }
  /* One pill that moves, rather than two backgrounds cross-fading. The
     selection travels between the two tabs, which is what actually happened. */
  .railtabs::before{
    content:"";position:absolute;z-index:0;
    top:2px;bottom:2px;left:2px;width:calc(50% - 3px);
    border-radius:var(--r-sm);background:var(--label);
    transition:transform var(--dur-control) var(--ease-out);
  }
  .railtabs[data-sel="shortwave"]::before{transform:translateX(calc(100% + 2px))}
  .railtabs.ghost::before{display:none}
  @media (prefers-reduced-motion: reduce){ .railtabs::before{transition:none} }
  .railtabs.ghost{visibility:hidden}
  .railtabs button{
    flex:1;appearance:none;border:0;background:transparent;color:var(--label2);
    position:relative;z-index:1;
    font:inherit;font-size:11px;font-weight:530;letter-spacing:-.002em;
    padding:4px 8px;border-radius:var(--r-sm);cursor:default;white-space:nowrap;
    transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out);
  }
  .railtabs button:hover{background:var(--fill-hi);color:var(--label)}
  .railtabs button[aria-checked="true"]{color:var(--bg);font-weight:590}
  .railtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* A one-shot tint when a price moves, so the ticker reads as alive without
     demanding attention. Fades over most of a second. */
  @keyframes tickUp{from{color:var(--up)}to{color:inherit}}
  @keyframes tickDn{from{color:var(--down)}to{color:inherit}}
  .m .px.tick-up{animation:tickUp .9s ease-out}
  .m .px.tick-dn{animation:tickDn .9s ease-out}
  @media (prefers-reduced-motion: reduce){ .m .px.tick-up,.m .px.tick-dn{animation:none} }

  /* Add-a-station lives at the foot of the list, quiet until wanted. */
  .addst{padding:8px 15px 18px}
  .addst > button{
    appearance:none;background:none;border:0;color:var(--label2);font:inherit;font-size:12px;
    padding:6px 0;cursor:default;text-align:left;width:100%;
  }
  .addst > button:hover{color:var(--accent)}
  .addst form{display:flex;flex-direction:column;gap:6px}
  .addst input{
    appearance:none;background:var(--fill);border:0;border-radius:var(--r-md);color:var(--label);
    font:inherit;font-size:12px;padding:7px 9px;box-shadow:inset 0 0 0 .5px var(--line);
  }
  .addst input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .addst .acts{display:flex;gap:6px;margin-top:2px}
  .addst .acts button{
    appearance:none;border:0;border-radius:var(--r-md);font:inherit;font-size:12px;font-weight:530;
    padding:6px 11px;cursor:default;
  }
  .addst .acts button[type=submit]{background:var(--accent);color:var(--on-accent)}
  .addst .acts .cancel{background:var(--fill);color:var(--label2)}
  .addst .err{font-size:11px;color:var(--err);padding:1px 2px}
  .st .rm{
    appearance:none;background:none;border:0;color:var(--label3);font:inherit;font-size:15px;
    line-height:1;padding:2px 6px;cursor:default;border-radius:var(--r-sm);
  }
  .st .rm:hover{color:var(--err);background:var(--fill)}

  /* A removed station, during the few seconds it can still be brought back.
     Undo rather than a confirmation dialog because the thing being protected is
     a URL somebody typed by hand, and a modal for a one-character button is
     heavier than the action deserves. Nothing is actually deleted until the
     window closes, so the station keeps its id and any favourite pointing at it
     stays pointing at it — re-adding would mint a new id and quietly orphan it. */
  .st.undo{opacity:.62}
  .st.undo .sn{text-decoration:line-through;color:var(--label2)}
  .st .undob{
    appearance:none;background:none;border:0;font:inherit;font-size:11.5px;
    color:var(--accent);padding:2px 6px;cursor:default;border-radius:var(--r-sm);
    font-weight:590;letter-spacing:.004em;
  }
  .st .undob:hover{background:var(--fill)}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    /* The window is opaque now (see the note in main.js), so the page owns its
       own background instead of relying on a vibrancy layer behind it. */
    background:var(--bg);color:var(--label);
    font:13px/1.35 "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
    display:flex;flex-direction:column;
  }

  /* Toolbar sits under the traffic lights (titleBarStyle: hiddenInset). */
  .toolbar{
    flex:none;height:52px;display:flex;align-items:center;gap:10px;
    padding:0 14px 0 84px;-webkit-app-region:drag;
  }
  .toolbar .sp{flex:1}
  /**
   * Everything interactive in the title bar must opt out of the drag region.
   *
   * The bar itself is `-webkit-app-region: drag` so the window can be moved by
   * its chrome, and that swallows clicks on anything inside it. This was written
   * per-button, so the Layers button — added later — inherited the drag and
   * could only be highlighted, never pressed: clicking it moved the window.
   *
   * One rule for every control instead of one per id, so the next button to
   * arrive cannot repeat it.
   */
  .toolbar input,
  .toolbar button{-webkit-app-region:no-drag}
  .toolbar button{
    background:none;border:0;color:var(--label2);
    font-size:16px;line-height:1;padding:3px 6px;border-radius:var(--r-md);cursor:default;
    transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out);
  }
  .toolbar button:hover{background:var(--fill);color:var(--label)}
  .toolbar button[aria-pressed="true"]{color:var(--accent);background:var(--fill)}
  .toolbar #q{
    width:clamp(280px, 24vw, 560px);height:24px;padding:0 9px;border:0;border-radius:var(--r-md);
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    /* Focus no longer changes the width. It used to grow, which animated a
       layout property in the one bar that also carries the live markets ticker
       — so every frame of the grow relaid out prices that are already moving.
       The field is simply the larger size now; focus is shown by the ring. */
    transition:box-shadow var(--dur-control) var(--ease-out),background var(--dur-control) var(--ease-out);
  }
  .toolbar #q:focus{
    background:var(--fill-hi);
    box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);
  }
  .toolbar #q::placeholder{color:var(--label2)}
  .toolbar #q::-webkit-search-cancel-button{display:none}

  /* Segmented control — the switch between List and Globe. */
  .seg{display:flex;background:var(--fill);border-radius:var(--r-md);padding:2px;gap:2px}
  .seg button{
    border:0;background:none;color:var(--label2);font:inherit;font-size:12px;
    padding:3px 11px;border-radius:var(--r-sm);cursor:default;
    transition:background var(--dur-control) var(--ease-out),color var(--dur-control) var(--ease-out);
  }
  .seg button[aria-selected="true"]{background:var(--pane);color:var(--label);box-shadow:0 .5px 1.5px rgba(0,0,0,.18)}
  .seg button:disabled{opacity:.4}

  .cols{flex:1;display:flex;min-height:0}

  /* Left: places. Darker material — AppKit uses heavier surfaces for structure. */
  .places{
    width:266px;flex:none;display:flex;flex-direction:column;min-height:0;
    border-right:.5px solid var(--line);
  }
  .searchwrap{padding:0 12px 9px}
  #q{
    width:100%;height:24px;padding:0 9px;border:0;border-radius:var(--r-md);
    background:var(--fill);color:var(--label);font:inherit;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    transition:box-shadow var(--dur-control) var(--ease-out),background var(--dur-control) var(--ease-out);
  }
  #q:focus{background:var(--fill-hi);box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  #q::placeholder{color:var(--label2)}
  #q::-webkit-search-cancel-button{display:none}

  .secthead{
    padding:2px 15px 5px;font-size:11px;font-weight:590;letter-spacing:.005em;color:var(--label2);flex:none;
  }
  .sublabel{
    padding:10px 8px 4px;font-size:11px;font-weight:590;color:var(--label3);letter-spacing:.005em;
  }

  .scroll{flex:1;overflow-y:auto;padding:0 7px 10px}
  /* Wide rails get columns rather than one lonely strip of text. */
  @media (min-width: 1250px){
    #stationlist, #placelist{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
      grid-auto-rows:max-content; gap:0 6px; align-content:start;
    }
    /* display:grid beats the [hidden] attribute, so both lists were rendering
       at once on wide windows — places and stations stacked in the same rail. */
    #stationlist[hidden], #placelist[hidden]{display:none}
    #stationlist .empty, #placelist .empty{grid-column:1/-1}
    .sublabel{grid-column:1/-1}
  }
  .scroll::-webkit-scrollbar{width:0}

  .place{
    display:flex;align-items:baseline;gap:8px;padding:5px 10px;border-radius:var(--r-md);
    transition:background var(--dur-hover) var(--ease-out);
  }
  .place:hover{background:var(--fill)}
  .place:active{background:var(--fill-hi);transform:scale(.97);transition:transform var(--dur-press) var(--ease-out)}
  .place[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .place[aria-selected="true"] .pn{color:var(--accent);font-weight:590}
  .pmeta{flex:1;min-width:0}
  .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.002em}
  .pc{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cnt{
    flex:none;font-size:10px;color:var(--label3);font-variant-numeric:tabular-nums;
    min-width:22px;text-align:right;
  }

  /* The globe is the product, so it is always on screen — never a mode you
     switch into. The right rail is what changes: results while searching,
     stations once a place is chosen. */
  .globecol{flex:1;min-width:0;display:flex;flex-direction:column;border-right:.5px solid var(--line)}
  .globewrap{flex:1;position:relative;min-width:0}
  /* Read-outs sit on chrome above the globe, not over it. White text on bright
     cloud was illegible — which is what the screenshot showed. */
  .globebar[hidden]{display:none}   /* display:flex below would otherwise win */
  /**
   * Lives inside .globecol, not beside it. As a sibling of .cols it spanned the
   * whole window and ran underneath the station rail, which is what the
   * overflow looked like — the text was not too long, the box was too wide.
   *
   * min-width:0 is the part that actually makes the ellipsis work: a flex child
   * defaults to min-width:auto, which refuses to shrink below its content, so
   * `overflow:hidden` had nothing to clip against.
   */
  /**
   * The read-outs, floated over the globe.
   *
   * They used to be a strip above it, which gave a row of numbers the same
   * prominence as the thing they annotate — and most people opening this app
   * have no idea what a subsolar point or a K-index is. Over the planet, small
   * and tinted, they read as ambient rather than as a status bar demanding to be
   * understood.
   *
   * `pointer-events:none` matters: this sits on the globe, and the globe is the
   * control.
   */
  .globebar{
    /* Flush to the bottom edge. A 10px inset looked right against a black night
       side and showed as a visible band of globe under the line the moment you
       zoomed into anything bright — the Sahara made it obvious. */
    position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
    padding-bottom:7px;
    display:flex;align-items:center;justify-content:center;gap:0;
    padding:0 18px;font-size:10.5px;color:var(--label3);
    letter-spacing:.006em;white-space:nowrap;overflow:hidden;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  /**
   * A scrim under the line.
   *
   * A text shadow alone is enough over ocean and useless over a sunlit desert,
   * which is most of the globe half the time. This is the same thing subtitles
   * have always done: darken a band, not the picture. It fades to nothing well
   * before the middle, so the planet is untouched where anyone is looking.
   *
   */
  /**
   * The layer inspector.
   *
   * Ten toggles had accumulated in a menu, one at a time, and a menu is where
   * controls go to be forgotten — you cannot see the state of anything without
   * opening it, and you cannot compare two without opening it twice.
   *
   * Over the globe instead, because that is what they change. Closed by default,
   * because most people set these once.
   */
  #layers{
    position:absolute;top:14px;right:14px;z-index:5;width:206px;
    padding:9px 8px 10px;border-radius:var(--r-xl);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.35);
            backdrop-filter:blur(14px) saturate(1.35);
    box-shadow:inset 0 1px 0 var(--edge-hi), 0 0 0 .5px var(--edge-lo),
               0 14px 36px rgba(0,0,0,.42);
  }
  .layhead{
    padding:2px 8px 7px;font-size:11px;font-weight:590;color:var(--label2);
    letter-spacing:.02em;text-transform:uppercase;
  }
  .layrow{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:6px 8px;border:0;border-radius:var(--r-md);background:none;
    font:inherit;font-size:12.5px;cursor:default;text-align:left;
    transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out);
  }
  .layrow:hover{background:var(--fill)}
  /* A dot rather than a checkbox: ten checkboxes read as a form, and this is a
     set of things that are on or off in a picture. */
  .laydot{
    flex:none;width:9px;height:9px;border-radius:50%;
    box-shadow:inset 0 0 0 1.5px var(--label3);
    transition:background var(--dur-control) var(--ease-out),box-shadow var(--dur-control) var(--ease-out);
  }
  .layrow[aria-pressed="true"]{color:var(--label)}
  .layrow[aria-pressed="true"] .laydot{
    background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);
  }

     and left the name floating in the middle of its own gap. Truncation only
     ever needed the shrink half. */
  #nowName{flex:0 1 auto;min-width:0}
  #nowStatus{flex:0 1 auto;min-width:0}
  #nowName,#nowStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The prices keep their natural width and lose whole symbols instead. */
  .markets{flex:0 0 auto}

  /**
   * The on-air dot, and what it is actually telling you.
   *
   * For an internet stream it breathes steadily: the stream arrives or it does
   * not, there is nothing underneath it to measure, and a jitter invented to
   * look interesting would be the one dishonest pixel in an app whose whole
   * argument is that the terminator is where the terminator really is.
   *
   * For a shortwave receiver it is driven by the S-meter, which the Kiwi sends
   * in every audio frame. `--sig` runs 0 (buried in noise) to 1 (armchair copy),
   * and it moves two things at once: how far the dot falls on each cycle, and
   * how fast the cycle runs. A strong signal barely moves and looks like the
   * stream. A weak one flickers and hurries, the way a fading path sounds.
   *
   * One keyframe set, not two, so there is no threshold where the indicator
   * changes character — it is a continuum, because propagation is.
   */
  .dot{
    width:6px;height:6px;border-radius:50%;flex:none;
    /* Lit rather than filled. Apple's system colours are flat swatches; an
       instrument's indicator is a lamp, so this is a hot core, a body and a
       falloff, plus the light it throws. Derived from --accent, so it follows
       whichever palette is on. */
    background:radial-gradient(circle at 44% 36%,
      color-mix(in srgb, var(--accent) 55%, #fff) 0%,
      var(--accent) 52%,
      color-mix(in srgb, var(--accent) 72%, #000) 100%);
    box-shadow:0 0 5px 1px color-mix(in srgb, var(--accent) 42%, transparent);
    animation:pulse var(--pulse-dur,2s) ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:var(--pulse-min,.45)}}

  /* Receivers only. The irregular stops are the point: a sine wave reads as a
     heartbeat, and a fading shortwave signal does not have a heartbeat. */
  .dot.sig{animation-name:flutter;animation-timing-function:linear}
  @keyframes flutter{
    0%{opacity:1}      11%{opacity:var(--pulse-min,.45)}
    18%{opacity:.92}   30%{opacity:calc(var(--pulse-min,.45) * .7)}
    43%{opacity:1}     51%{opacity:var(--pulse-min,.45)}
    62%{opacity:.8}    70%{opacity:calc(var(--pulse-min,.45) * .85)}
    86%{opacity:1}     100%{opacity:var(--pulse-min,.45)}
  }
  @media (prefers-reduced-motion: reduce){ .dot{animation:none;opacity:1} }
  #play{
    flex:none;width:26px;height:26px;border-radius:50%;border:0;cursor:default;
    /* --on-accent, not a hardcoded dark: the popover's transport already used
       the token, so in the light theme its glyph was white and this one was
       nearly black. Two play buttons, same app, different colours. */
    background:var(--accent);color:var(--on-accent);font-size:12px;
    transition:background var(--dur-control) var(--ease-out),color var(--dur-control) var(--ease-out),transform var(--dur-press) var(--ease-out);
    display:grid;place-items:center;
    transition:transform var(--dur-press) var(--ease-out),opacity var(--dur-control) var(--ease-out);
  }
  #play:active{transform:scale(.92)}
  /**
   * Paused reads as an outline, not a filled disc.
   *
   * Filled-accent for both states meant that in some palettes the glyph and the
   * button were near enough the same value that the control disappeared while
   * paused — exactly when you need to find it. An outlined button is also the
   * more truthful shape: filled means running.
   */
  body:not(.playing) #play{
    background:transparent;color:var(--accent);
    box-shadow:inset 0 0 0 1.5px var(--accent);
  }
  /* auto, not 10px. Two groups rather than eight items in a row: the controls
     that act on this station stay with it on the left, and volume plus the
     ticker are their own thing on the right. The gap between them is whatever
     the window has spare. */
  .volwrap{flex:none;display:flex;align-items:center;gap:5px;margin-left:auto}
  #mute{
    background:none;border:0;color:var(--label2);font-size:15px;line-height:1;
    padding:2px;border-radius:var(--r-sm);cursor:default;transition:color var(--dur-hover) var(--ease-out);
  }
  #mute:hover{color:var(--label)}
  #vol{width:84px;accent-color:var(--accent)}
  /* Colour, not opacity, and stated rather than inherited.
     This set no `color` at all, so it took the user agent's button default,
     which is black in both appearances. On the light bar that measured 4.6:1
     and looked fine; on the dark one it was 1.04:1, which is a black icon on a
     near-black bar. Melton could not see it and neither could anything else.
     A resting opacity of .55 on top of a themed colour is the same trap one
     step further on, so the resting state is a token and hover raises it. */
  #lock{
    flex:none;background:none;border:0;font-size:15px;line-height:1;cursor:default;
    padding:3px 5px;border-radius:var(--r-sm);color:var(--label2);
    transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out),transform var(--dur-press) var(--ease-out);
  }
  #lock:hover{background:var(--fill);color:var(--label)}
  #lock:active{transform:scale(.9)}
  #lock[aria-pressed="true"]{color:var(--label);background:color-mix(in srgb,var(--accent) 24%,transparent)}
  .now b{font-weight:590}
  .now span{color:var(--label2)}

  /* Large-display breathing room. Must be last in the sheet: an earlier media
     block loses to the equally-specific base rules that follow it. */
  @media (min-width: 2200px){
    .toolbar{height:60px}
    .placehead{padding:0 26px 16px}
    .placehead h2{font-size:23px}
    .scroll{padding:0 15px 16px}
    .secthead{padding:2px 23px 6px}
    .now{padding:13px 27px 13px 26px;font-size:13px}   /* 15px scroll + 12px row */
    #play{width:30px;height:30px}
    #vol{width:110px}
    .st{padding:9px 12px}
    .place{padding:7px 12px}   /* 12px like .st, so both lists share an edge */
  }
  /* Headlines cross-fade one at a time rather than scrolling. A marquee fights
     prefers-reduced-motion and moving text is simply harder to read. */
  /**
   * A crawl, not a slideshow.
   *
   * This used to swap one headline for another every nine seconds and clip
   * whatever did not fit — so on a narrow window you could never read a whole
   * headline, and on any window you could not read the ones already gone. Now
   * every headline sits in one strip that moves continuously, at a duration
   * derived from its length so the pace is the same with three items or thirty.
   *
   * It moves leftward, which is what makes it readable: the words arrive in
   * reading order. A right-to-left interface needs the opposite, and that
   * belongs with real RTL support rather than as a lone switch.
   */
  /* Chat, under the station list. It shares the rail rather than taking a
     window: this is ambient, and it should never be the thing you are looking
     at when you came here to listen. */
  #chat{
    flex:none;display:flex;flex-direction:column;max-height:246px;
    box-shadow:inset 0 .5px 0 var(--line);
  }
  /* 17px, matching the station names: the list insets rows 7px and each row
     pads its text another 10px. The chat was on 15 and its input on 13, which
     is close enough to read as a mistake rather than as a variation. */
  .chathead{
    flex:none;display:flex;align-items:baseline;gap:8px;padding:9px 17px 5px;
    font-size:11px;color:var(--label2);letter-spacing:.005em;
  }
  /* The frequency box, sitting where the receiver list begins. Same weight as
     the search field it echoes — this is a way in, not a control panel. */
  .freqrow{padding:8px 15px 6px}
  /* Plain reporting, not a headline. Same weight as the listener count in chat. */
  .rxtotal{padding:5px 1px 0;font-size:10.5px;color:var(--label3);
           letter-spacing:.005em;font-variant-numeric:tabular-nums}
  #freqinput{
    width:100%;height:26px;padding:0 9px;border:0;border-radius:var(--r-md);
    background:var(--fill);color:var(--label);font:inherit;font-size:12px;outline:none;
    box-shadow:inset 0 0 0 .5px var(--line);
    font-variant-numeric:tabular-nums;
    transition:box-shadow var(--dur-control) var(--ease-out);
  }
  #freqinput::placeholder{color:var(--label3);font-variant-numeric:normal}
  #freqinput:focus{box-shadow:inset 0 0 0 1px var(--accent)}
  #freqinput[aria-invalid="true"]{box-shadow:inset 0 0 0 1px var(--err)}
  #chatpeers{margin-left:auto;color:var(--label3);font-variant-numeric:tabular-nums}
  /* Same weight as the listener count beside it — a readout you can press,
     not a call to action. It earns the accent only when something is waiting. */
  #chatdms{
    appearance:none;border:0;background:none;padding:0 0 0 9px;margin:0;
    color:var(--label3);font:inherit;font-size:11px;letter-spacing:.005em;
    cursor:default;font-variant-numeric:tabular-nums;
    transition:color var(--dur-hover) var(--ease-out);
  }
  #chatdms:hover{color:var(--label2)}
  #chatdms.unread{color:var(--accent);font-weight:590}
  #chatdms[aria-expanded="true"]{color:var(--label)}
  .convos{
    flex:1;min-height:0;overflow-y:auto;padding:2px 7px 6px;
  }
  .convos .row{
    display:flex;align-items:baseline;gap:8px;width:100%;
    appearance:none;border:0;background:none;text-align:left;
    padding:7px 10px;border-radius:var(--r-md);color:var(--label);
    font:inherit;font-size:12px;cursor:default;
  }
  .convos .row:hover{background:var(--edge-hi)}
  .convos .row .nm{font-weight:590;flex:none}
  .convos .row .last{color:var(--label3);font-size:11px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1}
  .convos .row .when{color:var(--label3);font-size:10px;flex:none;
    font-variant-numeric:tabular-nums}
  .convos .row .dot{
    flex:none;width:6px;height:6px;border-radius:var(--r-pill);background:var(--accent);
  }
  .convos .none{padding:22px 12px;color:var(--label3);font-size:11.5px;text-align:center}
  #chatlog{flex:1;min-height:0;padding:0 17px 6px;overflow-y:auto}
  .msg{padding:3px 0;font-size:12px;line-height:1.42;word-wrap:break-word}
  .msg .who{color:var(--label2);font-weight:590}
  /* Your own line is tinted rather than aligned right: a twenty-kilometre
     public square is not a DM thread, and it should not look like one. */
  .msg.mine .who{color:var(--accent)}
  #chatform{flex:none;padding:0 7px 11px}
  #chatinput{
    width:100%;appearance:none;border:0;border-radius:var(--r-md);background:var(--fill);
    color:var(--label);font:inherit;font-size:12px;padding:8px 10px;
  }
  #chatinput::placeholder{color:var(--label3)}
  #chatinput:disabled{opacity:.5}
  /* Valid, unresolved, private — three states the border says without words.
     The words are in #chatmode; this is the glance version. */
  #chatinput.cmdok{box-shadow:inset 0 0 0 1px var(--accent)}
  #chatinput.cmdbad{box-shadow:inset 0 0 0 1px var(--err)}
  #chatinput.dm{box-shadow:inset 0 0 0 1px var(--accent);background:var(--edge-hi)}
  .cmdmode{
    min-height:14px;padding:4px 10px 0;font-size:10.5px;line-height:1.3;
    color:var(--label3);letter-spacing:.005em;
  }
  .cmdmode.warn{color:var(--err)}
  .cmdmode.priv{color:var(--accent)}
  .cmdmode b{font-weight:590;color:var(--label2)}
  /* The bar that says which conversation you are in. */
  .dmbar{
    flex:none;display:flex;align-items:center;gap:8px;margin:0 7px 6px;
    padding:6px 10px;border-radius:var(--r-md);background:var(--fill);
    font-size:11px;color:var(--accent);
  }
  .dmbar #chatdmwho{font-weight:590}
  .dmbar button{
    margin-left:auto;appearance:none;border:0;background:none;padding:0;
    color:var(--label2);font:inherit;font-size:10.5px;cursor:pointer;
  }
  .dmbar button:hover{color:var(--label)}
  /* Names offered while typing a command that needs one. */
  .cmdnames{
    flex:none;margin:0 7px 4px;padding:3px;border-radius:var(--r-md);
    background:var(--fill);max-height:96px;overflow-y:auto;
  }
  .cmdnames button{
    display:flex;width:100%;gap:8px;appearance:none;border:0;background:none;
    padding:4px 7px;border-radius:var(--r-sm);color:var(--label);font:inherit;
    font-size:11px;text-align:left;cursor:pointer;
  }
  .cmdnames button:hover,.cmdnames button[aria-selected="true"]{background:var(--edge-hi)}
  .cmdnames .k{margin-left:auto;color:var(--label3);font-size:10px;font-variant-numeric:tabular-nums}
  .cmdnames .q{color:var(--label3);font-size:10px}

  /**
   * The dial.
   *
   * This was deleted once, by a de-duplication that removed both copies instead
   * of one, and the symptom was seven raw browser buttons sitting in a themed
   * app. Worth a note because the failure is silent: unstyled controls still
   * work perfectly.
   */
  #tuner{
    flex:none;padding:9px 15px 6px;display:flex;flex-direction:column;gap:6px;
    box-shadow:inset 0 -.5px 0 var(--line);
  }
  /* Time downward, frequency across, tuned frequency dead centre — the
     convention every radio has used since the first panadapter. */
  /**
   * The waterfall, and the eighty-eight pixels of nothing that used to sit here.
   *
   * The canvas is a fixed height, so the moment the dial appears there is a
   * black rectangle holding space for a spectrum that has not arrived — and it
   * does not arrive quickly. The other end is a volunteer's BeagleBone reached
   * over a WebSocket, so seconds is normal, and for those seconds the panel read
   * as broken rather than busy.
   *
   * The space is kept, because collapsing and re-expanding it would shove the
   * whole rail down the moment the first row landed. What changes is that it now
   * says what it is doing. Dead space becomes a status line.
   */
  #wfwrap{position:relative}
  #wf{
    width:100%;height:88px;display:block;border-radius:var(--r-md);background:#05070c;
    image-rendering:pixelated;   /* one bin is one pixel; do not invent detail */
  }
  #wfwait{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    gap:7px;font-size:11px;color:var(--label3);letter-spacing:.01em;pointer-events:none;
  }
  #wfwrap.waiting #wfwait{display:flex}
  #wfwait::before{
    content:"";width:5px;height:5px;border-radius:50%;background:currentColor;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ #wfwait::before{animation:none} }
  .trow{display:flex;align-items:center;gap:5px}
  .trow > button{
    appearance:none;border:0;border-radius:var(--r-md);cursor:default;
    background:var(--fill);color:var(--label2);
    font:inherit;font-size:11.5px;font-weight:510;padding:6px 0;flex:1;
    transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out),transform var(--dur-press) var(--ease-out);
  }
  .trow > button:hover{background:var(--fill-hi);color:var(--label)}
  .trow > button:active{transform:scale(.95)}
  .tb{font-size:13px;line-height:1;max-width:38px}
  #tfreq{
    flex:1;text-align:center;font-size:13px;font-weight:590;
    font-variant-numeric:tabular-nums;letter-spacing:-.012em;
    white-space:nowrap;color:var(--label);
  }
  #bw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  #bw button[aria-pressed="true"]:hover{background:var(--accent);color:var(--on-accent)}
  @media (prefers-reduced-motion: reduce){ .trow > button{transition:none} }

  /* The cold open — what fills the rail before anything is selected. */
  #coldopen{padding:0;text-align:left}
  .colead{padding:10px 15px 2px;font-size:12px;line-height:1.5;color:var(--label2)}
  .colead b{color:var(--label);font-weight:590}
  .cohead{
    padding:14px 15px 4px;font-size:11px;font-weight:590;color:var(--label2);
    letter-spacing:.005em;
  }
  .conote{padding:2px 15px 8px;font-size:11px;color:var(--label3);line-height:1.45}

  /* --label2, not --label3. At 30% the empty star measured 1.76:1 on the light
     bar and 2.48:1 on the dark one, so it failed the 3:1 floor for a control in
     both appearances rather than only one. A control nobody can see is not a
     subtle control. */
  #nowStar{
    background:none;border:0;color:var(--label2);font-size:15px;line-height:1;
    padding:2px 4px;cursor:default;flex:none;
    transition:color var(--dur-hover) var(--ease-out),transform var(--dur-press) var(--ease-out);
  }
  #nowStar:hover{color:var(--star)}
  #nowStar:active{transform:scale(.9)}
  #nowStar.on{color:var(--star)}
  /* First run. */

  /**
   * The prices.
   *
   * They went to a rail strip when the headline ticker needed room, and came
   * back once the ticker was removed — the pop-out headlines card had been doing
   * that job better all along, so running a scroller underneath it was two
   * solutions to one problem. Back at the right of the transport, which is where
   * a glanceable number belongs.
   */
  /**
   * The prices.
   *
   * Sized to sit inside the rail's column rather than spilling under the globe.
   * Three symbols at 11.5px with 14px gaps came to 380px in a 340px rail, so the
   * strip started 55px into the map — the one element in the window that did not
   * respect the split. Tighter type and gaps bring it inside; it is a tertiary
   * read-out and can afford to be small.
   */
  .markets{
    /* No auto margin here. volwrap already carries it, and flexbox splits
       free space evenly between every auto margin, which parked the volume
       halfway across the bar instead of beside the prices. */
    flex:0 1 auto;min-width:0;display:flex;align-items:center;
    gap:9px;padding-left:10px;overflow:hidden;
    max-width:calc(var(--rail) - 7px);
    font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .markets .ch{font-size:10px}
  .markets .m{flex:none}
  .markets .m{display:flex;align-items:baseline;gap:5px}
  .markets .sym{color:var(--label2);font-weight:590;letter-spacing:.01em}
  /* Tabular figures wherever a number changes in place. A price that ticks
     twice a second must not reflow the row it sits in, and a frequency that
     steps by 10 Hz must not shuffle sideways under the cursor. Inter ships
     tnum and a slashed zero; both are on here and nowhere else, because
     proportional figures read better in prose. */
  .markets .px, #tfreq, #sunreadout, .railtabs button, .num{
    font-variant-numeric:tabular-nums slashed-zero;
  }
  .markets .px{color:var(--label)}
  .markets .ch{font-size:11px}
  .markets .up{color:var(--accent)}
  .markets .dn{color:var(--err)}
</style>
</head>
<body>

<div class="toolbar">
  <span class="sp"></span>
  <button id="newsBtn" title="Local headlines" data-i18n-title="ctl.localHeadlines"></button>
  <button id="layersBtn" title="Layers" data-i18n-title="ctl.layers" aria-pressed="false"></button>
  <button id="favBtn" title="Favorites" data-i18n-title="app.favorites"></button>
  <input id="q" type="search" placeholder="Search a city, country, or station" data-i18n-ph="app.searchPlaceholder"
         autocomplete="off" spellcheck="false">
</div>

<div class="cols">

  <div class="globecol">
    <div class="globewrap" id="globewrap">
      <div id="globe"></div>
      <!-- The read-outs, over the planet they describe rather than in a strip
           above it. Small, tinted, and out of the way — they are ambient facts,
           not a status bar, and most people will never need to read them. -->
      <div class="globebar" id="globehint" hidden><span id="globestatus" data-i18n="app.loadingGlobe">Loading globe…</span></div>
      <!-- Layers. One button, closed by default, over the globe it controls —
           rather than ten items in a menu nobody opens. -->
      <div id="layers" hidden>
        <div class="layhead" data-i18n="ctl.layers">Layers</div>
        <div id="laylist"></div>
      </div>

      <aside class="newspanel" id="newspanel" hidden>
        <div class="newshead">
          <b id="newsplace">Headlines</b>
          <button id="newsSrc" title="Change source" data-i18n-title="ctl.changeSource"></button>
          <button id="newsClose">×</button>
        </div>
        <div class="newslist" id="newslist"></div>
      </aside>
    </div>
  </div>

  <!-- First run. Radio, shortwave and ham are genuinely unfamiliar to most
       people now, and an interface that assumes otherwise is a large part of
       why this technology reads as inaccessible rather than merely old. -->

  <div class="stations">
    <div class="placehead" id="head" hidden><h2></h2><p></p><div class="hop" id="hop" hidden></div><div class="wx" id="wx"></div>
      <div class="chips" id="chips"></div>
    </div>
    <!-- The dial. Only while a receiver is playing; a stream has nothing to tune.
         It lives here rather than in the menu-bar popover because a spectrum
         display and seven controls do not belong in a window that exists to
         show what is playing. -->
    <div id="tuner" hidden>
      <div id="wfwrap">
        <canvas id="wf" width="512" height="88"></canvas>
        <div id="wfwait" data-i18n="tuner.waiting">Listening for the spectrum…</div>
      </div>
      <div class="trow">
        <button class="tb" data-hz="-coarse">&laquo;</button>
        <button class="tb" data-hz="-fine">&lsaquo;</button>
        <b id="tfreq">—</b>
        <button class="tb" data-hz="+fine">&rsaquo;</button>
        <button class="tb" data-hz="+coarse">&raquo;</button>
      </div>
      <div class="trow" id="bw">
        <button data-w="narrow" data-i18n="sdr.narrow">Narrow</button>
        <button data-w="normal" data-i18n="sdr.normal">Normal</button>
        <button data-w="wide" data-i18n="sdr.wide">Wide</button>
      </div>
    </div>
    <div class="railtabs" id="railtabs" role="radiogroup" hidden></div>
    <div class="secthead" id="placehead"></div>
    <div class="scroll" id="placelist" hidden></div>
    <div class="scroll" id="stationlist">
      <div class="empty">Spin the globe, or search for a city.</div>
    </div>

    <!-- Only ever visible when presence is on and something is playing. -->
    <div id="chat" hidden>
      <div class="chathead">
        <span id="chatwhere"></span>
        <span id="chatpeers"></span>
        <!--
          Private conversations are scoped to a person; everything else in this
          panel is scoped to a place. Mixing them put a message to one person in
          every room's log and carried it from city to city. So they live behind
          this, and it is not here at all until there is one — the cost of the
          feature is zero for everyone who never uses it.
        -->
        <button id="chatdms" hidden></button>
      </div>
      <!-- The drawer. Opens over the log rather than beside it: a 300px panel
           has one column, and two lists competing for it is the crowding this
           architecture exists to avoid. -->
      <div class="convos" id="chatconvos" hidden role="list"></div>
      <!--
        The private conversation is a place you are in, not a prefix you retype.
        This bar is how you can tell, and the only way out that does not involve
        guessing. bitchat's /msg does the same thing — it starts a conversation
        rather than sending one message — and their users are in our rooms.
      -->
      <div class="dmbar" id="chatdm" hidden>
        <span id="chatdmwho"></span>
        <button type="button" id="chatdmout" data-i18n="chat.leaveDm">Back to the room</button>
      </div>
      <div class="scroll" id="chatlog"></div>
      <!-- Names you can act on, offered rather than guessed at. -->
      <div class="cmdnames" id="chatnames" hidden role="listbox"
           aria-label="People here"></div>
      <form id="chatform" autocomplete="off">
        <input id="chatinput" type="text" maxlength="400"
               placeholder="Say something to this place"
               data-i18n-ph="chat.placeholder"
               aria-describedby="chatmode">
        <!--
          What pressing Enter will do, in words, before it happens. A composer
          with two modes and no indicator is the bug this fixes: you could not
          tell a private message from a public one until after you sent it.
          aria-live so it is announced, polite so it does not interrupt typing.
        -->
        <div class="cmdmode" id="chatmode" aria-live="polite"></div>
      </form>
    </div>
  </div>
</div>

<div class="now" id="now" hidden>
  <button id="play"></button>
  <!-- Order is the layout. The two controls that act on this station sit
       together, then the on-air lamp sits against the name it describes. The
       lamp used to fall between the lock and the star, which read as three
       unrelated things rather than a pair and a label. -->
  <button id="lock" title="Lock this station while you browse" data-i18n-title="ctl.lockStation"></button>
  <button id="nowStar" title="Favorite" data-i18n-title="ctl.favorite" hidden></button>
  <span class="dot" id="dot"></span>
  <b id="nowName"></b>
  <span id="nowStatus"></span>
  <!-- Announced, not shown. The visible name and status are two separate
       elements that change together, so a live region on either one alone would
       say "Connecting…" without ever saying to what. This carries both. -->
  <span id="nowSpoken" class="sronly" role="status" aria-live="polite"></span>
  <span class="volwrap">
    <button id="mute"></button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
  </span>
  <span class="markets" id="markets"></span>
</div>
