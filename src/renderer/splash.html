<!doctype html>
<meta charset="utf-8">
<!--
  The first thing anyone sees.

  Deliberately the cheapest page in the app: no scripts beyond twenty lines, no
  fonts, no images to decode, no preload. It has to be on screen before the
  globe has done anything at all, which means it cannot depend on anything the
  globe depends on.

  Onyx and bone, because that is the brand and this is the one screen where
  there is nothing else to look at.

  It is not a progress bar and does not pretend to be. A fake bar that fills at
  a made-up rate is the same lie as a jittering signal indicator — it says it
  knows something it does not. The wave under the name moves, which is honest
  about being busy without claiming to know for how long.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self';">
<title>AuralFM</title>
<style>
  :root{
    /* Corner radii. Thirteen distinct values became five. Not one value for
       everything -- a 2px meter bar and a floating panel genuinely differ --
       but a scale, so nested corners stay concentric instead of arbitrary. */
    --r-sm:5px; --r-md:7px; --r-lg:10px; --r-xl:14px; --r-pill:999px;
  }
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  body{
    display:flex;align-items:center;justify-content:center;
    -webkit-app-region:drag;               /* it is a window; let it be moved */
    -webkit-user-select:none;user-select:none;
  }
  /* No buttons here, but the rule is blanket for a reason: the moment one is
     added inside a drag region it silently stops being clickable. Scoped under
     `body` because that is the element carrying the drag. */
  body button{-webkit-app-region:no-drag}

  /* Onyx is not flat black. Same gradient as the app icon, so the splash and the
     thing in the Dock are recognisably one object. */
  #card{
    width:100%;height:100%;border-radius:var(--r-xl);
    background:radial-gradient(125% 125% at 26% 20%, #2A2622 0%, #171514 45%, #0C0B0B 100%);
    box-shadow:inset 0 .5px 0 rgba(233,226,212,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  #mark{width:96px;height:96px;color:#F7F4EE}     /* bone, as in the logo kit */
  #mark svg{width:100%;height:100%;display:block}
  /* The wave, as in the app (explore.html .wave): the mark holds still and the
     five bars under the name carry "busy". It used to be the mark breathing;
     the bars are the same sign the app shows for a station connecting, so the
     first wait and every later one look alike. Copied rather than linked:
     this page loads nothing it does not have to. */
  .wave{--wave:18px;display:flex;align-items:center;gap:calc(var(--wave) * .14);height:var(--wave);color:#B3AEA3;margin-top:4px}
  .wave i{display:block;width:calc(var(--wave) * .14);height:100%;background:currentColor;transform:scaleY(.3);animation:wave 1.1s cubic-bezier(.77,0,.175,1) infinite}
  .wave i:nth-child(2){animation-delay:.11s}
  .wave i:nth-child(3){animation-delay:.22s}
  .wave i:nth-child(4){animation-delay:.33s}
  .wave i:nth-child(5){animation-delay:.44s}
  @keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  /* Still, a standing wave: each bar named, so none is left at the .3 it
     starts from. */
  @media (prefers-reduced-motion: reduce){
    .wave i{animation:none}
    .wave i:nth-child(1){transform:scaleY(.45)}
    .wave i:nth-child(2){transform:scaleY(.75)}
    .wave i:nth-child(3){transform:none}
    .wave i:nth-child(4){transform:scaleY(.75)}
    .wave i:nth-child(5){transform:scaleY(.45)}
  }
  #name{
    font:590 12px/1 -apple-system, system-ui, sans-serif;
    letter-spacing:.14em;text-transform:uppercase;color:#B3AEA3;   /* bone at about 72%, solid: 6.8:1 at the card's lightest corner; .42 was 3.3:1 */
  }
</style>

<div id="card">
  <div id="mark"></div>
  <div id="name">AuralFM</div>
  <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<script src="errors.js"></script>
<script src="splash.js"></script>
