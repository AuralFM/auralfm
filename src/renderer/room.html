<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; font-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self';">
<title>AuralFM · Listening room</title>
<style>
  /*
   * The listening room: the app's globe on a ceiling, for people lying under it.
   *
   * A backdrop, not a screen to read: the globe fills the room and turns
   * slowly, as it does in the app. The words are few and quiet, in the site's
   * grammar (a Space Mono eyebrow, a hairline, the town in Inter at a medium
   * weight), with neon green only for "live". Nothing to press here: the host
   * steers from Explore's room panel. Keys are hidden unless H is pressed.
   */
  @font-face{font-family:"Room Mono";font-weight:400;font-display:swap;src:url("fonts/SpaceMono-400.woff2") format("woff2")}
  @font-face{font-family:"Room Mono";font-weight:700;font-display:swap;src:url("fonts/SpaceMono-700.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:100 900;font-display:swap;src:url("../../assets/fonts/InterVariable.woff2") format("woff2")}
  :root{
    --onyx:#0C0B0B; --bone:#F7F4EE; --bone2:rgba(247,244,238,.8); --soft:rgba(247,244,238,.62);
    --live:#10F205; --hair:rgba(247,244,238,.3);
    --mono:"Room Mono", ui-monospace, Menlo, monospace;
    --sans:Inter, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --pad:clamp(24px,4vmin,72px);
    color-scheme: dark;
  }
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;background:#000;color:var(--bone);overflow:hidden}
  body.idle{cursor:none}
  #globe{position:fixed;inset:0}
  /* Only under the words, so the globe stays the picture. */
  .veil{position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;
        background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0))}
  .eye{font:400 clamp(12px,1.4vmin,20px)/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .brand{position:fixed;left:var(--pad);top:var(--pad);font-weight:700;color:var(--bone2)}
  .mode{position:fixed;right:var(--pad);top:var(--pad);text-align:right}
  .here,.wait{position:fixed;left:var(--pad);right:var(--pad);bottom:var(--pad)}
  .here .eye{display:flex;align-items:center;gap:.9em;color:var(--bone2)}
  .dot{width:.7em;height:.7em;border-radius:50%;background:var(--live);flex:none}
  .tuning .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--bone2)}
  .rule{height:1px;background:var(--hair);margin:clamp(8px,1.2vmin,18px) 0 clamp(12px,1.6vmin,24px);max-width:min(52vw,900px)}
  /* Clipped for a name too long for one line, so room is left under it for descenders. */
  .town{margin:0;padding-bottom:.14em;font:500 clamp(32px,6.5vmin,120px)/.9 var(--sans);letter-spacing:-.04em;color:var(--bone);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
  .station{margin-top:clamp(6px,1vmin,16px);font:400 clamp(16px,2.2vmin,36px)/1.2 var(--sans);letter-spacing:-.01em;color:var(--bone2);max-width:60vw;text-wrap:balance}
  .wait .town{color:var(--bone2)}
  .next{position:fixed;right:var(--pad);bottom:var(--pad);text-align:right;max-width:30vw}
  /* The host's keys, when asked for: a column of mono lines under a hairline. */
  .keys{position:fixed;right:var(--pad);top:calc(var(--pad) * 2.2);display:grid;grid-template-columns:auto auto;column-gap:2.2em;row-gap:.5em;
        padding-top:1.1em;border-top:1px solid var(--hair);
        font:400 clamp(12px,1.4vmin,20px)/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bone2);
        transition:opacity .25s cubic-bezier(.215,.61,.355,1),visibility 0s linear 0s}
  .keys b{font-weight:700;color:var(--bone)}
  .keys.gone{opacity:0;visibility:hidden;transition:opacity .15s ease-in,visibility 0s linear .15s}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion: reduce){ .keys,.keys.gone{transition:none} }
</style>
</head>
<body>
<div id="globe" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<div class="eye brand" aria-hidden="true">AURAL.FM</div>
<div class="eye mode" id="mode" aria-hidden="true"></div>
<p class="sr" id="said" role="status" aria-live="polite"></p>
<div class="wait" id="wait">
  <div class="eye">Listening room</div>
  <div class="rule"></div>
  <h1 class="town">Waiting for a station</h1>
</div>
<section class="here" id="here" hidden aria-live="polite">
  <div class="eye" id="eyebrow"><span class="dot" aria-hidden="true"></span><span id="eyetext"></span></div>
  <div class="rule"></div>
  <h1 class="town" id="town"></h1>
  <div class="station" id="station"></div>
</section>
<div class="eye next" id="next"></div>
<div class="keys gone" id="keys" role="note" aria-label="Keys for the host">
  <b>← →</b><span>Town before, next town</span>
  <b>↑ ↓</b><span>Next station here</span>
  <b>F V D K</b><span>Follow, favorites, drift, dial</span>
  <b>Space</b><span>Pause, play</span>
  <b>H</b><span>Hide these keys</span>
  <b>Esc</b><span>Leave the room</span>
</div>
<script src="errors.js"></script>
<script src="places.js"></script>
<script src="room.js"></script>
</body>
</html>
