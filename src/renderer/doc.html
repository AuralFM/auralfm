<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>AuralFM</title>
<style>
  :root{
    --label:rgba(255,255,255,.92); --label2:rgba(255,255,255,.58); --line:rgba(255,255,255,.12);
    --bg:#1c1c1e; --code:rgba(255,255,255,.07); --accent:#30D158;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.55); --line:rgba(0,0,0,.12);
      --bg:#fff; --code:rgba(0,0,0,.05); --accent:#248A3D;
    }
  }
  :root[data-theme="light"]{
    --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.55); --line:rgba(0,0,0,.12);
    --bg:#fff; --code:rgba(0,0,0,.05); --accent:#248A3D;
  }
  :root[data-theme="dark"]{
    --label:rgba(255,255,255,.92); --label2:rgba(255,255,255,.58); --line:rgba(255,255,255,.12);
    --bg:#1c1c1e; --code:rgba(255,255,255,.07); --accent:#30D158;
  }
  /* An explicit `display` in any rule below beats the [hidden] attribute, so
     hidden elements render anyway. This has been the root cause of four
     separate "the close button does nothing" bugs in this app. One global rule
     ends the category. */
  [hidden]{display:none !important}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--label);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;cursor:default;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .titlebar{height:38px;flex:none;-webkit-app-region:drag}
  /* Anything interactive placed here later must still be clickable — a drag
     region swallows clicks, and writing the opt-out per control is how the
     Layers button ended up only able to move the window. */
  .titlebar button,.titlebar input{-webkit-app-region:no-drag}
  main{flex:1;overflow-y:auto;padding:0 34px 44px;max-width:760px;width:100%;margin:0 auto;user-select:text}
  h1{font-size:24px;font-weight:700;letter-spacing:-.019em;margin:0 0 4px}
  h2{font-size:17px;font-weight:640;letter-spacing:-.012em;margin:26px 0 6px;padding-top:14px;border-top:.5px solid var(--line)}
  h3{font-size:14px;font-weight:620;margin:16px 0 4px}
  p,li{color:var(--label);margin:8px 0}
  em{color:var(--label2)}
  ul{padding-left:20px}
  hr{border:0;border-top:.5px solid var(--line);margin:22px 0}
  code{background:var(--code);padding:1px 5px;border-radius:4px;font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
  table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;display:block;overflow-x:auto}
  th,td{text-align:left;padding:6px 10px;border-bottom:.5px solid var(--line);vertical-align:top}
  th{font-weight:620;color:var(--label2);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  a{color:var(--accent)}
  strong{font-weight:620}
</style>
</head>
<body>
<div class="titlebar"></div>
<main id="doc"></main>
<script>
"use strict";
/**
 * A deliberately small Markdown subset — headings, tables, lists, emphasis,
 * code, rules and links. That is exactly what the two legal documents use.
 * Pulling in a Markdown library to render two files we wrote ourselves would be
 * a dependency for nothing.
 *
 * Everything is built with createElement and textContent, never innerHTML, so
 * document text can never become markup.
 */
const esc = (s) => s;

function inline(text, into) {
  // **bold**, *italic*, `code`, [label](url) — first match wins, left to right.
  const re = /\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/;
  let rest = text;
  for (;;) {
    const m = re.exec(rest);
    if (!m) { if (rest) into.append(document.createTextNode(rest)); return; }
    if (m.index) into.append(document.createTextNode(rest.slice(0, m.index)));
    let el;
    if (m[1] !== undefined)      { el = document.createElement("strong"); el.textContent = m[1]; }
    else if (m[2] !== undefined) { el = document.createElement("em");     el.textContent = m[2]; }
    else if (m[3] !== undefined) { el = document.createElement("code");   el.textContent = m[3]; }
    else {
      el = document.createElement("a");
      el.textContent = m[4];
      const href = m[5];
      // Only ever hand a URL to the OS browser; never navigate this window.
      el.href = "#";
      el.addEventListener("click", (e) => { e.preventDefault(); window.auralfm.openLink(href); });
    }
    into.append(el);
    rest = rest.slice(m.index + m[0].length);
  }
}

const cells = (line) => line.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

function render(md, root) {
  const lines = md.split("\n");
  let list = null, table = null;

  const endList  = () => { list = null; };
  const endTable = () => { table = null; };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const t = line.trim();

    if (!t) { endList(); endTable(); continue; }

    // table: a pipe row followed by a --- separator row starts one
    if (t.startsWith("|")) {
      if (!table && /^\|[\s:|-]+\|$/.test((lines[i + 1] || "").trim())) {
        table = document.createElement("table");
        const head = document.createElement("tr");
        for (const c of cells(t)) {
          const th = document.createElement("th"); inline(c, th); head.append(th);
        }
        table.append(head);
        root.append(table);
        i++;                                   // consume the separator
        continue;
      }
      if (table) {
        const tr = document.createElement("tr");
        for (const c of cells(t)) {
          const td = document.createElement("td"); inline(c, td); tr.append(td);
        }
        table.append(tr);
        continue;
      }
    } else endTable();

    if (/^---+$/.test(t)) { endList(); root.append(document.createElement("hr")); continue; }

    const h = /^(#{1,3})\s+(.*)$/.exec(t);
    if (h) {
      endList();
      const el = document.createElement("h" + h[1].length);
      inline(h[2], el);
      root.append(el);
      continue;
    }

    const li = /^[-*]\s+(.*)$/.exec(t);
    if (li) {
      if (!list) { list = document.createElement("ul"); root.append(list); }
      const el = document.createElement("li");
      inline(li[1], el);
      list.append(el);
      continue;
    }
    endList();

    const p = document.createElement("p");
    inline(t, p);
    root.append(p);
  }
}

(async () => {
  const name = new URLSearchParams(location.search).get("name") || "PRIVACY.md";
  const [md, prefs] = await Promise.all([
    window.auralfm.docText(name),
    window.auralfm.getPrefs(),
  ]);
  if (prefs.theme !== "system") document.documentElement.setAttribute("data-theme", prefs.theme);
  render(md || "# Not found", document.getElementById("doc"));
  const h1 = document.querySelector("h1");
  if (h1) document.title = h1.textContent;
})();
</script>
</body>
</html>
